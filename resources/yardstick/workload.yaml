# The yardstick workload (#390, #503): what is measured, on which Stores, with which
# queries. One Store per GWAS Store Layout (OGS-00009 Dense, OGS-00011 Hybrid,
# OGS-00027 Ragged). None has a Rho Matrix (`rho: false`), so the rho measures are
# `not_applicable`. Every input below was picked once, read-only through the engine's
# facade, by tools/yardstick_inputs.py: `lookup` holds 100 variants and 100 Analyses at
# evenly spaced rows of the Store's own tables, and `input_rows` is the row count one
# call per input returned. `workload.check` refuses an entry without a count for a
# measure it lists, or with a count of 0 (only top_hits may be empty). The runner
# refuses an empty result, so a Store that stops containing one fails loudly. `rsid`, `alid`, `position`,
# `analysis_id` and `region` are the #390 identifiers, unchanged.
#
# Changing this file changes what every later result means: bump `workload_id`
# and say why in docs/spec/yardstick.md.
schema: 1
workload_id: yardstick-6
# Warm repetitions behind each median. `analysis_full` is lower because one
# full extraction of an OGS-00009 Analysis reads ~9.9 million rows.
repetitions:
  default: 5
  analysis_full: 3
  analysis_full_observed_only: 3
  # Every variant row of OGS-00011 is 47.9 million.
  variants_table: 1
  analyses_table: 3
  resolve: 3
region_width_bp: 1000000
# The Dense fixture build (a 2-variant VCF through `opengwasdb build-dense-vcf`,
# ~6 s) tracks the build path (opengwas/opengwasdb#307). A Ragged fixture
# builder is not importable from this repository, so there is no Ragged build.
