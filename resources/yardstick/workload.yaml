# The LD section (opengwas/opengwasdb-stores#504): one LD Store and one Genotype Store, both
# HGDP+1kGP EUR k = 10 with Partner Rows, so the kind is the only difference: OGL-00006 (the EUR LD
# Store with its Partner Rows; OGL-00001, the served one, has none) and OGL-00007. Each is named by
# its LD Store Registry id; its location, kind and far_bp are read from its record
# (stores/ld/<ld_id>/record.yaml), never written here, and whether it has Partner Rows from its own
# provenance when it is opened. Every Store is measured on every LD query; one it cannot answer is
# `not_applicable` (docs/spec/yardstick.md, "The LD section").
# The sizes are the ticket's table, in the shapes of opengwasdb's scripts/ld/bench/latency.py (ogld#8).
# The variant lists were drawn once, read-only, by `python -m yardstick.ld pick <location>` from
# OGL-00007 (OGL-00001 and OGL-00006 give the same draws: the three hold one Variant Set).
ld:
  repetitions:
    default: 5
    # One clump reads the 37 Analyses' 1.6 million hits: ~20 s on OGL-00006, ~30 s on OGL-00007.
    clump: 3
  stores:
    - ld_id: OGL-00006
      kind: ld_store
    - ld_id: OGL-00007
      kind: genotype_store
  # matrix_500 is these 500; matrix_10 every 50th of them. latency.py's chr22 draw: seed 8.
  matrix:
    chromosome: "22"
