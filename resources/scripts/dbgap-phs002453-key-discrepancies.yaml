# Numeric-key discrepancies between the PMID 39024449 candidate table (GWAS
# Catalog metadata) and the dbGaP phs002453 GIA deposit metadata.
#
# `map` binds an Analysis to a candidate row by the exact key
# (ancestry, sample_size, n_cases, n_controls).  Where the two first-party
# sources disagree, the binding is never relaxed or guessed: this ledger names
# each disagreement with its primary evidence and its owner decision, and `map`
# re-validates every record against the extracted metadata and the candidate
# table on each run.
#
# A `resolved` record binds the named pair with match_basis=discrepancy-ledger
# and MUST carry an `owner_decision`.  An `owner_decision_required` record is
# reported as numeric_key_discrepancy and keeps the bijection gate red.  A stale
# record (keys now agree, member/candidate absent, or an entry already bound)
# fails the run loudly rather than passing silently.
#
# Evidence was captured 2026-10-11 from first-party sources only:
#   * dbGaP phs002453 GIA extracted metadata (the fields recorded under `dbgap`);
#   * GWAS Catalog EBI raw meta.yaml (md5 recorded per record);
#   * GWAS Catalog REST v2 study JSON (URLs recorded per record).
#
# Durable owner decision (created 2026-10-12 21:24:22 UTC):
#   https://github.com/opengwas/opengwasdb-stores/issues/220#issuecomment-6132878250
version: 1

