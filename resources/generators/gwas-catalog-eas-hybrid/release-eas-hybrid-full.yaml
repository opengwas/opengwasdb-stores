# Release config for the EBI GWAS Catalog hybrid__East-Asian release (OGS-00032).
#
# The release config schema is docs/spec/release-config.md (#287). This is
# OGS-00011's config (gwas-catalog-eur-hybrid/release-eur-hybrid-full.yaml)
# with the pool's own Selection, Dense Component axis, ancestry target and
# reviewed tables; every policy choice is OGS-00011's unless a comment says
# otherwise. The acquisition and connector files are described in this
# directory's README.

release_config_version: 1

label: eas-hybrid-full
association_coverage: gwas
access_posture: public
description: >
  Every ready Analysis in the hybrid__East-Asian candidate pool of the EBI GWAS
  Catalog harmonised GWAS-SSF Source Collection, resolved through AF-based
  ancestry assignment and phenotype-SD effect-scale estimation. Mixed study
  designs: quantitative Analyses carry an empirically estimated phenotype SD,
  and case-control Analyses are stored on the log-OR scale with SD estimation
  explicitly skipped rather than defaulted.
notes: >
  The candidate pool is 852 Analyses across 139 publications. EBI publishes a
  harmonised file for 709 of them; none of the other 143 has a GRCh38 raw file
  (20 are GRCh37, 123 publish no raw metadata sidecar), so this hg38 Hybrid
  Store takes harmonised files only, as OGS-00011 does. Only the subset the
  frozen Source Inventory records as ready becomes release membership.

source_collection:
  source_collection_id: gwas-catalog-ssf
  connectors:
    source_metadata_table: /data/opengwasdb/raw/ebi-gwas-catalog/connectors/2026-11-05/gwas-catalog-ssf-eas-hybrid.source-metadata.tsv
    acquisition_manifest: /data/opengwasdb/raw/ebi-gwas-catalog/connectors/2026-11-05/gwas-catalog-ssf-eas-hybrid.acquisition-manifest.tsv
  inventory:
    snapshot_id: gwas-catalog-ssf-eas-hybrid-2026-11-05
    directory: resources/inventories

selection:
  where:
    store_key: hybrid__East-Asian

build:
  layout: hybrid
  completion_state: observed_only
  command: build-hybrid
  options:
    # The Dense Component axis: gnomAD v4.1 variants common (MAF >= 1%) in its
    # EAS group, declared by resources/reference-resources/gnomad-v4-common-hg38.
    # OGS-00011 uses the EUR axis from the same resource.
    variant-reference: /data/opengwasdb/reference/gnomad-v4-common-hg38/EAS-variants.txt.gz
    n-workers: 24
    checkpoint: true
    source-reader-capability: opengwasdb.gwas-ssf
    source-assembly: hg38
  post:
    top_hits: false
    overview: true

defaults:
  source_genome_build: GRCh38
  license: EBI GWAS Catalog terms of use
  sample_size_scope: analysis_level
  info_score_threshold: 0.6
  maf_threshold: 0.005
  by_study_design:
    quantitative:
      stored_effect_scale: sd
      original_effect_scale: sd
      original_sd_method: estimated_from_source_maf
      sample_size_kind: total
    case-control:
      stored_effect_scale: log_or
      original_effect_scale: log_or
      original_sd_method: binary_trait
      sample_size_kind: case_control

release_policy:
  selection_superpopulation: EAS
  store_composition:
    require_maf_filtered: true
  imputation_score_declarations: resources/generators/gwas-catalog-eas-hybrid/score-declarations.tsv
  maf_filter_exempt_genotyping_technologies:
    - Whole genome sequencing
    - Exome-wide sequencing
  # The 107 of 709 ready Analyses with any +-2.2250738585072014e-308 effect,
  # excluded as effect_placeholder_rows by OGS-00011's rule (owner decision,
  # #441), whether the row's source effect was unestimated or a zero that EBI's
  # harmonisation wrote as +-DBL_MIN; each reason says which.
  effect_placeholder_exclusions: resources/generators/gwas-catalog-eas-hybrid/effect-placeholder-exclusions.tsv

reference_resources:
  - resource_id: ukb-ancestry-mixture-hg38
    kind: ancestry_mixture
    ancestry: multi
    super_populations: [AFR, AMR, EAS, EUR, MID, NAF, SAS]
    genome_build: GRCh38
    variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
    location: /data/opengwasdb/reference/ancestry-mixture/ref_freqs.hg38.tsv.gz
    location_kind: external_file
    fine_group_map: /data/opengwasdb/reference/ancestry-mixture/ancestry_groups.tsv
  - resource_id: canonical-trait-mapping-efo
    kind: trait_ontology_mapping
    location: resources/reference-resources/canonical-trait-mapping-efo
    location_kind: tracked_directory
    version: "3"

ancestry_assignment:
  reference_resource_id: ukb-ancestry-mixture-hg38
  maf_floor: 0.01
  extraction_panel: null
  gates:
    tau: 0.50
    delta: 0.20
    n_min: 5000
    residual_max: 0.06

effect_scale_validation:
  maf_min: 0.01
  maf_max: 0.5
  dispersion_max: 0.5
  # Source-AF-only, as OGS-00011 (#152): a quantitative Analysis lacking
  # usable source AF is excluded.
  reference_resources: []

trait_ontology_mapping:
  reference_resource_id: canonical-trait-mapping-efo

runtime:
  cores: 48
  min_free_gb: 50

output:
  work_root: /data/opengwasdb/work/gwas-catalog-eas-afr-hybrid/work
