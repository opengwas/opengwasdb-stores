store_family_id: eqtlgen-cis-pilot
family_release_id: pilot-10
label: pilot-10
access_posture: public
source_collection_id: eqtlgen-cis
release_kind: one-off
association_coverage: cis
description: "10 well-known genes' cis-eQTL summary statistics from the eQTLGen Consortium's 2019 whole-blood cis-eQTL meta-analysis (31,684 samples), built into a real Ragged Observed-Only Store via opengwasdb's existing build_ragged_from_besd(). Proves the BESD -> Ragged pipeline end to end; not the full eQTLGen cis-eQTL catalogue (19,250 genes)."
notes: "Probes chosen for well-characterised cis-eQTL signal and biological familiarity (lipid metabolism, immune response, tumour suppression), spanning 8 chromosomes and including one MHC-adjacent locus (TNF). Gene symbols for each Ensembl probe ID: ENSG00000175445=LPL, ENSG00000134243=SORT1, ENSG00000130203=APOE, ENSG00000073605=GSDMB, ENSG00000164308=ERAP2, ENSG00000232810=TNF, ENSG00000141510=TP53, ENSG00000136244=IL6, ENSG00000087237=CETP, ENSG00000136997=MYC."

source:
  source_snapshot_id: eqtlgen-2019-cis-full
  besd_prefix: /data/besd/eqtlgen-sparse
  source_genome_build: hg19
  # Every Analysis's tissue. Written into the Release Manifest's `tissue`
  # column, not passed to build-ragged-besd, which would also name the
  # analysis_id `<probe>::<tissue>` (issue #319).
  tissue: whole_blood

selection:
  probe_ids:
    # LPL -- lipoprotein lipase, chr8
    - ENSG00000175445
    # SORT1 -- chr1, classic LDL-cholesterol eQTL locus
    - ENSG00000134243
    # APOE -- chr19
    - ENSG00000130203
    # GSDMB -- chr17, asthma-associated
    - ENSG00000073605
    # ERAP2 -- chr5, classic strong eQTL
    - ENSG00000164308
    # TNF -- chr6, MHC-adjacent, immune
    - ENSG00000232810
    # TP53 -- chr17, tumour suppressor
    - ENSG00000141510
    # IL6 -- chr7, immune
    - ENSG00000136244
    # CETP -- chr16, lipid metabolism
    - ENSG00000087237
    # MYC -- chr8, oncogene
    - ENSG00000136997

output:
  # Registry Release Bundle id (ADR 0022). The working bundle lives in the work
  # root, <artifact-root>/OGS-00001/generate; --mode=emit-registry emits it into
  # stores/OGS-00001/ through the one emitter (#248), which refuses to replace a
  # bundle that has been accepted or built.
  store_id: OGS-00001
  artifact_root: /data/opengwasdb
  artifact_subdir: eqtlgen-cis-pilot/releases/pilot-10

# The observed-only Build Recipe the registry bundle carries, as registered in
# stores/OGS-00001/build.yaml. --mode=emit-registry renders build.yaml from it.
# No `tissue` option: with one, opengwasdb names each Analysis
# `"<probe>::<tissue>"`, and an analysis_id never contains ':' (issue #319). The
# generator writes source.tissue into the Release Manifest's tissue column.
build:
  layout: ragged
  completion_state: observed_only
  command: build-ragged-besd
  options:
    source-build: hg19
  post:
    top_hits: false
    overview: false
