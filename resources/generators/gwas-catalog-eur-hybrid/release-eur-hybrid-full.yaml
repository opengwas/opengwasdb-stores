# Release config for the EBI GWAS Catalog hybrid__European release (OGS-00011).
#
# The release config schema is docs/spec/release-config.md (#287). This file
# replaces config-full.yaml for every new run; config-full.yaml stays unchanged
# because OGS-00011's generator.commands cite it.
#
# Membership comes from the frozen Source Inventory named below, never from a
# glob over the acquisition mirror (/data/opengwasdb/raw/ebi-gwas-catalog,
# ~1.9 TB, never copied). That snapshot is the shared freeze (#283) of the
# GWAS Catalog's two connector files for this Selection, refreshed by #491 from
# the GWAS Catalog's 2026-11-19 release:
#   - the Source Metadata Table the GWAS Catalog adapter writes from
#     providers/gwas_catalog/ebi-studies.r's candidate table, curated from that
#     release (sha256 80e29438...);
#   - the Acquisition Manifest the GWAS Catalog writer overlays from five
#     download passes: September's base, retry_transient and
#     rescue_upstream_harmonised; refresh_2026_11_19, the candidates new to the
#     pool; and reacquire_changed_upstream, the 21 sources EBI replaced since
#     September (each in reacquired-2026-11-20/, beside the September bytes).
#     resources/generators/gwas-catalog-eur-hybrid/acquisition-retirements.tsv
#     retires the candidates the release no longer lists.
# The connector files, the pass lineage and the candidate table are kept,
# read-only, in /data/opengwasdb/raw/ebi-gwas-catalog/connectors/2026-11-20/;
# 2026-10-24/ holds OGS-00011's first set (curated from the 2026-07-10
# release). Their selected rows are frozen beside the inventory and
# checksummed into its provenance. A new acquisition or a changed Selection is
# a re-freeze under a new snapshot id, with source_collection.connectors naming
# the new connector files.

release_config_version: 1

label: eur-hybrid-full
association_coverage: gwas
access_posture: public
description: >
  Every ready Analysis in the hybrid__European candidate pool of the EBI GWAS
  Catalog harmonised GWAS-SSF Source Collection, resolved through AF-based
  ancestry assignment and phenotype-SD effect-scale estimation. Mixed study
  designs: quantitative Analyses carry an empirically estimated phenotype SD,
  and case-control Analyses are stored on the log-OR scale with SD estimation
  explicitly skipped rather than defaulted.
notes: >
  The candidate pool is 6,219 Analyses (GWAS Catalog release 2026-11-19). Only the
  subset the frozen Source Inventory records as ready becomes release membership;
  the remaining inputs stay inventory facts and are never selected. Two
  accession pairs are byte-identical under different accessions and are reported
  for an explicit review decision instead of being silently collapsed
  (`sidecars/source_readiness.tsv` and `duplicates` in the preflight report).

  Release Erratum (issue #478, 2026-11-22): this bundle replaces the one the
  OGS-00011 Store published on 2026-11-01 was built from, on the owner's
  decision of 2026-11-22 to re-emit and rebuild it under its own id. It is
  re-resolved at opengwasdb 0.14.1 from the GWAS Catalog's 2026-11-19 release
  (#491). Membership moves from 3,169 to 3,245 Analyses. Thirteen leave,
  refused at resolution: GCST002047, GCST004461 and GCST90165257, whose effect
  contradicts their own p-value (#403, #412, ADR 0069), the Store having held
  statistics read from a mislabelled effect column; GCST90014299 to
  GCST90014304, GCST90444480 and GCST90833021, whose p-value test is MR-MEGA
  (opengwasdb#371, ADR 0085); and GCST90572740 and GCST90572741, whose beta/se
  is deflated against their own p-value (ADR 0069). Eighty-nine join: 66 of
  the 103 Analyses new to the catalogue; 19 previously excluded as
  ancestry_unassigned whose sources EBI has since re-harmonised; GCST90278455
  and GCST90278456, previously ancestry_unassigned, whose sources are
  unchanged and whose ancestry residual now falls below the gate; and
  GCST90627758 and GCST90627773, which the catalogue now records as
  quantitative. The Dense axis is the reference-first gnomAD generation
  (opengwasdb ADR 0079, #381): a deletion is spelt reference first, so its z
  has the opposite sign to the published Store's, and a deletion and an
  insertion at one position are two variants. The rebuild writes format
  0.2.3, which stores an SE beyond float16's range as missing and counts it
  (opengwasdb ADR 0068), so the eight +inf SE cells of the 2026-11-01 erratum
  (#401) are not stored again. #225's on-rsid-conflict: drop and hm3
  overflow-only: skip are carried.

  Per Analysis, #478 refuses rather than remaps. GCST90165257 cannot be
  remapped: its standard_error is NA throughout. GCST002047 (odds ratios in
  `beta`) and GCST004461 (log-odds in `odds_ratio`) could be read through a
  Column Map of their own, but a release reads one Column Map and the
  resolver takes one per run, so remapping them is left as a separate change.

  #487's gwas-ssf-no-p Column Map is not carried. Without it GCST90446466 is
  refused at resolution as `resolution_failed`, and the recorded detail
  calls its z deflated; that is the effect-consistency check reading its
  `p_value`, which holds 1 - p/2 (owner ruling of 2 Nov 2026,
  opengwasdb#370), not a fault in its beta/se. Through the map it resolves at
  0.14.1 but fails the ancestry gate (residual 0.219 against 0.06), so it is
  excluded either way.

  Until the rebuild publishes, the Store served as OGS-00011 is the
  3,169-Analysis build of 2026-10-26/27, completed and validated on
  2026-11-01, from the bundle committed at 373f9a0f, whose notes carry its
  errata (#225, #401, #403, #412). In that Store the statistics of
  GCST002047, GCST004461 and GCST90165257, and every cell Reference
  Completion imputed from them, are wrong and must not be used.

source_collection:
  source_collection_id: gwas-catalog-ssf
  inventory:
    # Refreshed from the GWAS Catalog's 2026-11-19 release (#491). The
    # 2026-10-24 snapshot (#347) is the one OGS-00011's published Store was
    # built from; its inventory TSV is byte-identical to the 2026-09-22 one.
    snapshot_id: gwas-catalog-ssf-eur-hybrid-2026-11-20
    directory: resources/inventories
  connectors:
    source_metadata_table: /data/opengwasdb/raw/ebi-gwas-catalog/connectors/2026-11-20/gwas-catalog-ssf.source-metadata.tsv
    acquisition_manifest: /data/opengwasdb/raw/ebi-gwas-catalog/connectors/2026-11-20/gwas-catalog-ssf-eur-hybrid.acquisition-manifest.tsv

# Every Analysis the candidate table's curation groups as hybrid__European
# (its ancestry_group is European for all 6,219).
selection:
  where:
    store_key: hybrid__European

# The observed-only Hybrid Build Recipe the candidate carries (issue #153).
# It is a registry fact plus opengwasdb flags: the artifact root is deployment
# configuration, never a bundle field (issue #126), and `command` names a
# subcommand, never an import path (ADR 0023).
build:
  layout: hybrid
  completion_state: observed_only
  command: build-hybrid
  options:
    # The Dense Component axis: gnomAD v4.1 common variants at MAF >= 1%
    # (13,718,605 ALIDs; chr1-22, X, Y, MT), declared by
    # resources/reference-resources/gnomad-v4-common-hg38. The X, Y and MT rows
    # do not resolve yet (opengwas/opengwasdb#216) and route to the Ragged
    # Overflow.
    #
    # The regenerated, reference-first generation (opengwasdb ADR 0079, #381).
    # The engine refuses the first generation, which OGS-00011's 2026-10
    # Store was built from (13,415,936 ALIDs, sorted indels), at its first
    # indel; #478's rebuild moves to this one.
    variant-reference: /data/opengwasdb/reference/gnomad-v4-common-hg38-v2/EUR-variants.txt.gz
    # Pass 2 forks only when this is > 1; a Hybrid build reads every row.
    # Throughput is flat above 8 workers (#154) and the build shares the host.
    # 10, not 24: at engine 0.14.1 a worker held about 34 GB (PSS + swap), and
    # 24 of them beside the host's LD API exhausted its 1,006 GB (#478,
    # 2026-11-22). --checkpoint lets a failed build --resume (#227).
    n-workers: 10
    checkpoint: true
    # A variant its sources name with two rsids stores none, and the build
    # counts them (#225, opengwasdb#306).
    on-rsid-conflict: drop
    source-reader-capability: opengwasdb.gwas-ssf
    source-assembly: hg38
  post:
    top_hits: false
    overview: true

# The maintained hm3 Indexed Variant Subset, plus #225's overflow-only: skip:
# an hm3 ALID only the Hybrid's Overflow carries stays out of the subset, which
# records how many (opengwasdb#324).
indexed_subsets:
  - name: hm3
    resource_id: hapmap3-hg38
    variant_list: /data/opengwasdb/reference/hapmap3-hg38/hm3.grch38.alid.txt
    reference_assembly: GRCh38
    checksum: 4a7c82aa625a006ff437dcaa2769b00e056413d54c72e98f7378327c69513398
    options:
      overflow-only: skip

defaults:
  # Collection-wide facts the GWAS Catalog adapter does not write (#283): the
  # build of EBI's harmonised files and the EBI GWAS Catalog terms of use.
  source_genome_build: GRCh38
  license: EBI GWAS Catalog terms of use
  sample_size_scope: analysis_level
  # Requested INFO floor once a per-Analysis declaration and resolver evidence
  # prove a usable score (#175); explicit 0 disables filtering.
  info_score_threshold: 0.6
  # Requested per-Analysis MAF floor (#176), emitted only on resolver evidence.
  # 0.005 is the operator's choice for this release, independent of the
  # Dense-Component panel's own MAF >= 1% axis.
  maf_threshold: 0.005
  # One method tier per study design: this release mixes designs, so a single
  # stored_effect_scale cannot describe both. A ready Analysis whose design has
  # no tier fails preflight.
  by_study_design:
    quantitative:
      stored_effect_scale: sd
      original_effect_scale: sd
      # Source-provided allele frequencies (ADR 0019); a quantitative Analysis
      # whose source AF is unusable is excluded, not estimated against a
      # reference this release does not declare.
      original_sd_method: estimated_from_source_maf
      sample_size_kind: total
    case-control:
      stored_effect_scale: log_or
      original_effect_scale: log_or
      original_sd_method: binary_trait
      sample_size_kind: case_control

release_policy:
  # The Assigned Ancestry check tests each Analysis against this; it never
  # moves an Analysis (ADR 0036).
  selection_superpopulation: EUR
  # Store composition (issue #203, ADR 0033): a shared Store admits only
  # Analyses whose rows were MAF-filtered; the 148 sequencing Analyses exempted
  # below are excluded as not_maf_filtered and belong in a separate Store.
  store_composition:
    require_maf_filtered: true
  # Reviewed per-Analysis provider score declarations (#176), derived by
  # derive_score_declarations.py.
  imputation_score_declarations: resources/generators/gwas-catalog-eur-hybrid/score-declarations.tsv
  # Sequencing-only studies are exempt from the MAF floor (#176, 2026-09-28):
  # their low-frequency calls are observed, not imputed. An Analysis that also
  # lists an array is still filtered.
  maf_filter_exempt_genotyping_technologies:
    - Whole genome sequencing
    - Exome-wide sequencing
  # GCST90428462 and GCST90428463 carry effect_allele_frequency 0.0 on every
  # row, which core reads as missing (#176, 2026-09-29).
  maf_filter_exempt_analyses: resources/generators/gwas-catalog-eur-hybrid/maf-filter-exemptions.tsv
  # opengwasdb#371 (owner ruling 20 Nov 2026): five Analyses whose low-frequency
  # rows contradict their own p-value take a higher MAF floor, each chosen from
  # the whole-file measurement as the lowest that leaves about 1% of hits false.
  maf_threshold_overrides: resources/generators/gwas-catalog-eur-hybrid/maf-threshold-overrides.tsv
  # opengwasdb#371, ADR 0085: the test each source's p-value comes from, for
  # every Analysis that is not a 1-df Wald test or whose label suggests it is
  # not. The 8 MR-MEGA Analyses are refused by the resolver (owner: drop); the
  # 35 joint 2-df tests resolve with the effect-consistency check skipped.
  p_value_tests: resources/generators/gwas-catalog-eur-hybrid/p-value-tests.tsv
  # The 27 included Analyses with a +-2.2250738585072014e-308 placeholder
  # effect, excluded as effect_placeholder_rows until core refuses it (#285).
  effect_placeholder_exclusions: resources/generators/gwas-catalog-eur-hybrid/effect-placeholder-exclusions.tsv

reference_resources:
  - resource_id: ukb-ancestry-mixture-hg38
    kind: ancestry_mixture
    ancestry: multi
    super_populations: [AFR, AMR, EAS, EUR, MID, NAF, SAS]
    genome_build: GRCh38
    variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
    location: /data/opengwasdb/reference/ancestry-mixture/ref_freqs.hg38.tsv.gz
    location_kind: external_file
    fine_group_map: /data/opengwasdb/reference/ancestry-mixture/ancestry_groups.tsv
    # Canonical declaration: resources/reference-resources/ukb-ancestry-mixture-hg38/resource.yaml
  - resource_id: canonical-trait-mapping-efo
    kind: trait_ontology_mapping
    location: resources/reference-resources/canonical-trait-mapping-efo
    location_kind: tracked_directory
    version: "3"

ancestry_assignment:
  reference_resource_id: ukb-ancestry-mixture-hg38
  maf_floor: 0.01
  # Method A, the full 5.8M reference scan, is retained: the 10k qc-panel-hg38
  # failed the preregistered concordance gate (#152,
  # docs/qc-panel-concordance-report.md).
  extraction_panel: null
  gates:
    tau: 0.50
    delta: 0.20
    n_min: 5000
    residual_max: 0.06

effect_scale_validation:
  maf_min: 0.01
  maf_max: 0.5
  dispersion_max: 0.5
  # Source-AF-only (#152, Option 3): no reference-AF fallback is declared, so a
  # quantitative Analysis lacking usable source AF is excluded.
  reference_resources: []

trait_ontology_mapping:
  reference_resource_id: canonical-trait-mapping-efo

runtime:
  # Issue #150 caps this release at 64 cores; preflight refuses more.
  cores: 64
  min_free_gb: 50

output:
  work_root: /data/opengwasdb/work/gwas-catalog-eur-hybrid
