store_family_id: gwas-catalog-eur-hybrid
family_release_id: eur-hybrid-pilot-10
store_key: hybrid__European__pilot10-cc
source_collection_id: gwas-catalog-ssf
release_kind: one-off
association_coverage: full_gwas
description: >
  First 10 case-control Analyses from the hybrid__European candidate pool
  (resources/data/derived/store-candidates-analyses.tsv, 6,035 Analyses
  across 1,007 publications) -- a small, current, grounded proof that
  GWAS-Catalog-SSF sources build into a real Hybrid OpenGWASDB store via
  opengwasdb's GWAS-SSF Source Reader Capability (opengwasdb#84) and its
  Dense/Hybrid liftover fix (opengwasdb#85).
notes: >
  Deliberately restricted to case-control Analyses (stored_effect_scale=
  log_or, original_sd_method=binary_trait): this multi-publication pool has
  no single-family curated effect-scale method the way a single-paper Store
  Family does, so a quantitative Analysis's original_sd_method would need
  real reference-AF phenotype-SD estimation (issue #16's engine) to be
  honestly populated rather than assumed. Deferred to a follow-up release
  (opengwasdb-stores#70) rather than fabricated here. This pilot
  proves the Hybrid layout and the GWAS-SSF Source Reader Capability
  end-to-end; it does not yet prove quantitative-trait effect-scale coverage
  for this pool.

source:
  source_snapshot_id: gwas-catalog-v1.0.3.1-r2026-07-10
  ftp_base: http://ftp.ebi.ac.uk/pub/databases/gwas/summary_statistics

inputs:
  candidates: resources/data/derived/store-candidates-analyses.tsv

selection:
  store_key: hybrid__European
  ancestry_group: European
  study_design: case-control
  n_analyses: 10

defaults:
  source_genome_build: GRCh38
  license: EBI GWAS Catalog terms of use
  original_effect_scale: log_or
  original_sd_method: binary_trait
  stored_effect_scale: log_or
  sample_size_kind: case_control
  sample_size_scope: analysis_level
  ancestry_assignment_method: source_trusted_no_af
  analysis_group_id: gwas-catalog-eur-hybrid-pilot10
  inclusion_reason: first_10_case_control_eur_hybrid_pilot

download:
  timeout_seconds: 3600

output:
  release_dir: families/gwas-catalog-eur-hybrid/releases/eur-hybrid-pilot-10
  artifact_root: /data/opengwasdb
  artifact_subdir: gwas-catalog-eur-hybrid/releases/eur-hybrid-pilot-10

hybrid:
  source_reader_capability: opengwasdb.gwas-ssf
  source_assembly: hg38

reference_resources:
  - resource_id: hybrid-ieua-dense-panel
    kind: hybrid_dense_panel
    genome_build: GRCh38
    variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
    root: /data/opengwasdb/wip/hybrid-ieua/panel_alids.txt
    location_kind: external_file
