# Successor identity and replacement lineage for the restored full ukb-b release (#219).
#
# Owner decision recorded at
# https://github.com/opengwas/opengwasdb-stores/issues/219#issuecomment-6132878514:
# the restored 2,514-Analysis target replaces the incomplete historical pair, and
# successors OGS-00030 (observed) / OGS-00031 (completed) are the accepted
# reserved identities.
#
# This file codifies identity and lineage ONLY. It implies no Store Release
# acceptance and no production build, and it does not construct or store
# OGS-00031 or build OGS-00030.
source_collection_id: opengwas-gwas-vcf
store_key: ukb-b

historical:
  observed: OGS-00009
  completed: OGS-00010
  store_artifacts: preserve            # physical Stores must never be deleted
  release_bundle_retention: waived     # old bundle *definitions* need not be permanently archived
  retire_only_when: successor-activation-ready
  git_history_and_evidence: preserve   # minimal artifact lineage / evidence / Git history stays
  status: unchanged                    # not edited by this plan

successors:
  observed:
    store_id: OGS-00030
    label: ukb-b-full-observed-restored
    layout: dense
    completion_state: observed_only
    membership: 2514
    replaces: OGS-00009
    emitted: false                     # staged evidence only; not registered
  completed:
    store_id: OGS-00031
    label: ukb-b-full-completed-restored
    layout: dense
    completion_state: reference_completed
    derived_from: OGS-00030
    replaces: OGS-00010
    emitted: false                     # not constructed/stored yet
    reference_status: pending-owner-approval

lineage:
  # The Release Bundle schema has no `supersedes` field; replacement is recorded
  # here and by the historical releases' own status transition at the release
  # gate, never by editing OGS-00009/OGS-00010 now.
  OGS-00030: {replaces: OGS-00009, relation: successor-observed}
  OGS-00031: {replaces: OGS-00010, derived_from: OGS-00030, relation: successor-completed}

acceptance: none-implied
production_build: not-run
notes: >
  Retention clarification (issue #219 comment 6133853820): old bundle
  definitions may be retired / need not be permanently archived only once
  successor activation is genuinely ready; there is no premature deletion of
  active bundles while OGS-00030 is staged and OGS-00031 is absent. Physical
  OGS-00009/OGS-00010 Stores, minimal artifact lineage/evidence and Git history
  stay. The restored membership is the frozen Source Inventory
  ukb-b-restored-2026-10-11 (2,514 Analyses). Ancestry assignment in the staged
  candidate is source_fallback, not AF; core #277 (assign-ancestry liftover) and
  #207 (resolve-analyses MetricsReader) remain open. OGS-00009/OGS-00010 stay
  byte-identical until the release gate decides their status transition.
