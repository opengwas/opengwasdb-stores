# Identity for the full restored ukb-b release (#219, #222, #312).
#
# Owner decision, 2026-10-21 (refines #222's of 14 Oct in light of ADR 0037):
#   https://github.com/opengwas/opengwasdb-stores/issues/312#issuecomment-6326686714
# which refines
#   https://github.com/opengwas/opengwasdb-stores/issues/222#issuecomment-6158898093
#
# OGS-00009 is the full restored UKB-B Store, the 2,514 Analyses frozen in
# #219, as one single-id Reference-Completed release (ADR 0037): one bundle
# with `build` and `complete` blocks, completed against the owner-approved UKB
# EUR panel. OGS-00010, OGS-00030 and OGS-00031 are dropped and their ids are
# retired, never reused (ADR 0022). Nothing external depends on the old pair.
#
# This file records identity only. It implies no acceptance and no build.
source_collection_id: opengwas-gwas-vcf
store_key: ukb-b

store:
  store_id: OGS-00009
  label: ukb-b-full
  layout: dense
  completion_state: reference_completed   # single id, no derived_from (ADR 0037)
  membership: 2514                        # frozen Source Inventory ukb-b-restored-2026-10-11
  completion_reference: ukb-hg38-eur-ld   # /data/opengwasdb/reference/ld, ancestry EUR (EUR -> ukb)
  status: candidate                       # acceptance is the owner's
  replaces: >-
    the 2,024-Analysis OGS-00009 candidate, re-emitted in place (490 added,
    none removed), and its two-id completed child OGS-00010

retired:
  # Retired unused: no bundle of the new plan takes these ids, and no run may
  # reuse them.
  OGS-00010: the old OGS-00009's two-id completed child (ADR 0007); its bundle is removed
  OGS-00030: the observed successor #219 reserved; its candidate was only staged, never registered
  OGS-00031: the completed successor #219 reserved; never emitted

# What happens to the Stores published under the old ids. #312 supersedes
# #219's "preserve the physical Stores byte-identical always": once the new
# OGS-00009 is built, completed and its observed-view check has passed, the
# previous UKB-B Stores (the old OGS-00009 and OGS-00010) are deleted. The old
# OGS-00009 Store stays published until the new build phase replaces it, and
# OGS-00010's until then.
published_stores:
  OGS-00009: 2,024-Analysis observed Store, replaced by the new build phase (a forced run) and deleted once the new OGS-00009 completes
  OGS-00010: 2,024-Analysis completed Store, deleted after the new OGS-00009 completes

acceptance: none-implied
production_build: not-run
notes: >
  Ancestry in the bundle is the provider's population label (source_fallback,
  EUR), not an AF-based assignment; the owner accepted it for this build, with
  no AF assignment first (#312, 2026-10-21). The panel's qualification is the
  owner's approval (#219, #312) on read-only layout evidence; the gaps #219
  recorded are kept in the ukb-hg38-eur-ld resource notes. The pre-#312 plan, with
  OGS-00030/31 as successors, is in git history and in
  docs/ukb-restored-successors-plan.md.
