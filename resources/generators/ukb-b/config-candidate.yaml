# Candidate configuration for OGS-00009, the full restored ukb-b Store (#219, #312).
#
# Membership is the frozen ukb-b-restored-2026-10-11 Source Inventory (2,514
# Analyses). Owner decision 2026-10-21 (#312, refining #222's of 14 Oct): this
# is OGS-00009, re-emitted in place over the incomplete 2,024-Analysis
# candidate, and it is one single-id Reference-Completed release (ADR 0037):
# one bundle, built observed-only first and then completed under the same id
# against the owner-approved UKB EUR LD panel.
#
# Emit it with:
#
#   python3 -m manifest_generation.providers.ukb_b.generate_candidate OGS-00009
store_id: OGS-00009
store_family_id: ukb-b
source_collection_id: opengwas-gwas-vcf
access_posture: public
# The Source Inventory freezes membership and file identity; the provider JSON
# sidecars in the source mirror supply the Analytical Metadata the live OpenGWAS
# API would have (its token expired 2026-08-21).
source_snapshot_id: ukb-b-restored-2026-10-11
resolution_snapshot_id: ukb-b-provider-json-2026-10-11
inventory: resources/inventories/ukb-b-restored-2026-10-11.tsv
resolution: resources/inventories/ukb-b-provider-resolution-2026-10-11.tsv
declared: resources/inventories/ukb-b-restored-2026-10-11.declared-selection.tsv
label: ukb-b-full
description: >
  Full dense Store Release of all 2,514 UK Biobank (ukb-b) GWAS-VCF Analyses
  declared in the OpenGWAS IGD collection and verified present in
  /data/opengwasdb/raw/gwas-vcf/ukb-b, reference-completed under its own id
  against the UKB EUR LD panel (ADR 0037).
notes: >
  Membership is the frozen Source Inventory ukb-b-restored-2026-10-11: 2,514
  Analyses, each with a recorded sha256, size and mtime. It replaces the
  incomplete 2,024-Analysis candidate previously registered under this id,
  adding the 490 Analyses that candidate was missing and removing none; its
  two-id completed child OGS-00010 is retired, as are the successor ids
  OGS-00030/31 #219 reserved (#312). The Store is built observed-only, then
  completed against the UKB EUR LD panel (ukb-hg38-eur-ld) and replaced under
  the same id once the observed-view check passes. Analytical Metadata is
  resolved from each Analysis's provider JSON sidecar (exact-ID checked, batch
  checked, sha256-bound); that resolution agrees with the recorded
  opengwas-api-r2026-08-10 resolution on every one of the 2,511 rows it covered
  and supplies the three rows it had left unresolved. Ancestry is the provider's
  own population label (source_fallback), not an AF-based assignment; the ukb-b
  VCFs do carry FORMAT/AF, so the historical source_trusted_no_af value is not
  reproduced. The owner accepted these source labels (all EUR) for this build,
  with no AF assignment first (#312, 2026-10-21).
build_options:
  source-reader-capability: opengwasdb.gwas-vcf
  source-assembly: hg19
  n-workers: 32
post:
  top_hits: true
  overview: true
# Mirrors OGS-00009's maintained hm3 Indexed Variant Subset (epic #214). The
# format-0.2.0 runtime that provides build-indexed-subset is adopted by #218.
indexed_subsets:
  - name: hm3
    resource_id: hapmap3-hg38
    variant_list: /data/opengwasdb/reference/hapmap3-hg38/hm3.grch38.alid.txt
    reference_assembly: GRCh38
    checksum: 4a7c82aa625a006ff437dcaa2769b00e056413d54c72e98f7378327c69513398
defaults:
  license: UK Biobank terms of access
  consortium: MRC-IEU
  first_author: Ben Elsworth
  analysis_group_id: ukb-b
  source_genome_build: GRCh37
  # The batch is a documented single-ancestry European collection and the
  # earlier 2,024-Analysis candidate recorded European/EUR for every row. This
  # is a source-ancestry fallback, NOT an AF-based assignment: the ukb-b VCFs
  # carry a FORMAT AF field, so source_trusted_no_af (that candidate's value) is
  # factually wrong here, and af_assigned must not be claimed until
  # `opengwasdb resolve-analyses` actually runs (#222).
  source_ancestry_label: European
  assigned_ancestry: EUR
  ancestry_assignment_method: source_fallback
# Reference Completion (ADR 0037, #312). A reference that is `qualified` and
# `active` puts the `complete` block in OGS-00009's own bundle, with the panel
# and ancestry its Reference Resource declares; anything short of that emits the
# bundle observed-only. Qualification is the owner's: #219 approved this panel
# (issue comment 6132878514) and the #312 owner decision completes OGS-00009
# against it:
#   https://github.com/opengwas/opengwasdb-stores/issues/312#issuecomment-6326686714
# Activation is the `EUR -> ukb` alias under /data/opengwasdb/reference/ld
# (2026-10-21), which lets complete-dense's one --ancestry name both the panel
# directory and the Analyses. The verification gaps #219 recorded are kept in
# the resource's notes, not waived.
#
# No completed id is reserved: OGS-00010, OGS-00030 and OGS-00031 are retired
# unused and never reused, and the generator refuses `completed_store_id` or
# `planned_completed_store_id`.
completion_reference:
  resource_id: ukb-hg38-eur-ld
  qualification: qualified
  activation: active
