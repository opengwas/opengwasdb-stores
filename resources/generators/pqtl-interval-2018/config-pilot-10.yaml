store_family_id: pqtl-interval-2018
family_release_id: 2018-sun-pilot-10
store_key: ragged__pmid-29875488__European__pilot10
source_collection_id: gwas-catalog-ssf
release_kind: one-off
association_coverage: cis_plus_signals
description: >
  First 10 Sun et al. INTERVAL SomaScan plasma-proteome pQTL analyses
  (PMID 29875488) -- a deterministic prefix of the 100-analysis
  2018-sun-pilot-100 selection, built end-to-end through OpenGWASDB's real
  ragged builder as a small, current, grounded proof that this Store
  Family's pipeline (Trait Ontology Mapping, CURIE-normalised
  trait_ontology_id, analysis_label) actually produces a working store.
notes: >
  Deliberately not a replacement for 2018-sun-pilot-100 -- same source,
  same selection basis, just a small independent slice used to prove the
  build end-to-end without re-running the full 100-analysis pipeline.

source:
  source_snapshot_id: gwas-catalog-v1.0.3.1-r2026-07-10
  ftp_base: http://ftp.ebi.ac.uk/pub/databases/gwas/summary_statistics

inputs:
  candidates: resources/data/derived/store-candidates-analyses.tsv
  analysis_targets: resources/somascan/sun-2018-analysis-targets.tsv

selection:
  pubmed_id: 29875488
  store_key: ragged__pmid-29875488__European
  ancestry_group: European
  n_analyses: 10
  fail_if_target_unresolved: true

defaults:
  source_genome_build: GRCh38
  license: EBI GWAS Catalog terms of use
  publication_doi: 10.1038/s41586-018-0175-2
  consortium: INTERVAL; Sun et al. 2018
  original_effect_scale: sd
  original_sd_method: declared_standardised
  stored_effect_scale: sd
  sample_size_scope: analysis_level
  ancestry_assignment_method: source_trusted_no_af
  analysis_group_id: PMID29875488
  inclusion_reason: first_10_sun_2018_interval_pqtl_pilot
  tissue: plasma
  context: SomaScan

filter:
  region_policy_id: cis-1mb_sig-trans-1mb_suggestive-leads
  cis_flank_bp: 1000000
  trans_flank_bp: 1000000
  significant_p: 5.0e-8
  suggestive_p: 1.0e-5
  suggestive_lead_min_distance_bp: 100000
  download_timeout_seconds: 3600

output:
  release_dir: families/pqtl-interval-2018/releases/2018-sun-pilot-10
  artifact_root: /data/opengwasdb
  artifact_subdir: pqtl-interval-2018/releases/2018-sun-pilot-10

reference_resources:
  - resource_id: ukb-hg38-eur-af
    kind: reference_af
    ancestry: European
    genome_build: GRCh38
    variant_id_convention: "chr:pos_ref_alt"
    allele_columns:
      effect: EA
      other: OA
      freq: EAF
    root: /data/opengwasdb/reference/ukb-hg38
    ancestry_dir: EUR
    location_kind: external_directory

effect_scale_validation:
  enabled: true
  maf_min: 0.01
  maf_max: 0.5
  min_overlap_variants: 20
  sd_tolerance: 0.15
  warning_multiplier: 2.0
  dispersion_max: 0.5
  reference_resources:
    - ancestry: European
      resource_id: ukb-hg38-eur-af
