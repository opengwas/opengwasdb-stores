# Release config for the full eQTLGen cis-eQTL Store: every probe of the 2019
# whole-blood meta-analysis (31,684 samples), 19,250 Analyses (#314).
#
# Same shape as release-pilot-10.yaml (#291); the schema is
# docs/spec/release-config.md and the connectors are documented in
# docs/spec/source-connectors.md (the eQTLGen section). The Selection is the whole
# Source Collection, so the file set holds every probe: acquisition adopts the
# subset writer's output for all 19,250 probes, which differs from the original in its .besd (index renumbered) and .esi (20
# unreferenced SNPs dropped; 8,932,843 -> 8,932,823), with the same probes and
# 127,339,354 associations. Acquisition adopts that output only after the writer
# reproduces every member's sha256 now. Connectors, in the order they are written
# (--adopt-prefix names the durable location of the writer's output):
#   python3 -m manifest_generation.providers.eqtlgen.source_metadata_adapter \
#     --prefix /data/opengwasdb/raw/eqtlgen/full-19250 --tissue whole_blood \
#     --study-total 31684 --out resources/generators/eqtlgen-cis/connectors/eqtlgen-full.source-metadata.tsv
#   python3 -m manifest_generation.providers.eqtlgen.acquire \
#     --config resources/generators/eqtlgen-cis/release-full.yaml \
#     --source-prefix /data/opengwasdb/raw/eqtlgen/eqtlgen-sparse \
#     --adopt-prefix /data/opengwasdb/raw/eqtlgen/full-19250 \
#     --out resources/generators/eqtlgen-cis/connectors/eqtlgen-full.acquisition-manifest.tsv
# A new acquisition, a changed Selection or a changed connector is a re-freeze
# under a new snapshot id, never a rewrite of a frozen pass.

release_config_version: 1

label: eqtlgen-full
access_posture: public
description: >
  The full eQTLGen cis-eQTL catalogue on the shared Manifest Generation pipeline:
  all 19,250 probes (genes) of the 2019 whole-blood meta-analysis, with ancestry
  measured from the BESD source's own allele frequencies. A Ragged Observed-Only candidate.
notes: >
  Every probe of the genome-wide BESD file set, one Analysis each. The Store is
  read from the subset writer's file set for all 19,250 probes, not from the
  original bytes: it has the original's 19,250 probes and 127,339,354
  associations, and 8,932,823 SNPs against the original's 8,932,843, because the
  writer keeps only SNPs a probe references (20 are unreferenced) and renumbers
  the index. The original's sha256 and counts are the acquisition lineage. The source is
  on GRCh37 (hg19); the Store is GRCh38, lifted through liftover-hg19-to-hg38.
  Ancestry is measured by Analysis Resolution. The SD is declared, not estimated:
  eQTLGen's beta and SE are z-standardised with each SNP-gene pair's own N
  (b = z / sqrt(2p(1-p)(N + z^2)), se = 1 / sqrt(2p(1-p)(N + z^2))), so SD is 1 by
  construction and the original_sd cell stays blank, as for every
  declared_standardised tier. An estimated SD would only measure
  sqrt(31,684 / pair N): 29% of a 200-probe trial exceeded 1.5, and TNF's 2.04 is
  an N of about 7,600. Each Analysis's sample_size is the maximum over its pairs
  of N = 1 / (2p(1-p) se^2) - z^2 (z = b / se, p the .esi frequency), rounded to
  the nearest integer, over pairs with finite N and |z| >= 1, then capped at the
  study total of 31,684. The |z| bound is measured: against the published per-pair
  NrSamples (12 genes, 85,079 pairs) the derived N's relative error is up to 300%
  for |z| < 0.001, 0.4% at most for |z| 0.1-0.5, 0.08% for 0.5-1 and 0.04% from 1
  up; unbounded, 61% of probes took an N above 31,684. The cap absorbs what
  rounding noise remains (5,443 probes above 31,684, by at most 13). 5,456 of the
  19,250 probes (28%) take the cap: at least one of their pairs was measured in the
  study's full cohort set (N 31,684); the rest were covered by fewer cohorts
  (median 28,927, 1st percentile 3,833, minimum 232). sample_size_kind
  is variant_level. Per-association N is not stored yet (opengwasdb#302).

source_collection:
  source_collection_id: eqtlgen-cis
  connectors:
    source_metadata_table: resources/generators/eqtlgen-cis/connectors/eqtlgen-full.source-metadata.tsv
    acquisition_manifest: resources/generators/eqtlgen-cis/connectors/eqtlgen-full.acquisition-manifest.tsv
  inventory:
    snapshot_id: eqtlgen-cis-full-2026-10-22c
    directory: resources/inventories

# Every row of the Source Metadata Table: the 19,250 probes of the .epi.
selection:
  all: true
  expect_rows: 19250

# The observed-only Ragged Build Recipe, as in the pilot.
build:
  layout: ragged
  completion_state: observed_only
  command: build-ragged-besd
  options:
    source-build: hg19
  post:
    top_hits: false
    overview: false

defaults:
  # The source's build: eQTLGen's coordinates are hg19, and the resolver lifts
  # them to the reference's GRCh38.
  source_genome_build: GRCh37
  sample_size_scope: analysis_level
  # eQTLGen's beta and SE are z-standardised with each SNP-gene pair's own N
  # (b = z / sqrt(2p(1-p)(N + z^2)), se = 1 / sqrt(2p(1-p)(N + z^2))), so the
  # effect scale is SD units by construction and the tier declares it
  # (declared_standardised) instead of estimating a phenotype SD: an estimate would
  # only measure sqrt(study N / pair N). The resolver then reports
  # phenotype_sd scale_already_declared (#300). The Analysis's N is the maximum
  # over its pairs, derived from the file (see notes), so its kind is
  # variant_level.
  by_study_design:
    quantitative:
      stored_effect_scale: sd
      original_effect_scale: sd
      original_sd_method: declared_standardised
      sample_size_kind: variant_level

release_policy:
  # The Assigned Ancestry check tests each Analysis against this; it never moves
  # an Analysis (ADR 0036). eQTLGen is a European-ancestry meta-analysis;
  # ancestry is measured from the source allele frequencies, never taken from a label.
  selection_superpopulation: EUR

reference_resources:
  - resource_id: ukb-ancestry-mixture-hg38
    kind: ancestry_mixture
    ancestry: multi
    super_populations: [AFR, AMR, EAS, EUR, MID, NAF, SAS]
    genome_build: GRCh38
    variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
    location: /data/opengwasdb/reference/ancestry-mixture/ref_freqs.hg38.tsv.gz
    location_kind: external_file
    fine_group_map: /data/opengwasdb/reference/ancestry-mixture/ancestry_groups.tsv
    # Canonical declaration: resources/reference-resources/ukb-ancestry-mixture-hg38/resource.yaml
  - resource_id: liftover-hg19-to-hg38
    kind: liftover_chain
    location: /data/opengwasdb/reference/liftover/hg19ToHg38.over.chain.gz
    location_kind: external_file
    # Canonical declaration: resources/reference-resources/liftover-hg19-to-hg38/resource.yaml
  - resource_id: canonical-trait-mapping-efo
    kind: trait_ontology_mapping
    location: resources/reference-resources/canonical-trait-mapping-efo
    location_kind: tracked_directory
    version: "3"

ancestry_assignment:
  reference_resource_id: ukb-ancestry-mixture-hg38
  # eQTLGen is hg19, the reference GRCh38: the resolver lifts through this chain (#292).
  liftover_chain_resource_id: liftover-hg19-to-hg38
  maf_floor: 0.01
  extraction_panel: null
  gates:
    tau: 0.50
    delta: 0.20
    n_min: 5000
    residual_max: 0.06

effect_scale_validation:
  maf_min: 0.01
  maf_max: 0.5
  dispersion_max: 0.5
  reference_resources: []

trait_ontology_mapping:
  reference_resource_id: canonical-trait-mapping-efo

runtime:
  cores: 16
  min_free_gb: 1

output:
  work_root: /data/opengwasdb/work/eqtlgen-cis-full
