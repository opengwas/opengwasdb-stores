store_family_id: finngen-r13
family_release_id: r13-full
source_collection_id: finngen-r13
release_kind: full
association_coverage: full_gwas
label: r13-full
access_posture: public
description: >
  Full FinnGen R13 release: every endpoint in the frozen public
  summary-statistics manifest (2,754 endpoints -- three inverse-rank-normalised
  quantitative endpoints plus every case-control endpoint), selected in the
  manifest's own order. Production-scale sibling of the 20-Analysis
  r13-pilot-20 trial (OGS-00003); the pilot assessment is the onboarding
  evidence, and this release carries no analysis cap.
notes: >
  Selection is the whole frozen provider manifest, so the release membership is
  exactly what FinnGen publishes and the pinned manifest checksum makes the
  Analysis order reproducible. Every endpoint must still be honestly classified
  by the metadata resolver (a quantitative endpoint with num_cases=N, or a
  case-control endpoint with positive case and control counts); an endpoint the
  resolver cannot classify fails the emit rather than being dropped.

source:
  source_snapshot_id: finngen-r13-manifest-2026-05-12
  manifest_path: /data/opengwasdb/finngen-r13/releases/r13-full/manifest/finngen_R13_manifest.tsv
  manifest_url: https://storage.googleapis.com/finngen-public-data-r13/summary_stats/finngen_R13_manifest.tsv
  manifest_sha256: c9caafa9b98ee5ef050a705766bd1c451fc2154fb8e81b069022012a2f75ae20
  manifest_etag: a70f4ecb57acf7c23e8f5d71be11d936
  manifest_last_modified: 2026-05-12T12:48:15Z

defaults:
  source_genome_build: GRCh38
  license: FinnGen public data

selection:
  mode: full

reference_resources:
  - resource_id: hgdp1kgp-ancestry-mixture-hg38
    kind: ancestry_mixture
    genome_build: GRCh38
    location: /data/opengwasdb/reference/ancestry-mixture/ref_freqs.hg38.tsv.gz
    fine_group_map: /data/opengwasdb/reference/ancestry-mixture/ancestry_groups.tsv

ancestry_assignment:
  enabled: true
  reference_resource_id: hgdp1kgp-ancestry-mixture-hg38
  sampling_chromosome: 1
  max_reference_sites: 20000
  maf_floor: 0.01
  gates:
    tau: 0.50
    delta: 0.20
    n_min: 5000
    residual_max: 0.06

effect_scale_validation:
  enabled: true
  min_overlap_variants: 20
  sd_tolerance: 0.15

output:
  # Registry Release Bundle id (ADR 0022). The full release is emitted into
  # stores/<store_id>/ in the current bundle contract by --mode=emit-registry;
  # the legacy families/ release dir is kept as the acquisition work root that
  # acquire.py fills with checksums and sidecars.
  store_id: OGS-00016
  registry_root: stores
  release_dir: families/finngen-r13/releases/r13-full
  artifact_root: /data/opengwasdb
  artifact_subdir: finngen-r13/releases/r13-full
  planned_store_uri: /data/opengwasdb/finngen-r13/releases/r13-full/store.opengwasdb

# The observed-only Dense Build Recipe the registry bundle carries. It is a
# registry fact plus opengwasdb flags; no artifact root (issue #126), and
# `command` names a subcommand, never an import path (ADR 0023).
build:
  layout: dense
  completion_state: observed_only
  command: build-dense-vcf
  options:
    source-reader-capability: opengwasdb.finngen-r13
    source-assembly: hg38
    n-workers: 32
  post:
    top_hits: true
    overview: true

build_notes: >
  Build directly from the frozen full Release Manifest through the native
  opengwasdb.finngen-r13 Source Reader Capability. Source and target assembly
  are GRCh38, so no format conversion or liftover is used. The release is
  observed-only dense; reference completion is a separate derived release.
