# One entry per intended Store.
#
# `completion_reference` records the DECLARED reference only. A declaration of
# `status: available` is not a qualification or a science PASS: `qualification`
# and `activation` are separate, and each is stated per reference below. The MVP
# pipeline does not emit a completed bundle from this file; it records which
# panel an ADR 0037 bundle amendment may name. A missing suggested panel does
# not prevent a pending completed definition.
stores:
  EUR:
    observed_store_id: OGS-00012
    candidate_store_key: dense__pmid-39024449__European
    label: mvp-phs002453-eur
    assigned_ancestry: EUR
    source_ancestry_label: European
    intended_members: 1669
    # The European manifest still carries the legacy combined bucket; EUR and
    # META are distinguished by the mapping ancestry, not by this file.
    planned_manifest: dense-pmid-39024449-European-download-manifest.tsv
    resolution: pending
    completion_reference:
      # Qualified and active (#227, owner decision 2026-10-21). Qualification is
      # the owner's approval of this panel for completion; activation is the
      # `EUR -> ukb` alias under /data/opengwasdb/reference/ld, which lets
      # complete-dense's one --ancestry name both the panel directory and the
      # Analyses. The earlier `gpm-hg38-eur-ld` declaration named a Resource
