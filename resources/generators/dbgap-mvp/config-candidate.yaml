# Candidate configuration for the separate MVP ancestry and META Release
# Bundles (#221), from the dbGaP phs002453 acquisition of PMID 39024449.
#
# This file is a PROVISIONAL DRAFT. It plans *unbuilt, acceptance-pending
# candidates*. It never accepts, registers, builds, completes or publishes
# anything, and it never rewrites an existing Store or identity.
#
# Terminology: the 6,022 rows below are the INTENDED BOUND membership from the
# accepted dbGaP mapping. The acquisition is NOT accepted and no Source
# Inventory is frozen; membership, Analytical Metadata and every reference are
# pending owner acceptance and qualification.
#
# Identity allocation is owner-authorised (2026-10-13):
#   observed single-ancestry   OGS-00012 EUR, OGS-00013 AFR, OGS-00014 AMR, OGS-00015 EAS
#   META observed-only         OGS-00016
#   FinnGen                    OGS-00017 (migrated from OGS-00016)
#
# OGS-00018-OGS-00021 were reserved for ADR 0007 two-id reference completion
# (one "lineage-linked completed" id per single-ancestry Store). ADR 0037
# replaces that: completion is published under the Store's own id, so no Store is
# allocated those ids and none is ever reused. Below they are only this note. The
# #221 generator refused a Store that still declared `completed_store_id`
# (#308); #290 retired it, and the shared pipeline's release configs
# (release-*.yaml) refuse the key as unknown.
#
# A Store's completion is declared in its one bundle, with both a `build` and a
# `complete` block, once its `completion_reference` is `qualified` and `active`.
# A reference is qualified and active only where its entry below says so (owner
# decision 2026-10-21); AMR is on hold and META is not applicable, so those two
# Stores stay observed-only. Issue #221 emitted all five observed-only; a
# published Observed-Only Store is completed later by ADR 0037's one bundle
# amendment (#305), and the retired generator recorded the intended completion
# recipe beside the bundle as `<observed id>.completion-plan.yaml`, which the
# pipeline does not. See README.md.
#
# The owner decision "reorder the IDs" (2026-10-13) placed META ahead of
# FinnGen. FinnGen's bundle was migrated OGS-00016 -> OGS-00017 under ADR
# 0022's owner-authorized-renumbering amendment; its membership, recipe and
# association/index artifacts are unchanged.

