resource_id: hgdp1kgp-hg38-ld
label: HGDP+1kGP hg38 LD reference panels (AFR, EAS, SAS)
kind: ld_panel
ancestry: [AFR, EAS, SAS]
genome_build: GRCh38
variant_id_convention: "chr:pos:a1:a2"
allele_columns:
  effect: EA
  other: OA
  freq: EAF
  freq_orientation: effect_allele
location: /data/opengwasdb/reference/hgdp1kgp-hg38/panel
location_kind: external_directory
ld:
  representation: eigendecomposition
  block_file: ld_regions_hg38.tsv
  components_retained: variance_driven
  components_cumvar_target: 0.99
source:
  cohort: HGDP + 1kGP harmonised callset
  n_individuals:
    AFR: 804
    EAS: 817
    SAS: 783
  variant_inclusion: >
    MAC >= 50; of the records sharing an ALID, the one with the higher MAF,
    ties going to the earlier record
  population_map: populations_to_superpop.tsv
  acquisition: tools/ld-panel/acquire_hgdp1kgp.py
  generator: tools/ld-panel/
description: >
  Ancestry-specific LD Reference Panels for AFR, EAS and SAS, for reference
  completion of Analyses whose Assigned Ancestry matches. Natively GRCh38, so no
  liftover is applied. Same block layout and eigendecomposition format as
  `gpm-hg38-eur-ld`, but variant identifiers are canonical store ALIDs
  (`chr:pos:a1:a2`) rather than the EUR panel's `chr:pos_ref_alt`, so allele
  orientation is unambiguous at rest.
status: available
notes: >
  Structurally lower-powered than the EUR panel: HGDP+1kGP provides roughly
  500-1,000 individuals per super-population against UK Biobank's ~50,000, so
  these panels are rank-deficient where EUR is full-rank. This asymmetry is
  permanent and affects completion quality independently of the Analyses being
  completed. See ADR 0020.

  Panel membership mirrors the ancestry-assignment super-population definitions
  via an explicit recorded mapping. Admixed populations (1kGP ASW, ACB) are
  excluded from AFR: recent admixture creates long-range LD absent from
  continental African populations.

  A matched HGDP+1kGP EUR panel is built separately as a calibration control (not
  for production) to measure what the reduced sample size costs in imputation
  quality, holding ancestry fixed. That calibration passed on the repaired
  panels (2026-11-02, stores#348), and the owner decided on 2026-10-21 that the
  AFR and EAS panels ship: the AFR panel completes OGS-00013 and the EAS panel
  completes OGS-00015, each against the panel for its own Assigned Ancestry, as
  docs/reports/eur-panel-imputation-comparison.qmd recommends. This records a
  decision about these panels and claims no parity with the UKB EUR panel. The
  SAS panel has no MVP Store yet.

  Analyses assigned AMR have their own panel, `hgdp1kgp-hg38-amr-ld`, built on
  the EUR layout; see ADR 0020's amendment. Analyses assigned MID or NAF still
  have no panel and remain observed-only, because `ld_regions_hg38.tsv` defines
  blocks for AFR/EAS/EUR/SAS only.

  Canonical EUR boundaries were recovered from the 1,357 block artifacts at
  /data/opengwasdb/reference/ukb-hg38/EUR and pinned in ld_regions_hg38.tsv;
  this makes the matched EUR calibration layout identical to production.

  Generation completed on 2026-08-06: AFR has 1,580 blocks, SAS has 1,267,
  and EAS has 1,120 populated blocks. The remaining declared EAS interval,
  chr14:16038675-16100330, lies before the first MAC-filtered chr14 variant
  (18,223,583) and is explicitly empty rather than a failed decomposition.

  **EAF is the frequency of `EA`, and never of `OA`.** The generator reads which
  allele PLINK's additive export counted from the export's own column suffix --
  plink2 counts REF, not ALT (stores#348) -- and orients both the reported
  frequency and the eigenvectors to the canonical effect allele. A panel built
  before that fix holds the other allele's frequency in every row, so the gate is
  part of building one rather than an optional check: `run_panels` gates every
  ancestry it builds or finishes before a run may succeed, `verify_block --panel`
  gates a panel on demand, and both measure its EAF against the UKB ancestry
  mixture and refuse a panel that does not correlate positively with it (r > 0.9
  on matched variants, and never on fewer matches than a sample needs to decide).
  `tools/ld-panel/repair_panel.py`
  corrects such a panel in place with `EAF := 1 - EAF`, which is exact because
  the defect is uniform; it writes the originals to a backup directory, records
  the edit in each block's `provenance.json` under `repairs`, and adds a sha256
  receipt. A repaired block is verified against its backup, because a row drop
  (below) invalidates the exact `||X v_j||^2 = value_j` identity.

  **A block holds at most one row per ALID.** gnomAD splits multi-allelic
  sites, so an insertion and a deletion at one position can canonicalise to the
  same ALID; of the records that pass every filter, the one with the higher MAF
  is kept, a tie going to the earlier record. That rule is part of
  `variant_inclusion` now, and tables built before it are corrected by the same
  tool, which drops the losing rows from the TSV and from `vectors` (row i of
  the eigenvectors is row i of the table, so a drop is a row selection).
  `values` is left untouched: it is the full spectrum, and the consumer's
  cumulative-variance cut must keep its meaning. Dropping a row is exact for the
  stored LD, `V diag(values) V^T`.

  **Repaired in place on 2026-11-01/02 (stores#348).**
  `tools/ld-panel/repair_panel.py` was run on the shipped block files between
  2026-11-01 22:52 and 2026-11-02 00:06 UTC; no panel was rebuilt.
  - AFR: 1,580 blocks, 14,427,799 -> 14,136,388 rows (291,411 dropped, EAF
  flipped in all 14,136,388); orientation gate r -0.9625 (n=15,212) before, r
  +0.9780 (n=15,039) after, against "Africa (West)"; every block verified
  against its backup with no failures and unique ALIDs; receipt
  `/data/opengwasdb/reference/hgdp1kgp-hg38/repairs/20261101T225229Z-348-AFR.json`
  (sha256 `461efb2c7bd11451569ffd127c118c9e6ce5bf322f65ba7ced9dce0293289b94`).
  - EAS: 1,120 blocks, 8,845,379 -> 8,728,585 rows (116,794 dropped, EAF flipped
  in all 8,728,585); orientation gate r -0.9729 (n=24,394) before, r +0.9797
  (n=24,265) after, against "Asia (East)"; every block verified against its
  backup with no failures and unique ALIDs; receipt
  `/data/opengwasdb/reference/hgdp1kgp-hg38/repairs/20261101T225229Z-348-EAS.json`
  (sha256 `3996afe31e757a664b57e6edae14cb3e377581b8be405ee574eb1fa8d188cb6d`).
  - SAS: 1,267 blocks, 9,759,797 -> 9,618,254 rows (141,543 dropped, EAF flipped
  in all 9,618,254); orientation gate r -0.9727 (n=24,823) before, r +0.9804
  (n=24,681) after, against "Pakistan"; every block verified against its backup
  with no failures and unique ALIDs; receipt
  `/data/opengwasdb/reference/hgdp1kgp-hg38/repairs/20261101T225229Z-348-SAS.json`
  (sha256 `47b66f1951b5ef9adf3c8030a8ab81e87115e18e1006c94635b579a0e5f2933a`).
  The pre-repair files are kept, as hard links, under
  `/data/opengwasdb/reference/hgdp1kgp-hg38/replaced/20261101T225229Z-348/<ANC>/<ANC>/<chr>/<block>.*`.
