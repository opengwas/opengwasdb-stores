derivation:
  method: >-
    Allele-safe rsID resolution of the LDSC HapMap3 rsID list against the
    OGS-00009 GRCh38 Store Variant Table, performed by the sibling benchmark
    script `benchmarks/benchmark_indexed_subset.py`
    (`read_hapmap3` -> `resolve_hapmap3` -> `write_alid_list`), not by
    `build-indexed-subset --variant-list`: that consumer accepts an
    already-canonical ALID list and does not derive ALIDs from rsIDs. Each rsID
    is mapped to the Store row whose canonical ALID allele pair is compatible;
    rsIDs absent from the axis or allele-incompatible are not represented as
    matches, and an rsID with more than one allele-compatible Store row is
    refused rather than guessed.
  store: OGS-00009
  store_reference_assembly: GRCh38
  resolution_script: opengwas/opengwasdb benchmarks/benchmark_indexed_subset.py
  resolution_functions: [read_hapmap3, resolve_hapmap3, write_alid_list]
  resolution_revision: a36ea78
  rsids_requested: 1217311
  resolved: 1206903
  absent_from_store_axis: 10385
  allele_incompatible: 23
  multiple_store_rows: 2743
  duplicate_alids: 0
  evidence: >-
