description: >
  The maintained HapMap3 GRCh38 variant list used as the build input for the
  default `hm3` Indexed Variant Subset (epic opengwas/opengwasdb-stores#214,
  ticket #208). It is the 1,206,903-row canonical ALID list benchmarked in
  opengwas/opengwasdb#262/#267 against OGS-00009, preserved byte-for-byte: the
  declared `alid_sha256` is the checksum of the exact bytes the
  `build-indexed-subset` variant-list reader hashes.

  The list is not a pure function of the LDSC source alone. Of the source's
  1,217,311 rsIDs, 10,385 do not occur on the OGS-00009 GRCh38 axis and 23 have
  an incompatible allele pair, so they have no OGS-00009 ALID and are absent
  here rather than invented. `multiple_store_rows` counts rsIDs whose allele-
  compatible row had to be chosen among several Store rows sharing the rsID
  (the source list has no unique-rsID guarantee); they are resolved, not
  dropped, so the reconciliation balance is
  `1217311 - 10385 - 23 = 1206903 = row_count`. When a later Store's axis lacks
  some of these ALIDs, that is the ordinary "absent from the axis" case the
  subset builder already counts and reports -- it never changes this list.
status: available
notes: >
  Large data lives outside Git under the configured reference root (ADR 0015):
  this declaration points at `/data/opengwasdb/reference/hapmap3-hg38/`, which
  holds the 18.9 MB ALID list and the unmodified 5.2 MB LDSC source snapshot.
  Nothing here is tracked in the repository.

  Verify with `resources/reference-resources/hapmap3-hg38/verify_hm3_resource.py`,
  which refuses a missing, malformed, duplicate, non-canonical, wrong-length or
  checksum-mismatched list. The rule it applies is the pinned opengwasdb
  `parse_canonical_alid` round-trip, so it reads the same canonical-ALID
  convention the consumer does rather than a private copy.

  Consumers need an opengwasdb runtime that provides `build-indexed-subset`
  (opengwas/opengwasdb#264-#271). The repository pin (`opengwasdb 0.3.0`,
  revision 7b0c42d) is deliberately left unchanged here: adopting a newer
  runtime and Store format is the separate migration tracked by stores#197.
  stores#209 plans and runs the subset step and must document and preflight the
  newer-runtime prerequisite; this ticket only promotes the input resource and
  does not bump the pin.
