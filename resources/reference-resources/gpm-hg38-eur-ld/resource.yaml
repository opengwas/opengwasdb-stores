resource_id: gpm-hg38-eur-ld
label: UKB hg38 EUR LD reference panel
kind: ld_panel
ancestry: EUR
genome_build: GRCh38
variant_id_convention: "chr:pos_ref_alt"
allele_columns:
  effect: EA
  other: OA
  freq: EAF
location: /local-scratch/projects/genotype-phenotype-map/data/ld_reference_panel_hg38
location_kind: external_directory
ancestry_dir: EUR
ld:
  representation: eigendecomposition
  block_file: ld_regions_hg38.tsv
  n_blocks: 1357
  components_retained: variance_driven
  components_cumvar_target: 0.99
source:
  cohort: UK Biobank (imputed genotypes, RAP)
  n_individuals: 49766
  variant_inclusion: MAF >= 0.005
  generator: MRCIEU/ukb-rap-utils scripts/ld_matrix
description: >
  Production EUR LD Reference Panel used for reference completion. Laid out as
  `EUR/<chr>/<start>-<end>` blocks; each block carries a `.tsv` variant table
  (`CHR, SNP, OA, EA, EAF, BP`) and a `.ldeig.npz` eigendecomposition
  (`values` = all eigenvalues, `vectors` = retained eigenvectors), which is what
  completion consumes. Sibling `.unphased.vcor1.gz` LD matrices predate ADR 0031
  and are retained but not required; they are never read when the
  eigendecomposition is present.
status: available
notes: >
  Historical blocks stored a fixed 250 eigenvectors. The 12 blocks that lacked an
  eigendecomposition entirely were backfilled variance-driven (99% cumulative
  eigenvalue mass, floor 250), which required 250-516 components - evidence that a
  fixed count under-resolves some blocks even at this sample size. Retained
  component counts are therefore heterogeneous across the panel; consumers
  truncate further at load time and must surface any block where the retained set
  bounds the requested truncation.

  This is the same physical directory declared by `ukb-hg38-eur-af`, which
  consumes only the per-block allele-frequency columns for effect-scale
  validation. The two declarations describe different uses of one artifact, not
  two copies.

  Not reproducible at present: generation required UK Biobank RAP access, which is
  unavailable. See ADR 0020 for why non-EUR panels use a different cohort.
