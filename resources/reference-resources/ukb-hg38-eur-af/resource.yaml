resource_id: ukb-hg38-eur-af
label: UKB hg38 EUR reference allele frequencies
kind: reference_af
ancestry: European
genome_build: GRCh38
variant_id_convention: "chr:pos_ref_alt"
allele_columns:
  effect: EA
  other: OA
  freq: EAF
location: /data/opengwasdb/reference/ukb-hg38
location_kind: external_directory
ancestry_dir: EUR
description: >
  UK Biobank-derived LD-block-partitioned reference panel used as an
  ancestry-specific fallback allele-frequency source for reference-AF
  effect-scale validation (issue #16) when a Source Collection does not
  provide usable source allele frequencies. Laid out as
  `EUR/<chr>/<start>-<end>.tsv` blocks with columns `CHR, SNP, OA, EA, EAF, BP`;
  `structural_ld_blocks_lookup.tsv` and `chrbp_rsid_map.tsv.gz` at the
  ancestry root are auxiliary indexes, not additional AF blocks. Originally
  produced for LD-reference use (see the sibling `.unphased.vcor1*` files);
  only the per-block `.tsv`/`.afreq` allele-frequency columns are consumed
  here.
status: available
notes: >
  Large panel data (~140 GB) lives outside this repository under the
  configured artifact/reference root and is never tracked here. Only the
  resource declaration and the release evidence it produces (the
  SD-estimation sidecar) are tracked.
