resource_id: canonical-trait-mapping-efo
label: Canonical trait label to ontology-term mapping table
kind: trait_ontology_mapping
version: 3
location: resources/reference-resources/canonical-trait-mapping-efo/mapping.tsv
location_kind: tracked_file
description: >
  A curated trait_label -> trait_ontology_id/trait_ontology_label lookup,
  consulted by Manifest Generators when a Source Collection does not supply
  its own trait ontology mapping (see CONTEXT.md, "Canonical Trait Mapping
  Table", and docs/adr/0021-trait-ontology-mapping-lookup-lives-in-registry.md).
  Exact-match only, keyed on a normalised (trimmed, lowercased) trait_label;
  no fuzzy or semantic matching. The lookup columns are the first three
  (trait_label, trait_ontology_id, trait_ontology_label); trait_ontology_label
  is the human-readable label of the ontology term itself (for example
  "carnitine measurement" for EFO:0010469), never a vocabulary or
  identifier-authority name. The remaining columns record provenance for a
  row -- ontology_release, chooser_id, confidence, runner_up_margin,
  review_status (auto_accepted or human_reviewed), reviewer, reviewed_at --
  and are optional, so hand-curated rows that leave them empty remain valid.
  The resolver reads the lookup columns by name and ignores any extra columns,
  so widening the table never changes lookup behaviour. Rows are added by hand
  as specific traits are curated, or by the curation pipeline's promotion
  stage (curation/promotion.py, issue #169), which appends a row only when a
  proposal clears both the confidence and runner-up-margin thresholds and
  bumps this resource's `version`.
status: available
notes: >
  Populated by the curation pipeline (issues #161 and #185). Round
  ukb-b-2026q3 auto-accepted 409 ukb-b rows. Round ukb-b-2026q4 reran the
  2,093 remaining labels with Showcase context, ICD-10 cross-reference
  retrieval and top-100 shortlists, auto-accepting another 141. Its active
  review queue (845 labels, each with its candidate shortlist) is committed as
  review-queue-ukb-b-2026q4.tsv, and its 971 confident abstentions as
  no-suitable-term-ukb-b-2026q4.tsv; neither is part of the lookup. The Q3
  files remain as historical round evidence. See README.md, "Review queues",
  for how decisions are applied. Add a hand-curated row only when a real trait
  needs one; fill in the optional provenance columns when a
  candidate-generation-and-review process produced the row, and leave them
  empty for a hand-curated row.
