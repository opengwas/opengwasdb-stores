# Store Families.
#
# A Store Family is a product identity: what a query user is being offered, and
# what the next release of it will contain. It is NOT a format -- three families
# here share one Source Collection and one Source Format (gwas-catalog-ssf) and
# promise three different things.
#
# `source_reader_capability` is the only field that becomes argv: it is what
# `build.yaml` passes to opengwasdb. There is no separate `source_format` field;
# the capability names the format (ADR 0024). `null` means the source is not read
# through opengwasdb's SourceReader registry at all -- BESD, which
# `build-ragged-besd` reads directly.
#
# `source_collection` groups families built from the same upstream set. It is a
# string, not a directory: the former `source-collections/` tree recorded four
# facts, of which provider/licence/posture are inlined here and the promised
# Source Inventory was never populated (ADR 0024).

eqtlgen-cis-pilot:
  label: eQTLGen cis-eQTL pilot (BESD -> Ragged)
  source_collection: eqtlgen-cis
  provider: eQTLGen Consortium
  source_reader_capability: null
  access_posture: public
  default_license: eQTLGen Consortium data use terms
  release_cadence: one-off
  query_promise:
    coverage: cis
    expected_layouts:
    - ragged-observed
  priority:
    value: medium
    readiness: high
    rationale: 'Proves the BESD -> Ragged pipeline end to end using a real, public molecular-QTL
      source and closes the last unstarted cell in Roadmap 2''s representative store matrix
      (opengwas/opengwasdb#89).

      '
  description: 'Ragged cis-eQTL store for a small, well-known set of genes from the eQTLGen
    Consortium''s 2019 whole-blood cis-eQTL meta-analysis, built from a real BESD source via
    opengwasdb''s existing `build_ragged_from_besd()`. First registry-side BESD -> Ragged
    pilot (issue #67) and the end-to-end proof of the BESD -> Ragged pipeline, mirroring `pqtl-interval-2018`''s
    role for the GWAS-SSF -> Ragged pipeline.

    '
  source_description: 'Genome-wide whole-blood cis-eQTL summary statistics from the eQTLGen
    Consortium''s 2019 meta-analysis (31,684 samples), distributed as one BESD triple (.esi/.epi/.besd,
    SPARSE_FILE_TYPE_3) covering all ~19,250 tested probes/genes on GRCh37. Unlike this registry''s
    other Source Collections, BESD is not read through opengwasdb''s SourceReader capability
    registry -- `opengwasdb.layouts.ragged.build_besd.build_ragged_from_besd()` reads a `.esi`/`.epi`/`.besd`
    triple directly and derives one Analysis per probe from the `.epi` file itself, so `source_reader_capability`
    is null here.

    '
finngen-r13:
  label: FinnGen R13
  source_collection: finngen-r13
  provider: FinnGen
  source_reader_capability: opengwasdb.finngen-r13
  access_posture: public
  default_license: FinnGen public data
  release_cadence: source-release
  query_promise:
    coverage: full-gwas
    expected_layouts:
    - dense-observed
  priority:
    value: high
    readiness: pilot
    rationale: 'The r13-pilot-20 Release is deliberately bounded to test source volume, build
      cost, metadata fidelity, and public queries before onboarding all FinnGen R13 endpoints.

      '
  description: 'Dense observed-only stores built directly from FinnGen Data Freeze 13 public
    endpoint summary statistics.

    '
  source_description: 'FinnGen Data Freeze 13 endpoint summary statistics, distributed as
    one bgzip-compressed GRCh38 tabular file per endpoint with ALT as the effect allele. The
    provider manifest is the authoritative inventory and source of case/control or inverse-rank-normalised
    quantitative sample-size metadata.

    '
gwas-catalog-eur-hybrid:
  label: GWAS Catalog European-ancestry Hybrid store (pooled across publications)
  source_collection: gwas-catalog-ssf
  provider: EBI GWAS Catalog
  source_reader_capability: opengwasdb.gwas-ssf
  access_posture: public
  default_license: EBI GWAS Catalog terms of use
  release_cadence: one-off
  query_promise:
    coverage: full-gwas
    expected_layouts:
    - hybrid-observed
  priority:
    value: medium
    readiness: medium
    rationale: 'Proves the Hybrid layout (dense on-panel fill + ragged off-panel overflow,
      opengwasdb''s ADR 0026) end to end on real, diverse GWAS-Catalog-SSF data -- the last
      of the five source-format/layout combinations identified as needing a grounded pilot.
      `eur-hybrid-prioritise.r` already curates the full 6,035-Analysis pool for later production
      sizing; this family starts at pilot scale (10 Analyses) rather than the full pool, which
      store-candidates-summary.tsv estimates at ~181 GB reference-completed.

      '
  description: 'European-ancestry Hybrid store pooling harmonised GWAS-SSF Analyses across
    many independent GWAS Catalog publications that don''t individually meet the single-publication
    Dense/Ragged size threshold (resources/scripts/ebi-studies.r''s "everything left over"
    store_type assignment) -- 6,035 candidate Analyses spanning 1,007 distinct PMIDs (store_key
    hybrid__European in resources/data/derived/store-candidates-analyses.tsv). First worked
    example of a Hybrid-layout generator and the end-to-end proof of the GWAS-SSF -> Hybrid
    pipeline via opengwasdb''s GWAS-SSF Source Reader Capability (opengwasdb#84) and its Dense/Hybrid
    liftover fix (opengwasdb#85).

    '
  source_description: 'Homogeneous collection of GWAS Catalog harmonised summary statistics
    distributed as GWAS-SSF (`<GCST>.h.tsv.gz`) on the EBI FTP, GRCh38. Molecular- QTL analyses
    from this collection feed the ragged sparse-region build: the Manifest Generator downloads
    each analysis, filters it to cis + significant / suggestive trans regions, and opengwasdb
    ingests the filtered inputs via the ragged GWAS-SSF reader (`opengwasdb.layouts.ragged.build_ssf`).

    '
metabolome-plasma-2023:
  label: Multi-ancestry plasma metabolome atlas (Chen et al. 2023)
  source_collection: gwas-catalog-ssf
  provider: EBI GWAS Catalog
  source_reader_capability: opengwasdb.gwas-ssf
  access_posture: public
  default_license: EBI GWAS Catalog terms of use
  release_cadence: one-off
  query_promise:
    coverage: signals_only
    expected_layouts:
    - ragged-observed
  priority:
    value: high
    readiness: high
    rationale: 'Proves the no-cis sparse-region policy (issue #26) and AF-based ancestry assignment
      (issue #23/#25) end to end on real multi-ancestry data with genuine source allele frequencies,
      complementing the single-ancestry, no-source-AF Sun pQTL pilot.

      '
  description: 'Ragged signals-only (no cis window) plasma metabolome mQTL store spanning
    African, East Asian, European, and South Asian ancestries (Chen et al. 2023, PMID 36635386,
    Nat Genet), built from harmonised GWAS-SSF via the shared `gwas-ssf-ragged` generator''s
    no-cis sparse-region policy. First worked example of reference-AF effect-scale validation
    with real source-provided allele frequencies (`af_source: source`) and the first worked
    example of AF-based ancestry assignment (`af_assigned`), exercised across four distinct
    ancestries in one release.

    '
  source_description: 'Homogeneous collection of GWAS Catalog harmonised summary statistics
    distributed as GWAS-SSF (`<GCST>.h.tsv.gz`) on the EBI FTP, GRCh38. Molecular- QTL analyses
    from this collection feed the ragged sparse-region build: the Manifest Generator downloads
    each analysis, filters it to cis + significant / suggestive trans regions, and opengwasdb
    ingests the filtered inputs via the ragged GWAS-SSF reader (`opengwasdb.layouts.ragged.build_ssf`).

    '
pqtl-interval-2018:
