  Policy: full-reference AF ancestry assignment and source-AF-only quantitative phenotype-SD estimation
  (issue #152); case-control rows use log_or/binary_trait; non-target/unassigned ancestry, orientation
  failures, unusable source AF and ordinary resolution failures are controlled exclusions
  (sidecars/exclusions.tsv).


