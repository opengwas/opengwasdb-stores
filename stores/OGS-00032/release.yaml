  load 69 to 116), exit 0. Step timings: build 5,045.8 s; indexed-subset-hm3 170.0 s; overview 1.4
  s; validate 373.8 s; build_elapsed_s in the Validation Record, 5,591.1 s, sums the four Steps and
  counts the build once. It holds 17,889,288 shared variants (10,912,248 on the Dense panel,
