description: 'Every ready Analysis in the hybrid__East-Asian candidate pool of the EBI GWAS Catalog harmonised
  GWAS-SSF Source Collection, resolved through AF-based ancestry assignment and phenotype-SD effect-scale
  estimation. Mixed study designs: quantitative Analyses carry an empirically estimated phenotype SD,
  and case-control Analyses are stored on the log-OR scale with SD estimation explicitly skipped rather
  than defaulted.

  '
notes: 'The candidate pool is 852 Analyses across 139 publications. EBI publishes a harmonised file for
  709 of them; none of the other 143 has a GRCh38 raw file (20 are GRCh37, 123 publish no raw metadata
  sidecar), so this hg38 Hybrid Store takes harmonised files only, as OGS-00011 does. Only the subset
  the frozen Source Inventory records as ready becomes release membership.


  Candidate status: human review required before acceptance (issue #153). 379 included, 330 excluded of
  852 frozen inventory rows.


  Evidence: frozen Source Inventory gwas-catalog-ssf-eas-hybrid-2026-11-05 (sha256 dda4540ec266f084992d576c03c4e8518099ea49c919aaa416a31d1996c8a399);
  preflight report /data/opengwasdb/work/gwas-catalog-eas-afr-hybrid/work/OGS-00032/preflight/gwas-catalog-ssf-eas-hybrid-2026-11-05.json;
