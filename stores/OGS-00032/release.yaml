  2026-11-26: ten Analyses excluded and the release rebuilt from source (#532, epic #520). The clump
  diagnosis (reports/clumpdiag.md) found that ten Analyses of PMID 40222985 (Omae et al., adverse
  reactions after COVID-19 booster vaccination: GCST90454398, -400, -402, -405, -408, -410, -411,
  -413, -414 and -415) hold 98.6 % of the Store''s 5e-8 tier rows, each with 5.87 to 6.23 M of its
  7.14 M variants at 5e-8 (n_hits_5e8) and a median |z| of 10.7 to 12.6; their sibling GCST90454399, a
  quantitative trait of the same study, has a median |z| of 0.68. Their sources are log_or Analyses
  whose harmonised beta column holds the odds ratio (about 1, with the CI bounds on the OR scale)
  while standard_error is on the log scale, so the stored z = beta / SE is mis-scaled; no real signal
  is that large. The owner ruled on 2026-11-26 (#520 comment 7202276131, item 8) to
  exclude them and rebuild OGS-00032 from source with force, then complete it. Their rows now carry
  `exclude_from_build: true` and `inclusion_reason` (ADR 0025), the exclusions and quality-check
  sidecars name them under `mis_scaled_z`, and the bundle plans 369 Analyses where the published Store
  has 379. The amendment check refuses an unforced run (membership) and the forced run bypasses it, as
  ADR 0037 provides. The forced release that followed replaced the published Store, which is
  archived under replaced/ (paragraph below).

