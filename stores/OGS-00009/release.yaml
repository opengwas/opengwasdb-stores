  10:50240776:C:T carries rs200903336 and the statistics of hg19 10:52000536:T:C (rs7902744); hg19
  10:48055247:T:C (rs200903336) is lost. The rsid names the lost source, not the statistics''
  source.

  Extent: 8 rows x 2,514 Analyses = 20,112 cells, of which 16,818 hold observed values. Every
  other variant is unaffected. Five of the eight (4:74450339:C:T, 7:75044656:C:G, 8:144235357:C:T,
  10:47013158:A:G, 10:50240776:C:T) were already collided in the earlier build, so this predates
  opengwas/opengwasdb#288; three (7:74988062:G:T, 7:75044656:A:C, 7:101668260:A:G) arrived with
  #288''s strand-aware lift. The cause and fix are tracked in opengwas/opengwasdb#325; the detail
  is in the build_collisions section of the opengwasdb benchmark JSON. Decision (owner): document
  now, fix at the next rebuild. The published Store is not rewritten by this note.

  2026-10-23: built. The Store was built observed-only and completed against the UKB EUR LD panel
  (ukb-hg38-eur-ld) under this id; completion was registered on 2026-10-23 at opengwasdb d405de0 and
  the published Store is /data/opengwasdb/stores/OGS-00009/store.opengwasdb.'
