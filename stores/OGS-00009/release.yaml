description: Full dense Store Release of all 2,514 UK Biobank (ukb-b) GWAS-VCF Analyses declared in the
  OpenGWAS IGD collection and verified present in /data/opengwasdb/raw/gwas-vcf/ukb-b, reference-completed
  under its own id against the UKB EUR LD panel (ADR 0037).
notes: 'Membership is the frozen Source Inventory ukb-b-restored-2026-10-11: 2,514 Analyses, each with
  a recorded sha256, size and mtime. It replaces the incomplete 2,024-Analysis candidate previously registered
  under this id, adding the 490 Analyses that candidate was missing and removing none; its two-id completed
  child OGS-00010 is retired, as are the successor ids OGS-00030/31 #219 reserved (#312). The Store is
  built observed-only, then completed against the UKB EUR LD panel (ukb-hg38-eur-ld) and replaced under
  the same id once the observed-view check passes. Analytical Metadata is resolved from each Analysis''s
  provider JSON sidecar (exact-ID checked, batch checked, sha256-bound); that resolution agrees with the
  recorded opengwas-api-r2026-08-10 resolution on every one of the 2,511 rows it covered and supplies
  the three rows it had left unresolved. Ancestry is the provider''s own population label (source_fallback),
  not an AF-based assignment; the ukb-b VCFs do carry FORMAT/AF, so the historical source_trusted_no_af
  value is not reproduced. The owner accepted these source labels (all EUR) for this build, with no AF
  assignment first (#312, 2026-10-21).

  Pre-release SE codec re-encode (2026-10-25, #326): under the one-time exception authorized
  before the project''s first release, only the `se` and `se_exception_index` Blosc `typesize`
  values and encoded chunk bytes changed. `records/se-reencode.json` reports full-array decoded
  equality across 447,689 chunks and 2,810,059,224 bytes saved; the post-run Store validation
  and observed-view check passed. This physical-representation-only exception sets no precedent
  after release.

  Release Erratum (2026-10-24, opengwas/opengwasdb#325): eight rows of the published Store
  OGS-00009-completed are each the target of two hg19 source variants under the hg19 to hg38 lift.
  build-dense-vcf kept one row per ALID without failing, and validate and the observed-view check
  both passed. For each row below, the statistics are those of one source only and the other
  source''s data is lost; the statistics'' source was matched against the source VCFs of two
  Analyses (ukb-b-17805 and ukb-b-19953), not all 2,514.

  4:74450339:C:T carries rs368667736 and the statistics of hg19 4:75485813:C:T (rs2291714); hg19
  4:75316056:C:T (rs368667736) is lost. The rsid names the lost source, not the statistics''
  source.

  7:74988062:G:T carries rs35525401 and the statistics of hg19 7:74844193:C:A (rs868975575); hg19
  7:74402206:G:T (rs35525401) is lost. The rsid names the lost source, not the statistics''
  source.

  7:75044656:A:C carries rs587647277 and the statistics of hg19 7:74787650:G:T (rs4517039); hg19
  7:74458765:C:A (rs587647277) is lost. The rsid names the lost source, not the statistics''
  source.

  7:75044656:C:G carries rs587647277 and the statistics of hg19 7:74787650:G:C (rs4517039); hg19
  7:74458765:C:G (rs587647277) is lost. The rsid names the lost source, not the statistics''
  source.

  7:101668260:A:G carries rs200217321 and the statistics of hg19 19:7323129:T:C (rs200217321);
  hg19 7:101311540:A:G (rs848673) is lost.

  8:144235357:C:T carries rs11992210 and the statistics of hg19 8:145459313:C:T (8_145459313_C_T);
  hg19 8:145290260:C:T (rs11992210) is lost. The rsid names the lost source, not the statistics''
  source.

  10:47013158:A:G carries rs373336509 and the statistics of hg19 10:48726204:C:T (rs4926052); hg19
  10:46539289:C:T (rs373336509) is lost. The rsid names the lost source, not the statistics''
