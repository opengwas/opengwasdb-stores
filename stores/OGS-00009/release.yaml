  Extent: 8 rows x 2,514 Analyses = 20,112 cells, of which 16,818 hold observed values. Every
  other variant is unaffected. Five of the eight (4:74450339:C:T, 7:75044656:C:G, 8:144235357:C:T,
  10:47013158:A:G, 10:50240776:C:T) were already collided in the earlier build, so this predates
  opengwas/opengwasdb#288; three (7:74988062:G:T, 7:75044656:A:C, 7:101668260:A:G) arrived with
  #288''s strand-aware lift. The cause and fix are tracked in opengwas/opengwasdb#325; the detail
  is in the build_collisions section of the opengwasdb benchmark JSON. Decision (owner): document
  now, fix at the next rebuild. The published Store is not rewritten by this note.

  2026-10-23: built. The Store was built observed-only and completed against the UKB EUR LD panel
  (ukb-hg38-eur-ld) under this id; completion was registered on 2026-10-23 at opengwasdb d405de0 and
  the published Store is /data/opengwasdb/stores/OGS-00009/store.opengwasdb.

  Read-only verification of the published Store (#332, 2026-10-28): the Validation Record says passed
  at opengwasdb@d405de0 with 2,514 Analyses, 11,191,070 variants and 28,134,349,980 associations,
  matching register''s completion-register record (same revision and timestamp) and completion-validate
  record (ok, no errors or warnings, run at the same revision); d405de0 is the record''s own, historical
  revision. The Store was opened and read with opengwasdb 5fc0766, opengwasdb-stores dev''s pin at the
  time: the completion''s observed-view check record passed with 2,514 Analyses identical between parent
  and child; the Store opens and its 2,514 Analysis IDs equal the bundle''s 2,514 admitted rows as sets
  (none excluded); info reports format 0.2.0, dense layout, reference_completed, and association
  coverage gwas. No fresh full validate was run: on a Store this size it takes hours, and the
  completion''s own validate record is the evidence. The owner approved marking it validated on
  2026-10-28.

  Release Erratum (2026-10-28, #322): validation.yaml recorded observed.n_associations as 28134349980.
  That is exactly 2,514 x 11,191,070, n_analyses times n_variants, not a count. `register` multiplied
  the two axes when a Dense step printed no association count (register.py at 086d56d, removed by
  #322), and complete-dense printed no n_associations. The product counts the imputed cells and the
  2,764,792,625 off-panel cells completion left missing, so it is not the number of observed
  associations. The value is null until opengwasdb reports an observed count
  (opengwas/opengwasdb#294). No Store was rebuilt or rewritten by this registry metadata correction.

  2026-11-25: recipe amended (#530, epic #520) to add `post.rho` and `post.clumps` with `post.ld_stores` (EUR: the `hgdp1kgp-v2-EUR-k10.store` LD Store). These amendments are the owner''s, accepted on #522.

  Converted to format 0.3.0 (issues #520 and #525, 2026-11-26), in two attempts. The owner approved converting the priority Stores in place, and publishing them, provided validation shows only the recorded deviation warnings (opengwas/opengwasdb-stores#520). The first attempt converted this lifted Store from 0.2.0 by `opengwasdb rewrite-release --convert-legacy --lifted --n-workers 16` at engine 0.20.0 (c8ebe4ca), from 21:50 to 23:41 UTC on 25 Nov. `publish-rewrite` refused it and published nothing: validation raised `variant_table.lifted_contig` ("1271 not judged"), which the conversion did not record as a deviation. That staged release is kept, not deleted, under work/orchestrate/opengwasdb-stores-520/held/OGS-00009-attempt1-c8ebe4ca/ (58 GB; deleting it needs the owner approval). The owner ruled for an engine deviation and a re-conversion (https://github.com/opengwas/opengwasdb-stores/issues/520#issuecomment-7185997253, item 6); the engine change is opengwasdb#504 (e97f07b5, engine 0.23.0), which records `variant_table.lifted_contig` with the count it could not judge. The second attempt ran the same command at engine 0.23.0 from 08:35:50 to 10:24:19 UTC on 26 Nov, exit 0, in 1 h 48 min 25 s wall (peak RSS 31,828,680 kB). The converter read 11,191,070 rows x 2,514 Analyses, 0 of them rows no cell is observed in and 1,271 off-primary rows with no source_alid, asked the source 142 questions (9 ALID probes, 22 range probes, 16 Indexed Variant Subset questions and 3 rsID misses) and asked the staged release the same ones: every answer matches. It was published through `pixi run publish-rewrite OGS-00009` (#533, with 533d, which accepts a deviation only with the conversion note), which validated the staged release and moved it into place at 10:40:26 UTC (15 min 54 s wall); the 0.2.0 Store is archived, kept, at replaced/20261126T102436Z (62 GB). Validation passed with warnings: no errors, no carried warnings, and three warnings, each the accepted deviation and each ending in the conversion note: `variant_table.lifted_contig` (1,271 non-primary-contig rows with no source_alid, not judged), `variant_table.source_alid` (the lift provenance was not kept at 0.2.0, so no row carries one) and `side_tables.se_exceptions_rounded` (all 1,680,419 se exceptions are exactly what a float16 plane stores, issue #355). The manifest also records `variant_table.indel_order`, which validate does not report. A rebuild from source fixes all of them. The 1,271 rows are on 18 alt, random and unplaced contigs (7_KI270803v1_alt 750, 8_KI270821v1_alt 327) and carry 1,959,551 observed cells; a current build would drop such rows as lift_off_primary (#376), so a rebuild would lose them. Counts are unchanged: 2,514 Analyses, 11,191,070 variants; store_bytes 61,882,085,184 to 61,438,583,342. build_elapsed_s 167,434.802 is the 0.2.0 record 159,976.285 plus 7,458.517 s for the conversion (6,505 s) and the staged release validation. The Store reads without pysam and carries no variant_offsets.npy; it keeps index.sqlite for completion_quality (ADR 0102). Reads of an Analysis (5,349,214 observed and 4,563,055 imputed cells), an rsID lookup and PheWAS, a chr1:49,298-200,000 range PheWAS, and an alt-contig variant (7_KI270803v1_alt:339802:A:G, 1,483 cells) and range (6,170 cells), whose source_alid is absent in both Stores, return the same z, se, eaf and status as the 0.2.0 archive. Its Reference-Completed state and its Release Status, validated, are unchanged.'
