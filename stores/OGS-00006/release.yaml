notes: 'Production-scale sibling of the 2023-chen-pilot-80 pilot (issue #27), scaled up per-ancestry (issue
  #31''s "run the whole thing" follow-on): single-ancestry selection (ancestry_group: European, matching
  the candidates table''s own store_key partitioning) rather than the pilot''s mixed-ancestry-plus-AF-assignment
  approach, since each store here is already known single-ancestry from the source label. ancestry_assignment
  stays enabled with the fixed QC panel (issue #28/#29/#30) as a source/AF mislabel QC check, not for
  splitting.


  Built (opengwasdb#100/#101 fixes; opengwasdb@1ecfd1e): 1,400 analyses, 12,086,426 variants, 58,053,989
  associations. 108 duplicate (analysis, variant) pairs had conflicting z-scores across two source rows
  and were dropped entirely for those cells (opengwasdb#101) -- see validation.yaml''s warning; one of
  these is what originally surfaced the opengwasdb#101 bug (a top-hit index violation before the fix).
  Reference completion is currently blocked: complete_ragged_store only enumerates LD blocks via a cis
  window (trait_chr/trait_bp), which this no-gene-target family has none of, so completion is a no-op
  (opengwasdb#102). No Reference-Completed sibling exists yet.

  Release Erratum (issue #133): assigned_ancestry was recorded as the free-text Source Ancestry Label
  "European" while the membership table already recorded the super-population code "EUR"; normalised here. The quantitative Analyses also stored n_cases/n_controls as 0 where the counts
  are not applicable; those cells are now empty (absence is distinct from zero). source_ancestry_label
  remains "European" as source provenance. No Store artifact was rebuilt or rewritten.

  Release Erratum (issue #332, 2026-10-22): the Validation Record dated 2026-08-31 described
  the build of that day (opengwasdb 6ef919e, 58,053,989 associations). The Store this bundle
  published on 2026-09-18 (opengwasdb 987aec1, format 0.1.0, 58,054,212 associations) then failed
  `opengwasdb validate` at the current runtime pin d405de0 with one error: "data.zarr/ragged:
  carries no by_variant group; a Ragged component must carry the variant-centric index (ADR
  0060)". The index is written by format-0.2.0 builders, so no format-0.1.0 Ragged Store can pass
  that check; issue #344 carries the wider gap. On the owner decision of 2026-10-22 the Store was
  rebuilt from this unchanged bundle -- same Release Manifest, same Build Recipe, still
  observed_only -- by a forced run at opengwasdb d405de0 (format 0.2.0), which archived the Store
  it replaced under `replaced/20261021T235935Z/` beside it. Unlike the earlier Release Erratum, this one
  did rebuild the Store artifact.

  The build input `source/` was re-staged before the run as symlinks to the files the Release
  Manifest names, every one of the 1,400 verified by sha256: 1,202 against the checksum the
  manifest records, the other 198 against the reviewed re-materialisation list
  `resources/generators/gwas-catalog-ragged/ogs-00006-rematerialised-2026-09-15.tsv`, whose
  originals were deleted after region filtering. The rebuild therefore read the inputs the
  2026-09-18 build read, and it reproduces the counts of that Store: 1,400 Analyses, 12,086,463
  variants, 58,054,212 associations.

  validate passes with warnings, so the record reads `passed_with_warnings` and the release is
  `validated`. All 1,397 warnings are one class: 1,397 of the 1,400 Analyses store EAF whose
  orientation is unverified, because only 19 to 301 of their variants overlap the reference panel
  that check uses, below the 500 it requires, and the other 3 Analyses clear it. The record
  carries no observed.format_version because no step at this pin reports it; the Store manifest
  declares 0.2.0, as `opengwasdb info` shows.

  Release Erratum (issue #332, 2026-10-23): that rebuild was the first at format
  0.2.0, and it recorded its associations under the region policy the builder assumed when a
  Release Bundle declared none. The value it wrote, `cis_and_signals`, says the Store holds
  a cis window. It holds none: the `filter_summary.tsv` sidecar records `cis_rows = 0` for
  all 1,400 Analyses, and only significant-trans and suggestive regions, which is
  `signals_only` -- the coverage this bundle declares from 2026-10-23 on (issue #341), and the
  one opengwas/opengwasdb#298 takes this release to illustrate: significant trans signals and
  suggestive leads with no cis region. Once the pin moved to an opengwasdb that takes the
  declared value as a build input, the Store was rebuilt again from this unchanged bundle by
  a forced run at `2f308cb`. That run took 14 minutes 26 seconds, passed
  `--association-coverage signals_only` to the builder, and archived the Store it replaced
  under `replaced/20261023T230254Z/` beside it. `opengwasdb info` reports format 0.2.0,
  `signals_only` and `observed_only`; the Validation Record is the one `register` wrote for
  that run, `passed_with_warnings`, with 1,400 Analyses, 12,086,463 variants, 58,054,212
  associations and the same 1,397 EAF-orientation warnings; and the release stays `validated`.

  '
