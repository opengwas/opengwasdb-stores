notes: 'Production-scale sibling of the 2023-chen-pilot-80 pilot (issue #27), scaled up per-ancestry (issue
  #31''s "run the whole thing" follow-on): single-ancestry selection (ancestry_group: European, matching
  the candidates table''s own store_key partitioning) rather than the pilot''s mixed-ancestry-plus-AF-assignment
  approach, since each store here is already known single-ancestry from the source label. ancestry_assignment
  stays enabled with the fixed QC panel (issue #28/#29/#30) as a source/AF mislabel QC check, not for
  splitting.


  Built (opengwasdb#100/#101 fixes; opengwasdb@1ecfd1e): 1,400 analyses, 12,086,426 variants, 58,053,989
  associations. 108 duplicate (analysis, variant) pairs had conflicting z-scores across two source rows
  and were dropped entirely for those cells (opengwasdb#101) -- see validation.yaml''s warning; one of
  these is what originally surfaced the opengwasdb#101 bug (a top-hit index violation before the fix).
  Reference completion is currently blocked: complete_ragged_store only enumerates LD blocks via a cis
  window (trait_chr/trait_bp), which this no-gene-target family has none of, so completion is a no-op
  (opengwasdb#102). No Reference-Completed sibling exists yet.

  Release Erratum (issue #133): assigned_ancestry was recorded as the free-text Source Ancestry Label
  "European" while the membership table already recorded the super-population code "EUR"; normalised here. The quantitative Analyses also stored n_cases/n_controls as 0 where the counts
  are not applicable; those cells are now empty (absence is distinct from zero). source_ancestry_label
  remains "European" as source provenance. No Store artifact was rebuilt or rewritten.

  Release Erratum (issue #332, 2026-10-22): the Validation Record dated 2026-08-31 described
  the build of that day (opengwasdb 6ef919e, 58,053,989 associations). The Store this bundle
  published on 2026-09-18 (opengwasdb 987aec1, format 0.1.0, 58,054,212 associations) then failed
  `opengwasdb validate` at the current runtime pin d405de0 with one error: "data.zarr/ragged:
  carries no by_variant group; a Ragged component must carry the variant-centric index (ADR
  0060)". The index is written by format-0.2.0 builders, so no format-0.1.0 Ragged Store can pass
  that check; issue #344 carries the wider gap. On the owner decision of 2026-10-22 the Store was
  rebuilt from this unchanged bundle -- same Release Manifest, same Build Recipe, still
  observed_only -- by a forced run at opengwasdb d405de0 (format 0.2.0), which archived the Store
  it replaced under `replaced/20261021T235935Z/` beside it. Unlike the earlier Release Erratum, this one
  did rebuild the Store artifact.

  The build input `source/` was re-staged before the run as symlinks to the files the Release
  Manifest names, every one of the 1,400 verified by sha256: 1,202 against the checksum the
  manifest records, the other 198 against the reviewed re-materialisation list
  `resources/generators/gwas-catalog-ragged/ogs-00006-rematerialised-2026-09-15.tsv`, whose
  originals were deleted after region filtering. The rebuild therefore read the inputs the
  2026-09-18 build read, and it reproduces the counts of that Store: 1,400 Analyses, 12,086,463
  variants, 58,054,212 associations.

  validate passes with warnings, so the record reads `passed_with_warnings` and the release is
  `validated`. All 1,397 warnings are one class: 1,397 of the 1,400 Analyses store EAF whose
  orientation is unverified, because only 19 to 301 of their variants overlap the reference panel
  that check uses, below the 500 it requires, and the other 3 Analyses clear it. The record
  carries no observed.format_version because no step at this pin reports it; the Store manifest
  declares 0.2.0, as `opengwasdb info` shows.

  Release Erratum (issue #332, 2026-10-23): that rebuild was the first at format
  0.2.0, and it recorded its associations under the region policy the builder assumed when a
  Release Bundle declared none. The value it wrote, `cis_and_signals`, says the Store holds
  a cis window. It holds none: the `filter_summary.tsv` sidecar records `cis_rows = 0` for
  all 1,400 Analyses, and only significant-trans and suggestive regions, which is
  `signals_only` -- the coverage this bundle declares from 2026-10-23 on (issue #341), and the
  one opengwas/opengwasdb#298 takes this release to illustrate: significant trans signals and
  suggestive leads with no cis region. Once the pin moved to an opengwasdb that takes the
  declared value as a build input, the Store was rebuilt again from this unchanged bundle by
  a forced run at `2f308cb`. That run took 14 minutes 26 seconds, passed
  `--association-coverage signals_only` to the builder, and archived the Store it replaced
  under `replaced/20261023T230254Z/` beside it. `opengwasdb info` reports format 0.2.0,
  `signals_only` and `observed_only`; the Validation Record is the one `register` wrote for
  that run, `passed_with_warnings`, with 1,400 Analyses, 12,086,463 variants, 58,054,212
  associations and the same 1,397 EAF-orientation warnings; and the release stays `validated`.

  Completion under its own id (issue #224, 2026-11-07). The bundle now declares
  completion_state: reference_completed and, after its build phase, a complete block:
  complete-ragged against the UK Biobank EUR LD Reference Resource, the panel root
  /data/opengwasdb/reference/ld with ancestry EUR (ld/EUR points to ukb), at 32 workers. The
  owner chose that panel for every EUR Store on 2026-10-21. It is the one amendment ADR
  0037''s Decision 1 allows an accepted bundle (#305): the build phase still plans exactly the
  argv that wrote the published Store, so completing it schedules no rebuild. The
  declaration waited on opengwas/opengwasdb#301: this Store codes SE as int8_residual, and
  before opengwasdb v0.6.2 complete-ragged refit that model, which moved every observed SE
  and failed the strict Observed-View Check. From v0.6.2 it keeps the source''s
  se_coefficients. Its Analyses have no Trait position, so the regions completion retains
  are the LD blocks each Analysis already holds enough observations in (ADR 0039). The
  completion phase writes to store.opengwasdb.partial, runs the Observed-View Check, and
  publishes under the release id OGS-00006-completed, replacing the Observed-Only Store at
  /data/opengwasdb/stores/OGS-00006/store.opengwasdb once it registers. Until that run
  finishes, the Observed-Only Store described above is the one published. Release Status
  stays validated.

  Completed (issue #224, 2026-11-11). The completion phase ran on its own, as ADR 0037''s
  single-id rule requires: an unforced `release OGS-00006` from this registry at 56d36cb8,
  runtime opengwasdb 0.7.4 at f2ddb0f5 (format 0.2.0), started 2026-11-10 12:47 UTC and
  finished 2026-11-11 01:08 UTC, elapsed 12 h 21 m, exit 0. A first attempt on 2026-11-07 at
  opengwasdb 0.7.1 finished its 1,348 blocks but could not merge them: its merge held every
  fill in memory, about 1.7 TB on a 1 TB host. On the owner''s word it was stopped and its
  checkpoints deleted; nothing published changed. opengwas/opengwasdb#424 (v0.7.4) made that
  merge stream through the code Dense completion and the Ragged builders already use.
  complete-ragged against the UK Biobank EUR LD Reference Resource at
  /data/opengwasdb/reference/ld, ancestry EUR at 32 workers, took 9 h 45 m: the 1,348 LD
  blocks in 3 h 50 m, then the merge, the assembly, the zarr write, the variant-centric index
  and the top-hit indexes in 5 h 55 m, at a peak resident memory of 207 GiB. It imputed
  10,001,552,498 associations, in all 1,400 Analyses, every one of which is assigned EUR. The
  variant axis grew from 12,086,463 to 14,273,581 variants, 2,187,118 of them new panel
  variants, and 2,238,487,317 cells stay missing. 47 of the 10,059,606,710 stored SEs are
  exact exceptions, none on an imputed cell, and no Analysis is over the 2% budget. validate
  (46 m) and the Observed-View Check (1 h 50 m) followed, and completion register published
  the Store under the release id OGS-00006-completed, replacing the Observed-Only Store it
  had published. As ADR 0037 decides, the replaced Store''s arrays were deleted once the new
  Store was in place; its records and Validation Record are archived under
  /data/opengwasdb/stores/OGS-00006/replaced/20261111T010849Z/. The Observed-View Check
  passed: it compared 1,003 Analyses (1,000 at random, the 5 largest and 5 with no Trait
  position, the strata overlapping), reproduced all 44,259,732 of their observed
  associations exactly (largest z, SE and EAF difference 0), and every failing counter is
  zero. It is reported at /data/opengwasdb/stores/OGS-00006/work/observed-view-check.json.
  validate reports no errors and the same 1,397 EAF-orientation warnings as the Observed-Only
  Store. Completion reached every Analysis: all 1,400 carry imputed cells (4,584,425 to
  7,440,171, median 7,148,219) and none is zero. The panel''s EAF was measured rather than
  assumed: over 50 seeded Analyses, eaf_reference reads r +0.9999 against the mean observed
  EAF of 728,867 variants, where the other allele''s frequency would read -0.9999, and every
  imputed cell read decodes to it. The Validation Record was copied into this bundle
  unchanged and reads passed_with_warnings, 1,400 Analyses, 14,273,581 variants,
  12,298,094,027 associations and completion_state reference_completed, so the sentence
  above that the Observed-Only Store is the one published no longer holds. Human scientific
  acceptance remains pending. Release Status stays validated.

  Reading this Store''s completion quality. completion_quality''s pearson_r is the in-sample
  fit of each block''s prediction to the z values it observed, and a signals_only Analysis
  observes few variants in each block it is completed in: the Observed-View Check''s sample
  holds 44,259,732 observed against 7,165,588,488 imputed cells over 1,088,057 retained
  blocks, about 41 observed to 6,586 imputed per block. A fit to so few points is close to
  exact whatever the accuracy of the cells it imputes, so the per-Analysis median r reads 1.0
  (0.9471 to 1.0) where OGS-00012, a gwas-coverage Store under the same panel, reads 0.946.
  It does not measure imputation accuracy here and is not evidence that this completion is
  better than OGS-00012''s. The 269,616 block rows with no r had too few observed points to
  fit, imputed nothing and account for 2,151,367,854 of the missing cells.

  '
