notes: 'Deliberately restricted to case-control Analyses (stored_effect_scale= log_or, original_sd_method=binary_trait):
  this multi-publication pool has no single-family curated effect-scale method the way a single-paper
  Store Family does, so a quantitative Analysis''s original_sd_method would need real reference-AF phenotype-SD
  estimation (issue #16''s engine) to be honestly populated rather than assumed. Deferred to a follow-up
  release (opengwasdb-stores#70) rather than fabricated here. This pilot proves the Hybrid layout and
  the GWAS-SSF Source Reader Capability end-to-end; it does not yet prove quantitative-trait effect-scale
  coverage for this pool.


  Status is `built`, not `validated`: the store built successfully (10 Analyses, 20,531,956 shared variants
  -- 9,847,807 on-panel + 10,684,149 off-panel -- and 27,810,834 Ragged Overflow associations, confirming
  both Hybrid components were genuinely exercised) and reads back correctly, but validation.yaml correctly
  reports passed_with_warnings. Confirmed directly against this build: opengwasdb.layouts.dense.build_vcf._manifest_row_to_analysis
  (shared by the Dense and Hybrid builders) drops n_cases/n_controls/sample_size_kind/sample_size_scope/original_effect_scale
  from the built store despite the manifest supplying real values, and fabricates ancestry_assignment_method=af_assigned
  regardless of the manifest''s actual (here: source_trusted_no_af) value. Filed as explodecomputer/opengwasdb#86.
  These are real upstream gaps, not defects in this release; left failing rather than silently accepted.

  Release Erratum (issue #133): assigned_ancestry was recorded as the free-text Source Ancestry Label
  "European" rather than the registry-normalised super-population code "EUR". Corrected in analyses.tsv;
  source_ancestry_label remains "European" as source provenance.
  No Store artifact was rebuilt or rewritten by this registry metadata correction.

  Bundle amendment (2026-11-17, epic #232): the Build Recipe''s variant-reference moves from
  /data/opengwasdb/reference/alid-panel/EUR-variants.tsv.gz to
  /data/opengwasdb/reference/gnomad-v4-common-hg38-v2/EUR-variants.txt.gz, so the forced rebuild that
  follows has an axis the engine accepts. The old panel is legacy, carries no Variant Reference marker,
  and holds an indel, and opengwasdb 0.10.0 refuses an unmarked Variant Reference that does (the
  owner''s ruling of 2026-11-16 on opengwas/opengwasdb#381), which is how this release''s forced rebuild
  was refused. The regenerated reference declares reference-first indels, keeps an insertion and a
  deletion at one site as two ALIDs, and holds 13,718,605 EUR ALIDs where the old panel held 9,847,807
  (autosomes only, at a real floor of 3.24% MAF rather than the 1% it was taken for). Membership and
  every other build option are unchanged: this is an amendment of an accepted trial bundle, made by
  owner decision of 2026-11-17, for the forced rebuild that follows.

  Its hm3 declaration gains overflow-only: skip (2026-11-18), as OGS-00011''s did on the owner
  decision of 2026-10-23: against the gnomAD v4.1 common axis, HapMap3 variants that reach only the
  overflow axis cannot be indexed by the Dense Component (opengwas/opengwasdb#271), so the subset
  leaves them out and records how many. The first forced rebuild refused for 16,369 such variants.

  '
