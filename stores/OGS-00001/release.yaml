description: 10 well-known genes' cis-eQTL summary statistics from the eQTLGen Consortium's 2019 whole-blood
  cis-eQTL meta-analysis (31,684 samples), built into a real Ragged Observed-Only Store via opengwasdb's
  existing build_ragged_from_besd(). Proves the BESD -> Ragged pipeline end to end; not the full eQTLGen
  cis-eQTL catalogue (19,250 genes).
source_snapshot_id: eqtlgen-2019-cis-full
source_snapshot:
  besd_prefix: /data/opengwasdb/raw/eqtlgen/pilot-10
  source_genome_build: hg19
generator:
  commands:
    - python3 resources/generators/lib/source-formats/eqtlgen-besd-ragged/generate.py --config=resources/generators/eqtlgen-cis-pilot/config-pilot-10.yaml
notes: 'Probes chosen for well-characterised cis-eQTL signal and biological familiarity (lipid metabolism,
  immune response, tumour suppression), spanning 8 chromosomes and including one MHC-adjacent locus (TNF).
  Gene symbols for each Ensembl probe ID: ENSG00000175445=LPL, ENSG00000134243=SORT1, ENSG00000130203=APOE,
  ENSG00000073605=GSDMB, ENSG00000164308=ERAP2, ENSG00000232810=TNF, ENSG00000141510=TP53, ENSG00000136244=IL6,
  ENSG00000087237=CETP, ENSG00000136997=MYC.


  Release Erratum (issue #134): the 10 Analysis rows leave stored_effect_scale,
  sample_size_kind, sample_size_scope, sample_size, original_effect_scale,
  original_sd_method, and ancestry_assignment_method blank. The source BESD format
  does not carry sample size, effect scale, or ancestry metadata per probe or association,
  and this metadata is not resolvable from tracked evidence inside this repository.
  In accordance with the project principle that a wrong answer that looks like a right
  answer is the worst outcome, values are left blank rather than defaulted or fabricated
  pending external study-level metadata and upstream schema resolution.

  Release Erratum (issue #141): trait_ontology_id held "ENSEMBL:<gene>" and
  trait_ontology_label held "Ensembl" on all 10 Analysis rows -- a gene identifier
  where a Trait Ontology term belongs, and an authority name where a trait label
  belongs. The eQTLGen BESD source supplies no
  controlled-vocabulary Trait term, so both fields are now empty rather than
  carrying a gene id or a guess: the absence is the visible, correct answer. The
  gene identity remains target annotation in trait_chr/trait_bp and
  analysis_label. No Store artifact was rebuilt or rewritten.

  Release Erratum (issue #195): validation.yaml recorded observed.format_version as "1.0".
  No build or validate step reported that value. It was register''s own default, written
  when no step reported a version; PR #196 removes that default, so a version no step
  reports is now recorded as null. "1.0" is not this Store''s format: it names a retired
  pre-reset encoding (fixed-point z, opengwasdb#114) that current opengwasdb refuses to
  read. The true value comes from the Store''s manifest.json, which declares
  format_version "0.1.0".
  0.1.0 is the only format opengwasdb writes at a9e8bc8, the revision this record
  names, and at 987aec1, the revision that rebuilt the published Store.
  Corrected to 0.1.0 in validation.yaml. No Store artifact was rebuilt or rewritten
  by this registry metadata correction.

  Rebuilt 2026-11-02 (issue #348): this Store was rebuilt from the same BESD source
  at the pinned runtime opengwasdb 0.3.2 (44f25a96), so that OGS-00002 could be
  re-completed against the repaired HGDP+1kGP EUR panel. Format 0.1.0 became
  0.2.0. The counts are unchanged: 10 Analyses, 86,376 variants, 86,373
  associations. validate passed. The previous Store and records are kept in
  /data/opengwasdb/stores/OGS-00001/replaced/20261102T072357Z. This supersedes
  the format 0.1.0 statements in the earlier errata above, which are left as
  written.

  Rebuilt to lift its Trait positions into GRCh38 (issue #460, opengwas/opengwasdb#433, 2026-11-12).
  The eQTLGen source is on GRCh37 while this Store''s variants are GRCh38, so each Analysis''s
  trait_chr/trait_bp named its gene''s GRCh37 position on top of GRCh38 variants; opengwas/opengwasdb#433,
  released in v0.9.1, lifts them with the variants. On the owner''s approval of 2026-11-12 a forced
  `pixi run -e workflow release OGS-00001 --config force=1` at 9984588b, opengwasdb 0.9.1 (9c98a52),
  ran from 00:12:50 to 00:13:39 UTC on 2026-11-13, exit 0, building in 9 s and validating in 5 s. The
  build reproduced the counts the paragraph above records: 10 Analyses, 86,376 variants and 86,373
  associations. All 10 Trait positions lifted: APOE (ENSG00000130203) reads 19:44,907,573 where it read
  19:45,410,830, and MYC (ENSG00000136997) 8:127,738,431 where it read 8:128,750,677, the GRCh38 values
  OGS-00027 holds too. validate reports no errors and no warnings, and the Store is format 0.2.0 as
  before. The Store it replaced is archived under
  /data/opengwasdb/stores/OGS-00001/replaced/20261113T001258Z/; on the owner''s decision of 2026-11-12
  its arrays were deleted, so the archive keeps its records/ and validation.yaml, as ADR 0037 keeps on
  an unforced replacement, and the change stays dated and evidenced. One statement above no longer
  describes the published Store -- the #195 erratum''s "987aec1, the revision that rebuilt the published
  Store": the Store published now was rebuilt at 9c98a52. Release Status is unchanged at built.
  '
