description: 10 well-known genes' cis-eQTL summary statistics from the eQTLGen Consortium's 2019 whole-blood
  cis-eQTL meta-analysis (31,684 samples), built into a real Ragged Observed-Only Store via opengwasdb's
  existing build_ragged_from_besd(). Proves the BESD -> Ragged pipeline end to end; not the full eQTLGen
  cis-eQTL catalogue (19,250 genes).
