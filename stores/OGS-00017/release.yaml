description: |
  Full FinnGen R13 release: every endpoint in the frozen public summary-statistics manifest (2,754 endpoints -- three inverse-rank-normalised quantitative endpoints plus every case-control endpoint), selected in the manifest's own order. Production-scale sibling of the 20-Analysis r13-pilot-20 trial (OGS-00003); the pilot assessment is the onboarding evidence, and this release carries no analysis cap.
notes: |
  Selection is the whole frozen provider manifest, so the release membership is exactly what FinnGen publishes and the pinned manifest checksum makes the Analysis order reproducible. Every endpoint must still be honestly classified by the metadata resolver (a quantitative endpoint with num_cases=N, or a case-control endpoint with positive case and control counts); an endpoint the resolver cannot classify fails the emit rather than being dropped.

  Release Erratum (2026-10-13, owner-authorized renumbering): this release was
  migrated from OGS-00016 to OGS-00017 so the MVP META observed-only Store can
  take OGS-00016 ahead of FinnGen. The Release Manifest and Build Recipe are
  unchanged, no association/index byte was rewritten, and the prior identifier
  remains discoverable through the `migration` block, this erratum and git
  history. The published artifact under the artifact root must be relocated to
  `<artifact-root>/OGS-00017/` as a separate operational step; the registry
  publishes where it should live (ADR 0022).

  Rebuild and completion (2026-10-22): the relocation above was not carried
  out. The artifact root holds this Store under `<artifact-root>/OGS-00017/`,
  where the registry publishes it, but its records still name OGS-00016 and it
  is at format 0.1.0, so the Store is rebuilt under OGS-00017 at format 0.2.0
  by a forced run, and completed against the UKB EUR LD panel
  (`ukb-hg38-eur-ld`, `/data/opengwasdb/reference/ld/EUR`, which points to
  `ukb`; owner decision 2026-10-21) in that same run. The forced run archives
  the Store it replaces. Every FinnGen Analysis is unassigned, its Source
  Ancestry Label being Finnish and no Assigned Ancestry having been taken, so
  `complete-dense` imputes all 2,754 Analyses against the EUR panel.
