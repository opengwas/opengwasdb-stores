notes: |
  Ancestry bucket EAS; 241 intended Analyses. candidate_store_key
  dense__pmid-39024449__East-Asian. The exact 241-Analysis EAS membership is
  accepted and frozen as the input manifest for owner-authorized dev
  construction. Release Status is 'accepted' because #247 is the registry's
  fixed-input acceptance gate for a buildable bundle; it is not scientific
  release acceptance, publication approval or mirror promotion, and no Store has
  been built or validated yet.

  Owner build authority. The owner approved the MVP bundle integration and the
  dev builds (opengwas/opengwasdb-stores#221 comment 6156153525 and #232 comment
  6156153173). The parent's exact 241-record binding and staged-artifact review
  qualify this input manifest for authorized dev construction (emit config
  id_allocation_status: owner-authorized-2026-10-13, owner_ordering_approved:
  true).

  Evidence boundary. The Analytical Metadata comes from an owner-authorized
  bounded metadata resolution whose source-evidence scope is a capped diagnostic
  (resolver receipt source_evidence_scope: capped_pilot_diagnostic); 241/241 EAS
  Analyses resolved with outcome ok, zero escaped pids and an unchanged metadata
  content hash. A capped run is a diagnostic, never a whole-source SCI
  qualification. Human scientific acceptance remains pending
  (validation.yaml:acceptance.human_acceptance) and is not claimed here.

  Provenance bindings. This bundle is bound to the actual source snapshot named
  in source_snapshot (metadata refresh root + content sha, mapping table sha,
  source-metadata fingerprint snapshot, candidate table sha, planned manifest
  sha, resolution table sha) and to the resolver/emission records (resolution
  receipt sha, records index sha, merge receipt sha, emission config sha). No
  scientific release validation, publication approval or mirror promotion is
  claimed.

  Store built and published (issue #331, 2026-10-22). The #221 batch built this
  release's Store from stores c6b308a with opengwasdb 0.3.0 at 4e92256, format
  0.2.0, GRCh38. The build ran from 2026-10-14 02:04 to 2026-10-14 14:15 UTC
  (12.2 h). Top hits, the HM3 Indexed Variant Subset and the overview followed,
  then validate, from 2026-10-14 14:20 to 2026-10-14 14:33 UTC (0.2 h). register
  published the Store on 2026-10-14 14:33 UTC and wrote the Validation Record,
  copied into this bundle unchanged. It replaces the bundle's earlier Validation
  Record, which recorded the owner authorization and the pending human
  acceptance the paragraphs above cite; that record is in git at its
  acceptance.commit, fa2ea2c. The new record reads status passed, with no
  warnings or errors, and reports 241 Analyses, 9,335,909 variants and
  2,249,954,069 associations. The Store is observed-only; reference completion
  is not part of this release. The Store was built in a dev Artifact Root,
  /data/opengwasdb/work/epic232/221/dev-builds. On 2026-10-22,
  tools/relocate_store.py moved it to /data/opengwasdb/stores, renaming its
  directory and rewriting the 33 artifact paths in its six step records; stdout
  and stderr were left as written. The receipt beside the Store,
  relocations/20261022T151410.004523Z.json, holds each record's sha256 before
  and after. The Store is published at
  /data/opengwasdb/stores/OGS-00015/store.opengwasdb. This supersedes the
  statements above, and in the description, that no Store has been built or
  validated. The Validation Record's acceptance.warnings still say "No Store
  build or validation has run." That line is carried over from the accepted
  bundle's earlier record and predates the build. Human scientific acceptance
  remains pending.

  Pre-release SE codec re-encode (2026-10-24, #326): under the one-time
  exception authorized before the project's first release, only the `se` and
  `se_exception_index` Blosc `typesize` values and encoded chunk bytes changed.
  `records/se-reencode.json` reports full-array decoded equality across 37,360
  chunks and 313,153,203 bytes saved; the post-run Store validation passed.
  This physical-representation-only exception sets no precedent after release.

  Release Erratum (2026-10-28, #383): validation.yaml recorded observed.n_associations as 2249954069.
  That is exactly 241 x 9335909, n_analyses times n_variants, not a count. `register` multiplied
  the two axes when a Dense step printed no association count (the pre-#322 fallback, removed by
  #322); this Store was registered before that change reached this branch. The product counts matrix cells, and this Store is observed-only, so many of those cells are empty; it is not the number of observed associations.
  The value is null until opengwasdb reports an observed count (opengwas/opengwasdb#294). No Store
  was rebuilt or rewritten by this registry metadata correction.
