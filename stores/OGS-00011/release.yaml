description: 'Every ready Analysis in the hybrid__European candidate pool of the EBI GWAS Catalog harmonised
  GWAS-SSF Source Collection, resolved through AF-based ancestry assignment and phenotype-SD effect-scale
  estimation. Mixed study designs: quantitative Analyses carry an empirically estimated phenotype SD,
  and case-control Analyses are stored on the log-OR scale with SD estimation explicitly skipped rather
  than defaulted.

  '
notes: 'The candidate pool is 6,035 Analyses across 1,007 publications. Only the subset the frozen Source
  Inventory records as ready becomes release membership; the remaining inputs stay inventory facts and
  are never selected. Two accession pairs are byte-identical under different accessions and are reported
  for an explicit review decision instead of being silently collapsed (`sidecars/source_readiness.tsv`
  and `duplicates` in the preflight report).


