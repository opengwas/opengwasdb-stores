  2026-11-25: recipe amended (#530, epic #520) to add `post.rho` and `post.clumps` with `post.ld_stores` (EUR: the `hgdp1kgp-v2-EUR-k10.store` LD Store). These amendments are the owner''s, accepted on #522.

  2026-11-25: rewritten to format 0.3.0 (#499, epic #520) by `opengwasdb rewrite-release` (no `--convert-legacy`: the source is 0.2.3) at opengwasdb 0.21.0 (931ac166), from the completed 0.2.3 release OGS-00011-completed. The rewrite took 2 h 35 min (19:15:21-21:50:27Z, peak RSS 85.2 GB), the validation of the result in `publish-rewrite` 35 min 40 s (peak 10.5 GB). The rewrite asked the source and the staged release 142 questions, 9 ALID probes, 20 range probes, 16 Indexed Variant Subset questions and 3 rsID misses; every answer matched. Size 167,840,022,356 to 165,420,689,705 bytes: the fixed-width ALID pair and `variant_offsets.npy` give way to the ALID, position and source_alid sidecars, and the root `index.sqlite` and the Dense Component''s variant table, index files and overview are dropped. The Dense Component reads the shared sidecars through `dense/dense_to_shared.npy`, and keeps `dense/index.sqlite` for `completion_quality`. Counts are unchanged: 3,245 Analyses, 47,920,732 variants. The rsID gap of opengwasdb#481 is closed: the Dense Component''s rows read the shared rsIDs, 844,992 of 14,564,257 rows that carried none in 0.2.3 (none the other way, none that differ); a lookup by rsID over the Dense Component alone found nothing for rs761832497 at 0.2.3 and every Dense Analysis now. `source_alid`, counted over the 47,920,732 rows of the shared table: 47,920,110 rows equal `alid` and 622 are empty, none lifted. The 622 are the rows completion added to the shared axis from the LD panel. The completion log counts 845,652 new panel variants on the Dense axis (14,564,257 rows, against 13,718,605 in the construction reference), and 845,030 of those were already rows of the observed-only shared table, observed in the Ragged Overflow, so they rightly keep their own ALID; 845,030 + 622 = 845,652. The Observed-View Check counts 668 differently: the observed-only release''s shared rows (47,920,778) that no row of the completed axis (47,920,732) carries, so 47,920,778 - 668 + 622 = 47,920,732 and 47,920,110 + 668 = 47,920,778. The 0.2.3 release holds the same state on every row, and the rewrite reads it from the shared table, not from the Dense copy, which was blank (opengwasdb#449). Acceptance criterion 3 of #499 is met by this count. The first reading of it, that 845,030 added rows should be empty, counted the Dense axis''s new rows and not the shared axis''s, and is withdrawn. The manifest''s `provenance.chain_file` is pyliftover_builtin_hg19_hg38 because a Hybrid build records the built-in chain whenever it is given none, and nothing was lifted. The validation keeps its one warning, GCST90271757''s `eaf_orientation.unverified` (345 overlapping variants, fewer than 500), carried unchanged from the 0.2.3 record and recorded under `rewrite.carried_warnings`; the owner ruled on 25 Nov 2026 (AskUserQuestion in the orchestrating session; recorded on #520 and in ADR 0042''s amendment) that this carried warning does not stop publication. It was published with no deviation under `publish-rewrite`; the 0.2.3 Store and its records are archived under replaced/20261125T215224Z.'
