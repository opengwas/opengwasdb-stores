description: 'Every ready Analysis in the hybrid__European candidate pool of the EBI GWAS Catalog harmonised
  GWAS-SSF Source Collection, resolved through AF-based ancestry assignment and phenotype-SD effect-scale
  estimation. Mixed study designs: quantitative Analyses carry an empirically estimated phenotype SD,
  and case-control Analyses are stored on the log-OR scale with SD estimation explicitly skipped rather
  than defaulted.

  '
notes: 'The candidate pool is 6,219 Analyses (GWAS Catalog release 2026-11-19). Only the subset the frozen
  Source Inventory records as ready becomes release membership; the remaining inputs stay inventory facts
  and are never selected. Two accession pairs are byte-identical under different accessions and are reported
  for an explicit review decision instead of being silently collapsed (`sidecars/source_readiness.tsv`
  and `duplicates` in the preflight report).

  Release Erratum (issue #478, 2026-11-22): this bundle replaces the one the OGS-00011 Store published
  on 2026-11-01 was built from, on the owner''s decision of 2026-11-22 to re-emit and rebuild it under
  its own id. It is re-resolved at opengwasdb 0.14.1 from the GWAS Catalog''s 2026-11-19 release (#491).
  Membership moves from 3,169 to 3,245 Analyses. Thirteen leave, refused at resolution: GCST002047, GCST004461
  and GCST90165257, whose effect contradicts their own p-value (#403, #412, ADR 0069), the Store having
  held statistics read from a mislabelled effect column; GCST90014299 to GCST90014304, GCST90444480 and
  GCST90833021, whose p-value test is MR-MEGA (opengwasdb#371, ADR 0085); and GCST90572740 and GCST90572741,
  whose beta/se is deflated against their own p-value (ADR 0069). Eighty-nine join: 66 of the 103 Analyses
  new to the catalogue; 19 previously excluded as ancestry_unassigned whose sources EBI has since re-harmonised;
  GCST90278455 and GCST90278456, previously ancestry_unassigned, whose sources are unchanged and whose
  ancestry residual now falls below the gate; and GCST90627758 and GCST90627773, which the catalogue now
  records as quantitative. The Dense axis is the reference-first gnomAD generation (opengwasdb ADR 0079,
  #381): a deletion is spelt reference first, so its z has the opposite sign to the published Store''s,
  and a deletion and an insertion at one position are two variants. The rebuild writes format 0.2.3, which
  stores an SE beyond float16''s range as missing and counts it (opengwasdb ADR 0068), so the eight +inf
  SE cells of the 2026-11-01 erratum (#401) are not stored again. #225''s on-rsid-conflict: drop and hm3
  overflow-only: skip are carried.

  Per Analysis, #478 refuses rather than remaps. GCST90165257 cannot be remapped: its standard_error is
  NA throughout. GCST002047 (odds ratios in `beta`) and GCST004461 (log-odds in `odds_ratio`) could be
  read through a Column Map of their own, but a release reads one Column Map and the resolver takes one
  per run, so remapping them is left as a separate change.

  #487''s gwas-ssf-no-p Column Map is not carried. Without it GCST90446466 is refused at resolution as
  `resolution_failed`, and the recorded detail calls its z deflated; that is the effect-consistency check
  reading its `p_value`, which holds 1 - p/2 (owner ruling of 2 Nov 2026, opengwasdb#370), not a fault
  in its beta/se. Through the map it resolves at 0.14.1 but fails the ancestry gate (residual 0.219 against
  0.06), so it is excluded either way.

  The rebuild was published on 2026-11-25, completed under its id: format 0.2.3, 3,245 Analyses,
  47,920,732 variants. It replaces the 3,169-Analysis Store of 2026-10-26/27, completed on 2026-11-01
  from the bundle committed at 373f9a0f, whose notes carry its errata (#225, #401, #403, #412); that
  Store is archived under replaced/20261122T224238Z. Reference Completion left out 668 shared-axis
  variants on which no Analysis has an association; the Observed-View Check lists them, finds no association
  on any, and compares the rest with no mismatch (opengwasdb#490). In the completed Dense Component''s
  own variant table, 844,992 of 14,564,257 rows carry no rsid where the shared table has one (opengwasdb#481):
  a lookup by rsid over Dense Analyses misses those variants, and a lookup by ALID or position finds
  them. No statistic is affected. The owner approved marking it validated on 2026-11-25, after its
  benchmark on the published Store (opengwasdb docs/benchmark-output/opengwasdb_ogs00011_hybrid_benchmark.html).


