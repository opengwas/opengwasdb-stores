  Completion under its own id (2026-10-22). The bundle now declares completion_state: reference_completed
  and, after its build phase, a complete block: complete-hybrid against the UKB EUR LD panel, ukb-hg38-eur-ld
  at /data/opengwasdb/reference/ld, for ancestry EUR at 24 workers. The owner decided this on 2026-10-21.
  It is the one amendment ADR 0037 Decision 1 allows an accepted bundle, and its "Clarified by #305" section
  says only how that rule is enforced: the build phase still plans exactly the argv that wrote the published
  Store, with unchanged membership, so completing this Store schedules no rebuild. Every built Analysis
  carries Assigned Ancestry EUR: 3,169 of the bundle''s rows are build members and all of them are EUR, so
  completion imputes all 3,169 and the panel vocabulary matches the Analyses exactly. This Store''s Dense axis
  is the gnomAD v4 EUR common-variant reference, not the UKB panel, so completion extends it: an Overflow
  observation at a variant the panel adds to the Dense axis crosses into the Dense Component as an observed
  cell and leaves the Overflow (opengwas/opengwasdb#99). Release Status is unchanged.


  Release Erratum (issue #225, 2026-10-22): this Store could not be rebuilt from the accepted Build
  Recipe. build-hybrid at the stores pin d405de0 refuses a routing key its sources name with two
  different rsids, and 99,577 case-folded routing keys here are named that way: 105 Analyses, every one
  an upper-case Source against a lower-case one, over the 79.0 M keys that carry a lower-case spelling
  (0.13%). On the owner decision of 2026-10-22 the recipe gains on-rsid-conflict: drop, so a variant
  whose sources disagree stores no rsid, and the build reports how many variants that leaves unnamed
  (opengwas/opengwasdb#306). The counts are carried into the Validation Record of the build that
  replaces this Store. Membership, the completion block and every other build option are unchanged; the
  build phase no longer plans the argv that wrote the published Store, and differs from it only in the
  flag this erratum adds. Release Status is unchanged until that rebuild publishes.

  Release Erratum (issue #225, 2026-10-23): the forced rebuild of 2026-10-22 then built the
  Store and its build step passed, but the HM3 Indexed Variant Subset refused it: 17,151 of the
  1,206,903 HM3 ALIDs the subset requested were present only on the Hybrid''s shared/Overflow
  axis, which the subset''s Dense Component cannot index (opengwas/opengwasdb#271, #324). On the
  owner decision of 2026-10-23 the hm3 declaration gains overflow-only: skip, so those ALIDs
  stay out of the subset and it records how many it left out
  (opengwas/opengwasdb#324). That count is a measurement of the subset build, so it lives in
  the indexed-subset step''s record rather than in the Validation Record, which register
  assembles from the build''s. Membership, the build step, the completion block and every other
  build option are unchanged: a subset is a derived acceleration artifact, so its declaration
  is the only part of the recipe that moves. Release Status is unchanged until the rebuild
  publishes.

  Pre-release rebuild exception (2026-10-29, issue #371, #381): rebuilt at
  opengwasdb commit 70340e0 with the MAF admission fix (opengwasdb#331 / PR #332),
  dropping monomorphic (0.0/1.0) and unreadable frequency rows under the 0.005
  threshold. The off-panel axis shrank from 101,098,177 to 34,653,805 variants with
  100% occupancy and 0 duplicate ALIDs. Disputed rsid collisions resolved via
  on-rsid-conflict: drop (opengwasdb#306). Receipt: docs/data/ogs00011-rebuild-receipt.json.

  Reference completion (issue #401, epic #371, 2026-11-01): the bundle''s completion block ran on the
  MAF-fixed build. complete-hybrid against ukb-hg38-eur-ld at opengwasdb v0.3.0 (bc22e84) took 20.4 h
  and imputed 6,898,789,430 cells. The completed Store holds 48,069,918 variants: 14,267,257 on the
  Dense axis, 851,321 of them added from the panel, and 33,802,661 off-panel. Its validate (v0.3.0)
  passed with one warning, and its HM3 Indexed Variant Subset resolved 1,195,931 of 1,206,903 ALIDs.
  The Observed-View Check failed on 2026-10-31 (see the erratum below). At opengwasdb v0.3.2
  (44f25a9), which reads Z/SE missingness through the missing markers, it passed on 2026-11-01: the
  3,169 Analyses are identical, and 3,454,007,184 sampled Dense cells and 973,004,110 crossovers show
  no mismatch. completion_register published the completed Store on 2026-11-01. The Validation Record
  names v0.3.2 because register runs at the stores pin; each step''s record names the revision it ran
  at (build 70340e0, complete and validate bc22e84, the check 44f25a9).

  Release Erratum (issue #401, 2026-11-01): eight associations store an SE of +inf with a finite Z.
  Each source SE exceeds 65,504, the largest float16 value, and the builder narrows it to +inf
  (opengwas/opengwasdb#338). In the Overflow: GCST012879 at rs138973223 (source SE 67,078), and
  GCST90295971 at rs55671247, rs7897763 and rs192832728 (145,856, 141,528 and 197,392). In the Dense
  Component: GCST90295971 at rs118041704 and rs139555215 (193,677 and 220,834), and GCST90827693 at
  rs6805909 and rs3908969 (110,698,562 each). All eight are degenerate fits (beta -38 to -11,577, p
  0.88 to 1.0). The Store published on 2026-10-29 held the same eight cells, and completion copies
  observed cells exactly. The first Observed-View Check failed on them because it tested missingness
  with isfinite, where the spec defines it by the missing marker (NaN), under which these cells are
  observed (opengwas/opengwasdb#337). On the owner decision of 2026-10-31 the completed Store is
  accepted with them: the check counts them as infinite_cells, and validate from v0.3.2 warns about
  them per Analysis. They are not corrected in place. StoreQuery.lookup filters on isfinite and so
  returns no row for them (opengwas/opengwasdb#338).

  Validated (issue #332, 2026-11-01): accepted -> validated. Read-only checks of the published Store
  at opengwasdb v0.3.2: info reports format 0.2.0, hybrid layout, reference_completed and association
  coverage gwas, and its 3,169 Analysis IDs equal the bundle''s 3,169 admitted rows as sets. The
  Validation Record says passed_with_warnings, from the completion''s validate record (ok; one
  warning: GCST90271757''s EAF orientation is unverified, 342 variants overlapping the reference), and
  the completion''s Observed-View Check record passed. No fresh full validate was run: on this Store
  it takes about 10 h, and the completion''s own validate is the evidence. The owner approved marking
  it validated in this registration on 2026-10-30.'
