notes: 'Deliberately not a replacement for 2018-sun-pilot-100 -- same source, same selection basis, just
  a small independent slice used to prove the build end-to-end without re-running the full 100-analysis
  pipeline.


  Status is `built`, not `validated`: the store built successfully and reads back correctly, but validation.yaml
  correctly reports passed_with_warnings -- opengwasdb''s Ragged builder (opengwasdb.layouts.ragged.build_ssf)
  silently drops analysis_label/trait_ontology_id/trait_ontology_label into the built store despite the
  manifest supplying real values (filed as explodecomputer/opengwasdb#83). This is a real upstream gap,
  not a defect in this release; left failing rather than silently accepted.


  Release Erratum (issue #130): the registry manifest was migrated from the retired trait_id/gene_id/gene_name
  Analysis columns to analysis_label plus an Ensembl trait_ontology_id/trait_ontology_label, using the same
  tracked analysis_targets.tsv evidence. No Store artifact was rebuilt or rewritten by this registry migration;
  the existing validation warnings remain the truthful record of the earlier build.

  Release Erratum (issue #133): assigned_ancestry was recorded as the free-text Source Ancestry Label
  "European" rather than the registry-normalised super-population code "EUR". Corrected in analyses.tsv.
  The quantitative Analyses also stored n_cases/n_controls as 0 where
  the counts are not applicable; those cells are now empty (absence is distinct from zero).
  source_ancestry_label remains "European" as source provenance. No Store artifact was rebuilt or rewritten.

  Release Erratum (issue #141): trait_ontology_id held "ENSEMBL:<gene>" and
  trait_ontology_label held "Ensembl" on all 10 Analysis rows, replacing the
  source-provided EFO terms -- a gene identifier where a Trait Ontology term
  belongs, and an authority name where a trait label belongs (introduced by issue
  #130). The source-supplied EFO term and its trait label from the tracked SomaScan
  target sidecar are restored, with trait_ontology_mapping_method=source_provided.
  GCST005806''s restored term EFO:0021984 is the genuine source term and is obsolete;
  it is recorded as source_provided rather than replaced with an invented
  non-obsolete term. GCST90240123 is an aggregate assay over the seven-member
  14-3-3 family: its restored term is the source''s EFO:0020109 "14-3-3 protein
  family measurement", and its analysis_label is now the SomaScan SeqId 4707-50
  rather than the single member gene YWHAH that SomaScan.db maps the probe to
  (somascan_is_multiple is 0 for this SeqId, so the source label''s own seven-member
  list is the tracked evidence that identifies the aggregate). The gene/Ensembl
  identity remains target annotation in trait_chr/trait_bp and the sidecar. No
  Store artifact was rebuilt or rewritten.

  Rebuilt to record its regions (issue #224, opengwas/opengwasdb#430, 2026-11-11). The owner decided
  that a Ragged Store keeps the regions its Release Bundle retains (opengwas/opengwasdb-stores#459)
  and approved a forced rebuild of this one. `pixi run -e workflow release OGS-00007 --config force=1`
  at 8979754e, opengwasdb 0.9.0 (ea81c4a), ran from 23:34:57 to 23:35:46 UTC, exit 0, building in 7 s.
  The build reproduced this unchanged bundle''s counts (10 Analyses, 171,006 variants, 202,803
  associations) and now also carries its sidecars/sparse_regions.tsv as regions.tsv, declared in the
  manifest and stamped format 0.2.1, the lowest version a Store with that file uses. Its regions are
  10 cis and 10 significant_trans regions over all 10 Analyses, plus 347 suggestive_trans rows that
  are never completion regions. validate reports no errors and no warnings, against the earlier
  record''s opengwasdb#83 label and ontology warnings, and the Validation Record `register` wrote now
  records the counts the migrated one left null. That paragraph''s claim that no Store artifact was
  rebuilt or rewritten covers the record edit it describes, not this rebuild. The Store it replaced
  is archived under /data/opengwasdb/stores/OGS-00007/replaced/20261111T233505Z/, kept because the run
  was forced (#309); deleting it is the owner''s call. The Store stays observed_only, this bundle
  declares no completion, and the Release Status is unchanged at built.

  Archive deleted (2026-11-12). On the owner''s decision, the arrays of the Store archived under
  replaced/20261111T233505Z/ were deleted. The archive keeps its records/ and validation.yaml, as
  ADR 0037 keeps on an unforced replacement, so the change stays dated and evidenced.

  Forced 0.3.0 rebuild (issue #514, 2026-11-25). The first forced release of any Store under format 0.3.0, run
  on the owner''s approval of 25 Nov 2026 so that the Store is written in the current format. `pixi run -e
  workflow release OGS-00007 --config force=1` at e4f6abf7, opengwasdb 0.17.0
  (69c2945229070ede4ccf8ced0520b281a87a0d68), ran from 09:18:39 to 09:19:18 UTC on 2026-11-25, exit 0, 39 s
  wall (build 7.3 s, top-hits 1.0 s, validate 3.2 s, register under 1 s). The Store is now format_version
  0.3.0. The counts differ from the 0.2.1 build: 10 Analyses (unchanged), 159,816 variants (was 171,006) and
  189,448 associations (was 202,803). The cause is the indel rule the engine gained after that build, not a
  change to the sources: opengwasdb ADR 0079 section 7 (the owner''s rulings of 4 and 7 Nov 2026), the
  `indel_ssf_unharmonised` reason in ADR 0072''s rule table (`admission/14`), opengwasdb #381 and its
  `381-indel-alid-reference-first.breaking.md` fragment (format 0.2.2). Every indel in a GWAS-SSF file with no
  harmoniser column is dropped, because the file declares no reference allele and so no ALID can spell the
  indel reference first. The admission record (store.opengwasdb.admission/admission.json) examined 202,803
  rows, admitted 189,448 and dropped 13,355, all for that one reason (1,036 of them PDK1''s 14,894). They are
  carried by 11,190 distinct variants: the variants in the 0.2.1 Store and not in this one are exactly those
  11,190, all indels, the set of source keys in the admission record''s dropped/ logs is the same set, and the
  0.2.1 Store held 13,355 associations on them. No variant was added and no SNP was lost. The regions are
  unchanged at 10 cis, 10 significant_trans and 347 suggestive_trans rows. validate reports no errors and no
  warnings. No audit applies to a Ragged Observed-Only Store: `audit-store reconcile` and `attribute` refuse a
  Store that is not Hybrid (both exit 2). The Store it replaced (0.2.1) is archived under
  /data/opengwasdb/stores/OGS-00007/replaced/20261125T091843Z/, kept because the run was forced (#309);
  deleting it is the owner''s call. The Store stays observed_only, and the Release Status is as register left
  it: built.
  '
