  2026-10-27: replaced before release. The owner decided that OGS-00027 is replaced in place, with no erratum, because it is pre-release (opengwas/opengwasdb-stores#282 comment 6382592883). This bundle supersedes the one accepted on 2026-10-22 (inventory eqtlgen-cis-full-2026-10-22d, built at opengwasdb d8896e4, validated 2026-10-23). It differs in exactly these ways: each Analysis''s sample_size is the maximum of its probe''s published per-pair N (13,696 of 19,250 values differ from the recovered maximum: 13,645 lower by 1 to 13 and 51 higher by up to 1,402; 5,554 are unchanged); sample_size_scope is variant_level; the build stores the per-pair N plane (--sample-size-table) and the .esi allele frequency (--store-esi-eaf, checked against the UK Biobank United Kingdom frequencies) on opengwasdb 0d59f151, with SE float16; and the frozen inventory is eqtlgen-cis-full-2026-10-24. Membership, ancestry, quality checks and every other Analysis column are unchanged.'
