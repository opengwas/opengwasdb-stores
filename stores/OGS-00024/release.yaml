description: |
  Full African-ancestry slice of the Chen et al. 2023 plasma metabolome atlas (PMID 36635386): every candidate analysis for this ancestry, no cap, as a single-ancestry no-cis ragged GWAS-SSF release.
generator:
  version: sha256:d48e94f4170c4e91a8713c2891d4da46399ae53fed26867c2a40d86cc72b2dfe
  commands:
    - Rscript resources/generators/gwas-ssf-ragged/generate.R --config=families/metabolome-plasma-2023/generators/config-african.yaml --mode=emit
notes: |
  Production-scale sibling of the 2023-chen-pilot-80 pilot (issue #27), scaled up per-ancestry (issue #31's "run the whole thing" follow-on): single-ancestry selection (ancestry_group: African, matching the candidates table's own store_key partitioning) rather than the pilot's mixed-ancestry-plus-AF-assignment approach, since each store here is already known single-ancestry from the source label. ancestry_assignment stays enabled with the fixed QC panel (issue #28/#29/#30) as a source/AF mislabel QC check, not for splitting.

  Built (opengwasdb#100/#101 fixes; opengwasdb@1ecfd1e): 1,034 analyses, 7,067,555 variants, 31,986,793 associations. 22 duplicate (analysis, variant) pairs had conflicting z-scores across two source rows and were dropped entirely for those cells (opengwasdb#101) -- see validation.yaml's warning. Reference completion is currently blocked: complete_ragged_store only enumerates LD blocks via a cis window (trait_chr/trait_bp), which this no-gene-target family has none of, so completion is a no-op (opengwasdb#102). No Reference-Completed sibling exists yet.

  Release Erratum (issue #133, applied here during the #252 migration): the
  quantitative Analyses stored `n_cases` and `n_controls` as 0 where the counts
  are not applicable (`sample_size_kind: total`). Those cells are now empty, since
  absence is distinct from zero; `source_ancestry_label` keeps the source's own
  "African", and `assigned_ancestry` already held the super-population
  code. No Store artifact was rebuilt or rewritten.

  Migration (#252): migrated from the retired family-first
  `metabolome-plasma-2023/2023-chen-full-african` layout to OGS-00024, in the current bundle
  schema (`store_id`, `label`, `derived_from`; `build.yaml` with a `build` block).
  Its 1,034-Analysis Release Manifest, `built` Release Status and
  Validation Record are the ones the Store was released with; nothing was rebuilt,
  revalidated or rewritten. `derived_from` is null: the Chen ancestry slices are
  siblings of one Source Collection, not children of one another. The recorded
  generator command is the one that ran, path included, even though that config
  path went with the directory; the Chen Source Collection's release config
  lives under `resources/generators/gwas-catalog-ragged/`.

  Release Erratum (issue #445, 2026-11-06): the Store this bundle records was gone.
  Neither `/data/opengwasdb/stores/OGS-00024/store.opengwasdb` nor the filtered sources
  its Release Manifest names under `/data/opengwasdb/metabolome-plasma-2023/` existed,
  and the release benchmark reported the Store as `artifact_absent`. On the owner
  decision of 2026-11-05 the Store was rebuilt in place from this unchanged bundle --
  same Release Manifest, same Build Recipe, still observed_only -- as OGS-00006 was in
  #332.

  The sources were re-materialised first, each at the path the Release Manifest names:
  `materialise-gwas-ssf-ragged.R` downloaded every Analysis's `source_url` from EBI
  again and filtered it to this bundle's `sidecars/sparse_regions.tsv` and the QC panel
  `qc-panel-hg38`, unchanged since #29. 1,024 of the 1,034 files came out byte-identical
  to the R generator's. In the other 10 the materialiser also kept a second row at a
  suggestive lead's position and id, a multi-allelic sibling that R's filter had not
  kept; each was cut back to R's lead row, the sibling with the smaller p. All 1,034
  files then matched the sha256 the Release Manifest records, so the rebuild read
  exactly the inputs the August build read.

  The run at opengwasdb `42850d8` (0.5.0, format 0.2.0) passed `--association-coverage
  signals_only` and `--admission-record`; its build step took 615 seconds, and it
  archived nothing under `replaced/` because there was no Store to replace. `opengwasdb
  info` reports format 0.2.0, `signals_only` and `observed_only`. The Store reproduces
  the August build's counts: 1,034 Analyses, 7,067,555 variants and 31,986,793
  associations, the Admission record dropping, as in August, the 22 duplicate (analysis,
  variant) pairs whose two source rows conflict (44 rows). The Validation Record is the
  one `register` wrote for that run, `passed_with_warnings`. 1,029 of the 1,034 Analyses
  store EAF whose orientation is unverified, because only 20 to 461 of their variants
  overlap the reference panel that check uses, below the 500 it requires (the class
  OGS-00006 carries). The record also notes that the Analyses were resolved with
  opengwasdb 0.1.0: that is the August resolution this unchanged bundle keeps. The
  release moves from `built` to `validated`.

  Rebuilt to record its regions (issue #224, opengwas/opengwasdb#430, 2026-11-11). The owner decided
  that a Ragged Store keeps the regions its Release Bundle retains (opengwas/opengwasdb-stores#459)
  and approved a forced rebuild of this one. `pixi run -e workflow release OGS-00024 --config force=1`
  at 8979754e, opengwasdb 0.9.0 (ea81c4a), ran from 23:35:46 to 23:47:22 UTC, exit 0, building in 10 m
  24 s. The build reproduced the counts the paragraph above records from the August build of this
  unchanged bundle: 1,034 Analyses, 7,067,555 variants and 31,986,793 associations, and now also
  carries its sidecars/sparse_regions.tsv as regions.tsv, declared in the manifest and stamped format
  0.2.1, the lowest version a Store with that file uses. Its regions are 4,252 significant_trans
  regions over 918 of the 1,034 Analyses, plus 109,221 suggestive_trans and 22,748 qc_panel rows that
  are never completion regions; 116 Analyses hold none. validate reports no errors and the same 1,029
  EAF-orientation warnings as before. The Store it replaced is archived under
  /data/opengwasdb/stores/OGS-00024/replaced/20261111T233555Z/, kept because the run was forced
  (#309); deleting it is the owner's call. The Store stays observed_only, this bundle declares no
  completion, and the Release Status is unchanged at validated.

  Archive deleted (2026-11-12). On the owner's decision, the arrays of the Store archived under
  replaced/20261111T233555Z/ were deleted. The archive keeps its records/ and validation.yaml, as
  ADR 0037 keeps on an unforced replacement, so the change stays dated and evidenced.
