notes: |
  Production-scale sibling of the 2023-chen-pilot-80 pilot (issue #27), scaled up per-ancestry (issue #31's "run the whole thing" follow-on): single-ancestry selection (ancestry_group: East Asian, matching the candidates table's own store_key partitioning) rather than the pilot's mixed-ancestry-plus-AF-assignment approach, since each store here is already known single-ancestry from the source label. ancestry_assignment stays enabled with the fixed QC panel (issue #28/#29/#30) as a source/AF mislabel QC check, not for splitting.

  Built (opengwasdb#100/#101 fixes; opengwasdb@1ecfd1e): 1,038 analyses, 1,176,410 variants, 7,380,542 associations. No duplicate (analysis, variant) conflicts found for this ancestry. Reference completion is currently blocked: complete_ragged_store only enumerates LD blocks via a cis window (trait_chr/trait_bp), which this no-gene-target family has none of, so completion is a no-op (opengwasdb#102). No Reference-Completed sibling exists yet.

  Release Erratum (issue #133, applied here during the #252 migration): the
  quantitative Analyses stored `n_cases` and `n_controls` as 0 where the counts
  are not applicable (`sample_size_kind: total`). Those cells are now empty, since
  absence is distinct from zero; `source_ancestry_label` keeps the source's own
  "East Asian", and `assigned_ancestry` already held the super-population
  code. No Store artifact was rebuilt or rewritten.

  Migration (#252): migrated from the retired family-first
  `metabolome-plasma-2023/2023-chen-full-east-asian` layout to OGS-00025, in the current bundle
  schema (`store_id`, `label`, `derived_from`; `build.yaml` with a `build` block).
  Its 1,038-Analysis Release Manifest, `built` Release Status and
  Validation Record are the ones the Store was released with; nothing was rebuilt,
  revalidated or rewritten. `derived_from` is null: the Chen ancestry slices are
  siblings of one Source Collection, not children of one another. The recorded
  generator command is the one that ran, path included, even though that config
  path went with the directory; the Chen Source Collection's release config
  lives under `resources/generators/gwas-catalog-ragged/`.
