  `completion-clump`
  (6.2 s), `completion-validate` (24.6 s) and `completion-observed-view-check` (187.0 s) and published: 11
  min 34.8 s wall, peak RSS 3,141,388 kB, load average 126 before and 63 after. Times: 14:27:56 to
