description: |
  Full East Asian-ancestry slice of the Chen et al. 2023 plasma metabolome atlas (PMID 36635386): every candidate analysis for this ancestry, no cap, as a single-ancestry no-cis ragged GWAS-SSF release.
generator:
  version: sha256:d48e94f4170c4e91a8713c2891d4da46399ae53fed26867c2a40d86cc72b2dfe
  commands:
