notes: |
  Production-scale sibling of the 2023-chen-pilot-80 pilot (issue #27), scaled up per-ancestry
  (issue #31's "run the whole thing" follow-on): single-ancestry selection (ancestry_group: East
  Asian, matching the candidates table's own store_key partitioning) rather than the pilot's
  mixed-ancestry-plus-AF-assignment approach, since each store here is already known single-ancestry
  from the source label. ancestry_assignment stays enabled with the fixed QC panel (issue
  #28/#29/#30) as a source/AF mislabel QC check, not for splitting.

  Built (opengwasdb#100/#101 fixes; opengwasdb@1ecfd1e): 1,038 analyses, 1,176,410 variants,
  7,380,542 associations. No duplicate (analysis, variant) conflicts found for this ancestry.
  Reference completion is currently blocked: complete_ragged_store only enumerates LD blocks via a
  cis window (trait_chr/trait_bp), which this no-gene-target family has none of, so completion is a
  no-op (opengwasdb#102). No Reference-Completed sibling exists yet.

  Release Erratum (issue #133, applied here during the #252 migration): the
  quantitative Analyses stored `n_cases` and `n_controls` as 0 where the counts
  are not applicable (`sample_size_kind: total`). Those cells are now empty, since
  absence is distinct from zero; `source_ancestry_label` keeps the source's own
  "East Asian", and `assigned_ancestry` already held the super-population
  code. No Store artifact was rebuilt or rewritten.

  Migration (#252): migrated from the retired family-first
  `metabolome-plasma-2023/2023-chen-full-east-asian` layout to OGS-00025, in the current bundle
  schema (`store_id`, `label`, `derived_from`; `build.yaml` with a `build` block).
  Its 1,038-Analysis Release Manifest, `built` Release Status and
  Validation Record are the ones the Store was released with; nothing was rebuilt,
  revalidated or rewritten. `derived_from` is null: the Chen ancestry slices are
  siblings of one Source Collection, not children of one another. The recorded
  generator command is the one that ran, path included, even though that config
  path went with the directory; the Chen Source Collection's release config
  lives under `resources/generators/gwas-catalog-ragged/`.

  Release Erratum (issue #445, 2026-11-06): the Store this bundle records was gone.
  Neither `/data/opengwasdb/stores/OGS-00025/store.opengwasdb` nor the filtered sources
  its Release Manifest names under `/data/opengwasdb/metabolome-plasma-2023/` existed,
  and the release benchmark reported the Store as `artifact_absent`. On the owner
  decision of 2026-11-05 the Store was rebuilt in place from this unchanged bundle --
  same Release Manifest, same Build Recipe, still observed_only -- as OGS-00006 was in
  #332.

  The sources were re-materialised first, each at the path the Release Manifest names:
  `materialise-gwas-ssf-ragged.R` downloaded every Analysis's `source_url` from EBI
  again and filtered it to this bundle's `sidecars/sparse_regions.tsv` and the QC panel
  `qc-panel-hg38`, unchanged since #29. All 1,038 files came out byte-identical to the R
  generator's. All 1,038 files then matched the sha256 the Release Manifest records, so
  the rebuild read exactly the inputs the August build read.

  The run at opengwasdb `42850d8` (0.5.0, format 0.2.0) passed `--association-coverage
  signals_only` and `--admission-record`; its build step took 158 seconds, and it
  archived nothing under `replaced/` because there was no Store to replace. `opengwasdb
  info` reports format 0.2.0, `signals_only` and `observed_only`. The Store reproduces
  the August build's counts: 1,038 Analyses, 1,176,410 variants and 7,380,542
  associations, the Admission record with no conflicting duplicate, as in August. The
  Validation Record is the one `register` wrote for that run, `passed_with_warnings`.
  All 1,038 Analyses store EAF whose orientation is unverified, because only 90 to 162
  of their variants overlap the reference panel that check uses, below the 500 it
  requires (the class OGS-00006 carries). The record also notes that the Analyses were
  resolved with opengwasdb 0.1.0: that is the August resolution this unchanged bundle
  keeps. The release moves from `built` to `validated`.

  Rebuilt to record its regions (issue #224, opengwas/opengwasdb#430, 2026-11-11). The owner decided
  that a Ragged Store keeps the regions its Release Bundle retains (opengwas/opengwasdb-stores#459)
  and approved a forced rebuild of this one. `pixi run -e workflow release OGS-00025 --config force=1`
  at 8979754e, opengwasdb 0.9.0 (ea81c4a), ran from 23:47:22 to 23:50:36 UTC, exit 0, building in 2 m
  23 s. The build reproduced the counts the paragraph above records from the August build of this
  unchanged bundle: 1,038 Analyses, 1,176,410 variants and 7,380,542 associations, and now also
  carries its sidecars/sparse_regions.tsv as regions.tsv, declared in the manifest and stamped format
  0.2.1, the lowest version a Store with that file uses. Its regions are 439 significant_trans regions
  over 318 of the 1,038 Analyses, plus 19,835 suggestive_trans and 22,836 qc_panel rows that are never
  completion regions; 720 Analyses hold none. validate reports no errors and the same 1,038
  EAF-orientation warnings as before. The Store it replaced is archived under
  /data/opengwasdb/stores/OGS-00025/replaced/20261111T234732Z/, kept because the run was forced
  (#309); deleting it is the owner's call. The Store stays observed_only, this bundle declares no
  completion, and the Release Status is unchanged at validated.

  Archive deleted (2026-11-12). On the owner's decision, the arrays of the Store archived under
  replaced/20261111T234732Z/ were deleted. The archive keeps its records/ and validation.yaml, as
  ADR 0037 keeps on an unforced replacement, so the change stays dated and evidenced.

  2026-11-25: rebuilt at format 0.3.0 (#524, epic #520). The owner approved rebuilding the
  priority Stores at format 0.3.0 on 2026-11-25 (opengwas/opengwasdb-stores#498), and this one by a
  forced run on this host: `pixi run -e workflow release OGS-00025 --config force=1`, after
  `release-dry`, at 4c1cdf88 with opengwasdb 0.20.0 (c8ebe4ca), from 15:13:15 to 15:16:44 UTC, exit 0,
  in 3 min 53 s wall (peak RSS 3,475,996 kB; load average 14.65 before and 15.68 after, with the 0.2.0
  conversions running beside it). Steps: build 178.4 s, top-hits 1.8 s, validate 10.4 s. The Store is
  observed_only, stamped format 0.3.0, and carries the 0.3.0 envelope (the variable-length ALID,
  position and source_alid sidecars, regions.tsv; no variant_offsets.npy and no index.sqlite); it
  reads without pysam. Counts against the 0.2.1 build: 1038 Analyses (unchanged), variants 1,176,410
  to 1,129,442, associations 7,380,542 to 7,086,100. The 294,442 associations it lost are all rows the
  0.17.0 builder drops as `indel_ssf_unharmonised` (Admission record
  `store.opengwasdb.admission/admission.json`: 7,380,542 examined, 7,086,100 admitted, no other drop
  reason), as for every GWAS-SSF Store at 0.3.0 (#514), and the 46,968 variants are the indels that no
  longer have an association. Stored z and EAF equal the 0.2.1 values on every shared row of the three
  Analyses compared; SE is now coded from the source's SE coefficients (opengwasdb ADR 0068) and sits
  within 0.2% of the source's standard error, where 0.2.1 differed by up to 6.4% in those three.
  validate reports no errors and 1,039 warnings: the same EAF-orientation warning for every Analysis
  as before, and the note that the Analyses were resolved with opengwasdb 0.1.0 (this unchanged bundle
  keeps its August resolution). The Validation Record is the one `register` wrote. The 0.2.1 Store it
  replaced is archived under /data/opengwasdb/stores/OGS-00025/replaced/20261125T151300Z/, kept
  because the run was forced (#309); deleting it is the owner's call. The Release Status is unchanged
  at validated.

