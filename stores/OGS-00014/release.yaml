notes: |-
  Ancestry bucket AMR; 1053 intended Analyses. candidate_store_key dense__pmid-39024449__Hispanic-or-Latin-American. The exact 1053-Analysis AMR membership is accepted and frozen as the input manifest for owner-authorized dev construction. Release Status is 'accepted' because #247 is the registry's fixed-input acceptance gate for a buildable bundle; it is not scientific release acceptance, publication approval or mirror promotion, and no Store has been built or validated yet.

  Owner build authority. Owner approved the MVP bundle integration and the dev builds (opengwas/opengwasdb-stores#221 comment 6156153525; #232 comment 6156153173). The parent's exact 1053-Analysis record binding and staged-artifact review qualify this input manifest for authorized dev construction. (emit config id_allocation_status: owner-authorized-2026-10-13, owner_ordering_approved: true).

  Evidence boundary. The Analytical Metadata comes from an owner-authorized bounded metadata resolution whose source-evidence scope is a capped diagnostic (resolver receipt source_evidence_scope: capped_pilot_diagnostic); 1053/1053 AMR Analyses resolved with outcome ok, zero escaped pids and an unchanged metadata content hash. A capped run is a diagnostic, never a whole-source SCI qualification. Human scientific acceptance remains pending (validation.yaml:acceptance.human_acceptance) and is not claimed here. The corrected re-emission is metadata-only from the existing qualified records (no resolution rerun, no association-body read).

  Source ancestry. Every row carries source_ancestry_label AMR -- the exact authority acquisition-mapping ancestry. 203 of the 1,053 Analyses carry no assigned ancestry and are preserved with an empty assigned_ancestry and ancestry_assignment_method: unassigned (200 refused by the margin gate, 3 by the proportion gate); they are not forced to AMR. The remaining 850 publish AMR/af_assigned.

  Canonical tuple. 850 x AMR/af_assigned + 203 x empty/unassigned (assigned_ancestry/ancestry_assignment_method). The corrected re-emission changed only the source_ancestry_label column and the META canonical method, leaving every sample size, effect scale, source ID, source path and evidence tag unchanged.

  Provenance bindings. This bundle is bound to the actual source snapshot named in source_snapshot (metadata refresh root + content sha, mapping table sha, source-metadata fingerprint snapshot, candidate table sha, planned manifest sha, resolution table sha) and to the resolver/emission records (resolution receipt sha, records index sha, merge receipt sha, emission config sha, parent-code receipt sha) plus the authoritative emission code commit 26d834eba609c21c09be0137c4a0d00846a355c3 and its two script sha256s. No scientific release validation, publication approval or mirror promotion is claimed.

  Store built and published (issue #331, 2026-10-22). The #221 batch built this release's Store from stores cde84de with opengwasdb 0.3.0 at 4e92256, format 0.2.0, GRCh38. The build ran from 2026-10-14 18:05 to 2026-10-18 12:44 UTC (90.6 h). Top hits, the HM3 Indexed Variant Subset and the overview followed, then validate, from 2026-10-20 11:55 to 2026-10-20 17:38 UTC (5.7 h). register published the Store on 2026-10-20 21:54 UTC and wrote the Validation Record, copied into this bundle unchanged. It replaces the bundle's earlier Validation Record, which recorded the owner authorization and the pending human acceptance the paragraphs above cite; that record is in git at its acceptance.commit, 9c9b92b. The new record reads status passed, with no warnings or errors, and reports 1,053 Analyses, 27,860,266 variants and 29,336,860,098 associations. The Store is observed-only; reference completion is not part of this release. The Store was built in a dev Artifact Root, /data/opengwasdb/work/epic232/221/dev-builds-16w. On 2026-10-22, tools/relocate_store.py moved it to /data/opengwasdb/stores, renaming its directory and rewriting the 33 artifact paths in its six step records; stdout and stderr were left as written. The receipt beside the Store, relocations/20261022T151439.023917Z.json, holds each record's sha256 before and after. The Store is published at /data/opengwasdb/stores/OGS-00014/store.opengwasdb. This supersedes the statements above, and in the description, that no Store has been built or validated. The Validation Record's acceptance.warnings still say "No Store build or validation has run." That line is carried over from the accepted bundle's earlier record and predates the build. Human scientific acceptance remains pending.

  Completion under its own id (2026-10-23). The bundle now declares completion_state: reference_completed and, after its build phase, a complete block: complete-dense against the HGDP+1kGP AMR LD Reference Resource, hgdp1kgp-hg38-amr-ld at /data/opengwasdb/reference/hgdp1kgp-hg38-amr/panel, for ancestry AMR at 32 workers. The owner decided this on 2026-10-23, accepting the #241 pilot's panel for completion. The panel's 1,357 blocks take the EUR block layout and were estimated from the 345 1kGP Phase 3 AMR samples at a minor-allele-frequency floor of 1%; its declaration is on PR #349, so the complete block names the panel by path alone. It is the one amendment ADR 0037's Decision 1 allows an accepted bundle, the amendment #305 clarifies: the build phase still plans exactly the argv that wrote the published Store, with unchanged membership, so completing this Store schedules no rebuild. Completion imputes only the 850 Analyses whose Assigned Ancestry is AMR; the other 203 carry none and stay observed-only inside the completed Store. The completion phase writes to store.opengwasdb.partial, runs the Observed-View Check, and publishes under the release id OGS-00014-completed, replacing the Observed-Only Store at /data/opengwasdb/stores/OGS-00014/store.opengwasdb once it registers. Until that run finishes, the sentence above that reference completion is not part of this release still describes the published Store. Release Status stays validated.
