notes: 'Completion adds no new Analyses -- analyses.tsv here is unchanged from pilot-10, repeated per
  the release-bundle convention (self-contained bundles). LD reference completion parameters: min_cor
  0.7, pca_thresh 0.9 (opengwasdb defaults), ancestry EUR (a direct match -- eqtlgen''s donors are the
  eQTLGen Consortium''s whole-blood EUR meta-analysis cohort, no ancestry-approximation caveat needed
  here, unlike finngen-r13-completed).


  From the built manifest''s completion provenance: 207,764 total variants across the completed union
  (121,388 newly added by the LD panel beyond the 86,376-variant build panel), 106,653 imputed cells,
  14,735 left missing (no correlated on-panel neighbour clearing min_cor). `opengwasdb validate` reports
  valid.


  Release Erratum (issue #134): the 10 Analysis rows leave stored_effect_scale,
  sample_size_kind, sample_size_scope, sample_size, original_effect_scale,
  original_sd_method, and ancestry_assignment_method blank, inherited from parent
  release OGS-00001. The source BESD format does not carry sample size, effect scale,
  or ancestry metadata per probe or association, and this metadata is not resolvable
  from tracked evidence inside this repository. In accordance with the project principle
  that a wrong answer that looks like a right answer is the worst outcome, values are left
  blank rather than defaulted or fabricated pending external study-level metadata and upstream
  schema resolution.

  Release Erratum (issue #141): trait_ontology_id held "ENSEMBL:<gene>" and
  trait_ontology_label held "Ensembl" on all 10 Analysis rows (inherited from
  parent release OGS-00001) -- a gene identifier where a Trait Ontology term
  belongs, and an authority name where a trait label belongs. The eQTLGen BESD
  source supplies no controlled-vocabulary Trait term, so
  both fields are now empty rather than carrying a gene id or a guess: the absence
  is the visible, correct answer. The gene identity remains target annotation in
  trait_chr/trait_bp and analysis_label. No Store artifact was rebuilt or rewritten.

  Release Erratum (issue #195): validation.yaml recorded observed.format_version as "1.0".
  No build or validate step reported that value. It was register''s own default, written
  when no step reported a version; PR #196 removes that default, so a version no step
  reports is now recorded as null. "1.0" is not this Store''s format: it names a retired
  pre-reset encoding (fixed-point z, opengwasdb#114) that current opengwasdb refuses to
  read. The true value comes from the Store''s manifest.json, which declares
  format_version "0.1.0".
  Completion keeps its source''s format_version (opengwasdb ADR 0038), and 0.1.0 is
  the only format opengwasdb writes at a9e8bc8, the revision this record names, and
  at 987aec1, the revision that rebuilt the published Store.
  Corrected to 0.1.0 in validation.yaml. No Store artifact was rebuilt or rewritten
  by this registry metadata correction.

  Re-completed 2026-11-02 (issue #348): the completion ran again against the
  repaired HGDP+1kGP EUR panel (/data/opengwasdb/reference/hgdp1kgp-hg38/panel),
  consuming the rebuilt OGS-00001, at opengwasdb 0.3.2 (44f25a96). The first
  completion read the panel before its repair, so imputed cells took the other
  allele frequency as EAF and cells whose panel ALID was duplicated may have taken
  the wrong row LD. Format 0.1.0 became 0.2.0. Counts before and after are
  identical: 207,764 variants, 207,761 associations, 106,653 imputed, 14,735
  missing. The reference EAF, read through the core and compared with UKB United
  Kingdom frequencies oriented to the Store EA, went from r = -0.978 to r = +0.979
  over the same 94,629 matched variants. validate passed. The previous Store and
  records are kept in
  /data/opengwasdb/stores/OGS-00002/replaced/20261102T073446Z. This supersedes the
  format 0.1.0 statements in the earlier errata above, which are left as written.

  Release Erratum (issue #460, opengwas/opengwasdb#433, 2026-11-12): this Store''s completion was
  centred off its genes. Its Trait positions were GRCh37 on GRCh38 variants, and the completion then
  filled the LD blocks its regions touched rather than only its cis windows, so a #430-era check found
  65,671 of its imputed and 11,519 of its missing rows outside the cis windows its Analyses hold. The
  counts the two paragraphs above record -- 207,764 variants, 207,761 associations, 106,653 imputed and
  14,735 missing -- are therefore no longer this Store''s. On the owner''s approval of 2026-11-12,
  OGS-00001 was rebuilt at opengwasdb 0.9.1 (9c98a52) so that opengwas/opengwasdb#433 lifts Trait
  positions with the variants, and a forced `pixi run -e workflow release OGS-00002 --config force=1`
  at 9984588b re-completed this Store from that rebuild against
  /data/opengwasdb/reference/hgdp1kgp-hg38/panel for EUR, running from 00:13:39 to 00:15:38 UTC on
  2026-11-13, exit 0, completing in 82 s and validating in 4.5 s. The completion imputed only inside the
  23 cis regions its 10 Analyses hold: 123,895 variants, 123,892 associations, 37,502 imputed and 17
  missing. The Observed-View Check from the rebuilt OGS-00001 passed over all 10 Analyses: it reproduced
  all 86,373 observed associations exactly, found the 37,502 imputed and the 17 missing rows all inside
  those 23 cis regions, and every failing counter is zero. validate reports no errors and no warnings,
  and the Store is format 0.2.0 as before. The Store it replaced is archived under
  /data/opengwasdb/stores/OGS-00002/replaced/20261113T001349Z/; on the owner''s decision of 2026-11-12
  its arrays were deleted, so the archive keeps its records/ and validation.yaml, as ADR 0037 keeps on
  an unforced replacement, and the change stays dated and evidenced. The #195 erratum''s "987aec1, the
  revision that rebuilt the published Store" no longer describes the published Store, which was
  re-completed at 9c98a52, and the Release Status is unchanged at validated.
