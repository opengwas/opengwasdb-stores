  Policy: full-reference AF ancestry assignment and source-AF-only quantitative phenotype-SD estimation
  (issue #152); case-control rows use log_or/binary_trait; non-target/unassigned ancestry, orientation
  failures, unusable source AF and ordinary resolution failures are controlled exclusions (sidecars/exclusions.tsv).


  Store composition (#203): this shared Store admits only Analyses whose rows were MAF-filtered; an included
  Analysis with no applied MAF floor is excluded as not_maf_filtered.


  Exclusions by reason: ancestry_not_eur=44, ancestry_unassigned=29, effect_placeholder_rows=44, missing_case_control_counts=3,
  no_build_eligible_rows=36, not_maf_filtered=4, orientation_failure=4


  Review: 77 Analysis/Analyses excluded by ancestry policy (unassigned, non-target, or orientation failure);
  see sidecars/exclusions.tsv


  Review: 17 included Analysis/Analyses have a high-dispersion SD estimate; see sidecars/sd_estimation.tsv


  Review: 3 Analysis/Analyses had incomplete resolved metadata and were excluded; see sidecars/exclusions.tsv


  Review: 4 Analysis/Analyses had no MAF floor applied and were excluded from this shared Store as not_maf_filtered
