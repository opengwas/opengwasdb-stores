  2026-11-26: one Analysis excluded and the release rebuilt from source (#532, epic #520). The clump
  diagnosis (reports/clumpdiag.md) found that GCST90278111 (Kamiza et al. 2023, LDL cholesterol, AFR,
  PMID 37669986; Analysis 55) has a mis-scaled z: all 20,689,282 of its variants are at 5e-8
  (n_hits_5e8), the median |z| is 3.2e6, and it holds 99.4 % of the Store''s tier rows. Its source''s
  beta is about -5.6e5 at p = 0.054 with a standard error of 0.07, so the beta is mis-scaled while the
  p-value and standard error are plausible. It made `completion-clump` take over 3 h and the killed
  run reach 4 h; it would also distort `n_loci_5e8` and the overview. The owner ruled on 2026-11-26
  (#520 comment 7202276131, item 8) to exclude it and rebuild OGS-00033 from source with
  force, then complete it; the owner accepted discarding the refused completion''s staged
  `store.opengwasdb.partial`. The row now carries `exclude_from_build: true` and `inclusion_reason`
  (ADR 0025), the exclusions and quality-check sidecars name it under `mis_scaled_z`, and the bundle
  plans 193 Analyses where the published Store has 194. The build keeps `on-rsid-conflict: drop` (the
  2026-11-25 ruling). The amendment check refuses an unforced run (membership) and the forced run bypasses
  it, as ADR 0037 provides. The forced release that followed replaced the published Store, which is
  archived under replaced/ (paragraph below).

