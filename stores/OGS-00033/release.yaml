  2026-11-25: build recipe gains on-rsid-conflict: drop (#524, epic #520). The first forced run of
  this bundle (release OGS-00033 at 4c1cdf88, opengwasdb 0.20.0) refused in build after 24
  minutes: "Hybrid single-pass build: two source variants case-fold to one routing key
  ''1:46934387:G:A'' with different rsids: (''1'', 46934387, ''G'', ''A'') names ''rs9333012'' but
  (''1'', 46934387, ''g'', ''a'') names ''rs71500102''". Six included Analyses, GCST90014293 to
  GCST90014298 (PMID 34187551), spell every allele in lower case (about 12.99 million rows each); the
  engine upper-cases alleles for identity, so their data route correctly, but the rsID harvest
  compares the names two spellings of one key carry. The owner decided on 2026-11-25 (#520 comment
  7185997253, item 1) to blank those rsIDs and keep all 194 Analyses, as OGS-00011''s recipe does.
  The
  build therefore passes --on-rsid-conflict drop: every stored variant whose key the build finds disputed is
  stored with no rsID (also when the other allele order names it) and is still found by ALID and by
  position; the build reports them in its rsid_conflicts record. Membership and every Analysis column
  are unchanged.

  Its hm3 declaration gains overflow-only: skip (2026-11-25), as OGS-00011''s did on the owner
  decision of 2026-10-23 and OGS-00004''s and OGS-00005''s on 2026-11-18 (opengwas/opengwasdb#271):
  HapMap3 variants that reach only the shared/overflow axis cannot be indexed by the Dense Component, so
  the subset leaves them out and records how many. The forced release of 2026-11-25 (#524) built the
  Hybrid Store, then its indexed-subset-hm3 Step refused for 18,778 such variants (exit 1 at
  18:45:02 UTC after 1 h 41 min); the
  build had succeeded. Those variants stay in the Store and are found by ALID and by position; only
  the hm3 subset omits them.

  2026-11-25: built at format 0.3.0 (#524, epic #520). On the owner''s approval of 2026-11-25, this
  Store''s first publication is a forced release from source at opengwasdb 0.20.0 (c8ebe4ca), as a
  Hybrid Observed-Only Store. It ran as two invocations, because the hm3 subset refused the first
  time (above): the build ran from 2026-11-25 17:03:53 to 18:44:35 UTC (6,041.5 s) in the forced
  release that exited 1 at the subset Step, and its staged Store was kept; the second run, `pixi run
  -e workflow release OGS-00033` without force, resumed at indexed-subset-hm3 and ran 19:07:10 to
  19:15:49 UTC (whole invocation 19:06:57 to 19:15:53 UTC, exit 0, 8 min 56 s wall, peak RSS 6.2 GB,
  load 137 to 21), exit 0. Step timings: build 6,041.5 s; indexed-subset-hm3 121.6 s; overview 1.2
  s; validate 382.5 s; build_elapsed_s in the Validation Record, 6,546.8 s, sums the four Steps and
  counts the build once. It holds 34,465,821 shared variants (20,600,947 on the Dense panel,
  13,864,874 off-panel) and 340,067,052 Ragged Overflow associations, 20.0 GB. Admission:
  3,446,034,568 source rows examined, 2,841,753,851 admitted; dropped 601,730,776 below the MAF
  floor, 791,583 unharmonised GWAS-SSF indels (indel_ssf_hm_columns), 586,186 collapsed and 76,084
  conflicting duplicates, 735,877 with no MAF, 360,151 below the info threshold, 58 indels by
  hm_code and 2 with unusable SE. hm3 subset: requested 1,206,903, resolved 1,185,327, absent 2,798,
  overflow-only skipped 18,778. Under on-rsid-conflict drop the build blanked 93 stored variants
  whose admitted rows name them differently (rsid_conflicts: 93 keys, 93 variants); 93 keys blanked.
  The 93 variants are stored with no rsID and found by ALID and by position. The owner accepted the
  build as built on 2026-11-25: names only, no statistic affected. A scan of the sources that reads
  their CRLF headers finds 97 disputed keys: the build''s 93 blanked variants and 4 it named, names
  only. validate reports no errors and one warning (the Analyses were resolved with opengwasdb
  0.3.3), status passed_with_warnings; `audit-store reconcile` exits 0 with no errors. Nothing was
  replaced: there was no earlier Store to archive. The Release Status was accepted when `register`
  finished and is moved to built, then validated, by hand on 2026-11-25, on the owner''s ruling
  recorded on #520 (the lifecycle graph passes through built).

