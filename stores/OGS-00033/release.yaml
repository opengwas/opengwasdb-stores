description: 'Every ready Analysis in the hybrid__African candidate pool of the EBI GWAS Catalog harmonised
  GWAS-SSF Source Collection, resolved through AF-based ancestry assignment and phenotype-SD effect-scale
  estimation. Mixed study designs: quantitative Analyses carry an empirically estimated phenotype SD,
  and case-control Analyses are stored on the log-OR scale with SD estimation explicitly skipped rather
  than defaulted.

  '
notes: 'The candidate pool is 550 Analyses across 96 publications. EBI publishes a harmonised file for
  360 of them; none of the other 190 has a GRCh38 raw file (50 are GRCh37, 140 publish no raw metadata
  sidecar), so this hg38 Hybrid Store takes harmonised files only, as OGS-00011 does. Only the subset
  the frozen Source Inventory records as ready becomes release membership.


  Candidate status: human review required before acceptance (issue #153). 194 included, 164 excluded of
  550 frozen inventory rows.


