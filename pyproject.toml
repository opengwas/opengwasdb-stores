# Package metadata so this repository's Python code installs editable into the
# pixi environments, and imports without sys.path insertions (#257).
#
# Pixi owns the environments and every dependency (pixi.toml); this file only
# says what to install. Its `dependencies` stay empty so pip never resolves a
# second copy of what conda already provides.

[build-system]
# `setuptools-scm` reads the version from the `v*` tag (#386). pip fetches it
# into its isolated build environment, so it is a build requirement rather than
# a pixi dependency; the `dev` environment also carries it for the test that
# reads the version a build would produce.
requires = ["setuptools>=64", "setuptools-scm>=8,<9"]
build-backend = "setuptools.build_meta"

[project]
name = "ogstores"
# No `version` here: every merge to `main` is tagged `vX.Y.Z` by
# `.github/workflows/release.yml`, and the tag is the version (see
# `[tool.setuptools_scm]` below and CONTRIBUTING "Branches and releases"). A
# literal would shadow the tag, and then a release would not be a version.
dynamic = ["version"]
description = "OpenGWASDB Store Registry tooling: the Release Bundle contract, Store Release Build, and Manifest Generation"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools_scm]
# The version comes from the tag, exactly as opengwasdb's does (opengwasdb
# #333, stores #386), so both repositories release the same way. `tag_regex`
# admits one tag convention; `fallback_version` is what a build with no git
# metadata reports -- valid PEP 440, below every release, and obviously not one.
# Nothing writes a version file into the tree: a generated file under `src/`
# would make CI's "regenerate and require a clean tree" gate fail.
tag_regex = "^v(?P<version>.*)$"
fallback_version = "0.0.0+unknown"

[tool.setuptools]
# All importable Python lives under src/ (ADR 0038, #317): Store Release Build
# (`ogstores`) and Manifest Generation (`manifest_generation`, #249), which meet
# only at the Release Bundle (ADR 0035), the trait-mapping curation tooling
# (`curation`), and the Analysis Catalog (`analysis_catalog`, #323, ADR 0039),
# which reads Release Bundles only through that contract and which nothing
# imports, so it can move to the API's repository. tests/packaging/test_layout.py
# keeps it all there.
#
# `manifest_generation` installs editable only: it resolves its inputs and the
# registry against the checkout it lives in, and refuses to import from
# anywhere else. The shell scripts in its provider directories run
# `python3 -m manifest_generation...` and so rely on that editable install.
# tests/packaging/test_packages.py keeps this list equal to the package's
# directories.
package-dir = { "ogstores" = "src/ogstores", "manifest_generation" = "src/manifest_generation", "analysis_catalog" = "src/analysis_catalog", "curation" = "src/curation", "project_site" = "src/project_site", "project_site.collect" = "src/project_site/collect", "yardstick" = "src/yardstick" }
packages = [
    "ogstores",
    "manifest_generation",
    "manifest_generation.providers",
    "manifest_generation.providers.dbgap",
    "manifest_generation.providers.dbgap.mvp",
    "manifest_generation.providers.eqtlgen",
    "manifest_generation.providers.finngen",
    "manifest_generation.providers.gwas_catalog",
    "manifest_generation.providers.opengwas",
    "manifest_generation.providers.ukb_b",
    "analysis_catalog",
    "curation",
    "project_site",
    "project_site.collect",
    "yardstick",
]
