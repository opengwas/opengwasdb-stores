notes: |
  Quantitative endpoints are ordered by phenocode. For each binary category, the endpoint with the largest case count wins (phenocode breaks ties); the 17 category winners with the largest case counts are retained (category and phenocode break ties). The frozen provider manifest checksum makes the resulting 20-Analysis order reproducible.

  Status is `built`, not `validated`: the 20-Analysis Store built and passed OpenGWASDB validation and binary/quantitative read-back probes, but effect-scale validation genuinely failed for finngen-r13-HEIGHT_IRN (implied phenotype SD 0.665 despite declared-standardised provenance). The pilot assessment therefore recommends NO-GO for the complete R13 collection until that discrepancy is resolved; the failure is deliberately retained rather than silently rescaling the endpoint.
