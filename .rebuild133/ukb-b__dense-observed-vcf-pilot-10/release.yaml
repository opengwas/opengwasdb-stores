  Selected via --only-analysis-id: 7 deterministically chosen buildable IDs plus the 3 IDs already used as this generator's own README smoke-test example (ukb-b-10787, ukb-b-11842, ukb-b-19953), so their source VCFs were already available locally.

  Status is `built`, not `validated`: the store built successfully and reads back correctly (see sidecars/build_report.tsv), but validation.yaml's effect_scale/sd_estimation checks genuinely failed for several analyses (implied phenotype SD far from 1 despite original_sd_method=declared_standardised) -- likely because several of these UKB-b fields (procedure codes, symptom checklists) aren't truly continuous SD-standardised traits. That is a real finding about this batch's declared metadata, not a pipeline defect, and is deliberately left failing rather than silently accepted.
