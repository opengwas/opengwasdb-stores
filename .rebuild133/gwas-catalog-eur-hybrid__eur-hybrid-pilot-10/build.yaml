store_family_id: gwas-catalog-eur-hybrid
family_release_id: eur-hybrid-pilot-10
store_layout: hybrid-observed
completion_state: observed-only
builder:
  package: opengwasdb
  entrypoint: opengwasdb.layouts.hybrid.build:build_hybrid_from_vcf_manifest
source:
  source_format: gwas-ssf
  source_reader_capability: opengwasdb.gwas-ssf
  source_genome_build: GRCh38
normalisation:
  target_reference_assembly: GRCh38
  liftover: ~
  source_assembly: hg38
effects:
  stored_effect_scale: log_or
shape:
  association_coverage: full_gwas
reference_resources:
- resource_id: hybrid-ieua-dense-panel
  kind: hybrid_dense_panel
  genome_build: GRCh38
  variant_id_convention: chr:pos:A1:A2 (A1 = min(allele1, allele2))
  location: /data/opengwasdb/wip/hybrid-ieua/panel_alids.txt
  location_kind: external_file
validation:
  required: yes
artifacts:
  artifact_root: /data/opengwasdb
  release_subdir: gwas-catalog-eur-hybrid/releases/eur-hybrid-pilot-10
  download_dir: /data/opengwasdb/gwas-catalog-eur-hybrid/releases/eur-hybrid-pilot-10/download
  store_uri: /data/opengwasdb/gwas-catalog-eur-hybrid/releases/eur-hybrid-pilot-10/store/hybrid__European__pilot10-cc
  build_log_uri: ~
