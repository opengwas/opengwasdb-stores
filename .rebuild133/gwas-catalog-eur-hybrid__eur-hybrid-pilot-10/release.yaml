notes: |
  Deliberately restricted to case-control Analyses (stored_effect_scale= log_or, original_sd_method=binary_trait): this multi-publication pool has no single-family curated effect-scale method the way a single-paper Store Family does, so a quantitative Analysis's original_sd_method would need real reference-AF phenotype-SD estimation (issue #16's engine) to be honestly populated rather than assumed. Deferred to a follow-up release (opengwasdb-stores#70) rather than fabricated here. This pilot proves the Hybrid layout and the GWAS-SSF Source Reader Capability end-to-end; it does not yet prove quantitative-trait effect-scale coverage for this pool.

  Status is `built`, not `validated`: the store built successfully (10 Analyses, 20,531,956 shared variants -- 9,847,807 on-panel + 10,684,149 off-panel -- and 27,810,834 Ragged Overflow associations, confirming both Hybrid components were genuinely exercised) and reads back correctly, but validation.yaml correctly reports passed_with_warnings. Confirmed directly against this build: opengwasdb.layouts.dense.build_vcf._manifest_row_to_analysis (shared by the Dense and Hybrid builders) drops n_cases/n_controls/sample_size_kind/sample_size_scope/original_effect_scale from the built store despite the manifest supplying real values, and fabricates ancestry_assignment_method=af_assigned regardless of the manifest's actual (here: source_trusted_no_af) value. Filed as explodecomputer/opengwasdb#86. These are real upstream gaps, not defects in this release; left failing rather than silently accepted.
