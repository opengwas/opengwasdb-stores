# Per-Store anchors for the seven generic query shapes (stores#212, epic#214).
#
# The release benchmark report measures the HM3 Indexed Variant Subset for every
# registered Store via opengwasdb's shared
# `benchmarks._query_shapes.measure_hm3_extract`. It additionally surfaces the
# seven generic query shapes (from `benchmarks/benchmark_store_comparison.py`)
# for a Store only when an anchor is configured here; otherwise the report marks
# the shapes `not_configured` and continues, because the shapes need a
# Store-specific Analysis and window that the shared defaults
# (`ukb-b-17805`, chr19) cannot supply for every release.
#
# `exposure` is the Analysis id the shapes are anchored on. The other two keys
# are optional: the harness derives the PheWAS variant from the exposure's
# strongest genome-wide top hit when `phewas_alid` is absent, and defaults the
# regional window to the harness default when `region` is absent. A Store in
# this file whose artifact is not queryable (no variant index yet) records a
# non-failing `not_queryable` operational status rather than a measurement.
#
# The default exposure is the first analysis_id in the bundle's analyses.tsv,
# matching the report's HM3 anchor. Change one only with a measurement reason.

stores:
  OGS-00001:
    exposure: ENSG00000175445::whole_blood
  OGS-00003:
    exposure: finngen-r13-BMI_IRN
  OGS-00004:
    # anchor GCST003566 is excluded from the build (EAF flipped, excluded_2026-08-22);
    # the first built Analysis with a 5e-08 hit is GCST005076 (1880 hits, checked in
    # its Store's top_hits/p_5e_08 while the 0.1.0 Store awaited its rebuild, #414)
    exposure: GCST005076
  OGS-00005:
    exposure: GCST002047
  OGS-00006:
    # first row; it holds 5 significant regions, so the harness derives the PheWAS variant from them
    exposure: GCST90199621
  OGS-00007:
    exposure: GCST005806
  OGS-00008:
    exposure: ukb-b-19953
  OGS-00009:
    # anchor ukb-b-13414 has no genome-wide hit; the harness derives the PheWAS variant from one
    exposure: ukb-b-10003
  OGS-00011:
    # anchor GCST000028 is absent from the Store; the first Analysis in its own
    # analyses.tsv order with a hit in top_hits/p_5e_08 is GCST000998 (584 hits, #414)
    exposure: GCST000998
  OGS-00012:
    exposure: GCST90475091
  OGS-00013:
    exposure: GCST90475090
  OGS-00014:
    exposure: GCST90475089
  OGS-00015:
    # first row GCST90476550 has no genome-wide hit; the harness derives the PheWAS variant from one
    exposure: GCST90476556
  OGS-00016:
    exposure: GCST90479500
  OGS-00017:
    # first row finngen-r13-AB1_ACTINOMYCOSIS has no genome-wide hit; the harness derives the PheWAS variant from one
    exposure: finngen-r13-AB1_ARTHROPOD_WIDE
  OGS-00032:
    # first row GCST001404 has no genome-wide hit in the completed Store (n_hits_5e8 0); GCST90278664
    # (Chen 2023 height) has 105,506 hits at 5e-8, from which the harness derives the PheWAS variant
    exposure: GCST90278664
