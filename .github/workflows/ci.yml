name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The suites that build Stores through the whole release stack each get a
  # runner of their own, in parallel with everything else, and run one test
  # per core there. They are most of the suite's CPU time, so one runner would
  # take several times as long. The list lives in run_all_tests.py, so a new
  # such suite cannot be left out of CI.
  plan:
    name: list the release-stack suites
    runs-on: ubuntu-latest
    outputs:
      release_stack: ${{ steps.list.outputs.release_stack }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "release_stack=$(python3 tests/run_all_tests.py --list-release-stack)" >> "$GITHUB_OUTPUT"

  test:
    name: pixi test + docs smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The package's version comes from the `v*` tag (#386), so the
          # editable install setup-pixi builds below needs the whole history
          # and the tags: a shallow, tagless clone would report `0.1.dev1+…`
          # and the tag would never be seen.
          fetch-depth: 0
          fetch-tags: true

      # Installs strictly from the committed pixi.lock; fails instead of
      # silently re-solving if pixi.toml and pixi.lock have drifted apart
      # (issue #41 acceptance criterion: "CI installs from the committed
      # lock without implicit dependency updates").
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: dev
          locked: true

      - name: Report resolved tool/package versions
        run: pixi run --environment dev env-check

      # The version is built from the tag, and only a real install shows it: a
      # checkout without git metadata reports the `0.0.0+unknown` fallback, and
      # a tagless one builds a development version. The suite cannot assert this,
      # because its answer depends on whether the *environment* was rebuilt since
      # the last commit -- `pixi install` does not refresh an editable install's
      # metadata -- so it is checked here, where pixi has just built the package
      # from this checkout and `fetch-depth: 0` has brought the tags.
      - name: The installed version comes from the tags
        run: |
          pixi run --environment dev python - <<'PY'
          import subprocess
          import sys
          from importlib.metadata import version

          from packaging.version import Version

          reported = Version(version("ogstores"))
          tags = subprocess.run(
              ["git", "tag", "--list", "v*"], capture_output=True, text=True, check=True
          ).stdout.split()
          if not tags:
              # Until the cutover no `v*` tag exists, so a development version is
              # the right answer -- and it must say so, not look like a release.
              if not reported.is_devrelease:
                  sys.exit(f"no v* tag exists, so the installed {reported} cannot be a release")
              print(f"installed version {reported}; there is no v* tag yet")
          else:
              newest = max(tags, key=lambda tag: Version(tag[1:]))
              if reported < Version(newest[1:]):
                  sys.exit(
                      f"the installed version {reported} is older than the newest tag "
                      f"{newest}; the environment was not built from this checkout"
                  )
              print(f"installed version {reported}, newest tag {newest}")
          PY

      - name: Run the lightweight test suites, except the release-stack ones
        run: pixi run --environment dev test --skip-release-stack

      - name: Check every Release Bundle
        run: pixi run --environment dev bundle-check

      - name: Regenerate master list and Release Bundle summaries
        run: pixi run --environment dev index-ci

      - name: Require a clean tree after regeneration
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git status --short
            git diff
            exit 1
          fi

      - name: Documentation smoke test
        run: pixi run --environment dev docs-smoke

      - name: Analysis Catalog summary smoke test
        run: pixi run --environment dev catalog-summary-smoke

  release-stack:
    name: ${{ matrix.suite }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.plan.outputs.release_stack) }}
    steps:
      # Full history: the workflow suite builds a Store with the workflow as it
      # was at an earlier revision, and a shallow clone lacks it (#305). The
      # tags are the package version (#386).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          environments: dev
          locked: true

      - name: Run ${{ matrix.suite }}
        run: pixi run --environment dev test --suite "${{ matrix.suite }}"

  changelog:
    name: changelog fragment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs against the merge base, which needs real history.
          fetch-depth: 0

      # The labels reach the check as `--labels`, so the `no-changelog`
      # exemption is decided and tested in tools/check_changelog.py rather than
      # by skipping the job: a skipped job cannot report why (#386).
      - name: A fragment added alongside source changes
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"
          python3 tools/check_changelog.py \
            --base-ref "origin/${{ github.event.pull_request.base.ref }}" \
            --labels "$LABELS"
