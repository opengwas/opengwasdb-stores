store_family_id: fixture-effect-scale
family_release_id: fixture-release
source_collection_id: fixture
release_kind: one-off
association_coverage: unknown
description: Fixture release for the reference-AF effect-scale validation engine.

defaults:
  source_genome_build: GRCh38
  stored_effect_scale: sd

output:
  store_id: OGS-99051
  data_dir: tests/effect-scale-validation/fixtures/release

reference_resources:
  - resource_id: fixture-eur-af
    kind: reference_af
    ancestry: European
    genome_build: GRCh38
    variant_id_convention: "chr:pos_ref_alt"
    allele_columns:
      effect: EA
      other: OA
      freq: EAF
    root: tests/effect-scale-validation/fixtures/reference-af
    ancestry_dir: EUR
    location_kind: external_directory

effect_scale_validation:
  enabled: true
  maf_min: 0.01
  maf_max: 0.5
  min_overlap_variants: 5
  sd_tolerance: 0.15
  warning_multiplier: 2.0
  dispersion_max: 0.5
  beta_distribution_fallback:
    enabled: true
    sample_kind: random_common_variants
  reference_resources:
    - ancestry: European
      resource_id: fixture-eur-af
