store_family_id: fixture-qc-panel
family_release_id: fixture-release-with-panel
store_key: ragged__pmid-99999999__European
source_collection_id: fixture
release_kind: one-off
association_coverage: signals_only
description: Fixture release proving unconditional QC-panel retention (issue #28/#30).
notes: Zero significant/suggestive hits; only filter.qc_panel should retain anything.

source:
  source_snapshot_id: fixture
  ftp_base: "REPLACED_AT_RUNTIME"

inputs:
  candidates: tests/qc-panel-retention/fixtures/candidates.tsv

selection:
  pubmed_id: 99999999
  store_key: ragged__pmid-99999999__European
  ancestry_group: European
  n_analyses: 1

defaults:
  source_genome_build: GRCh38
  license: test-fixture
  original_effect_scale: sd
  original_sd_method: declared_standardised
  stored_effect_scale: sd
  sample_size_scope: analysis_level
  ancestry_assignment_method: source_trusted_no_af
  analysis_group_id: FIXTURE99999999
  inclusion_reason: qc_panel_retention_fixture

reference_resources:
  - resource_id: qc-panel-fixture
    kind: qc_panel
    genome_build: GRCh38
    variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
    root: tests/qc-panel-retention/fixtures/qc_panel.tsv
    location_kind: tracked_file

filter:
  region_policy_id: sig-trans-1mb_suggestive-leads
  trans_flank_bp: 1000000
  significant_p: 5.0e-8
  suggestive_p: 1.0e-5
  suggestive_lead_min_distance_bp: 100000
  download_timeout_seconds: 60
  qc_panel:
    enabled: true
    resource_id: qc-panel-fixture

output:
  store_id: OGS-99031
  data_dir: tests/qc-panel-retention/fixtures/output-with-panel
