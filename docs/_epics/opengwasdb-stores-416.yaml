summary: "Epic #416 put a living architecture map of OpenGWASDB on the project site. Each repository claims its own code in `docs/architecture/components.yaml`, and CI fails on an unclaimed file, on a new upward engine import (23 listed) or on a new import of engine names here (91 listed). The site draws Pipeline, Structure and health, and Work map pages from both repositories' claims, their code, the board and pushed branches, and a `check` / `conflicts` CLI gives agents the same answers. Orchestrate now stops before launching a lane whose files meet another owner's uncoordinated work, and a structural ticket's `architecture` block is drawn on the map and checked once its code lands."
