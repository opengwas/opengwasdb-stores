decisions:
- date: 2026-10-21
  text: check-observed-view exits 0 pass / 1 mismatch (verdict written) / 2 refused (no verdict); --seed
    required; exact ALID map (no |S32-only mapping); band height derived from the child; chrom-edge stratum
    = every contig; no source_release_id provenance check (YAGNI)
  link: null
- date: 2026-10-21
  text: No --store-id on complete (pinned complete-dense lacks it; manifest inherits store_id = id); role-aware
    staging rewrite (destination only); build phase byte-identical incl. records/register.json and Snakefile
    rule bodies; archive stamp unique per replacement, snapshot-free
  link: null
- date: 2026-10-21
  text: 'Inserted-row gap closed: child axis partitioned into chunk-row spans so a whole-grid sample sees
    every child row; benchmark re-recorded with every parent-cell count equal to the prototype''s and
    span-count differences explained (correctness over exact reproduction of the prototype''s blind spot)'
  link: null
- date: 2026-10-21
  text: Completion preservation asserted exactly (child observed == parent decoded, by ALID); one lazily
    built template per fixture shape; complete_publication skips identical rewrites (copied-root rerun
    = 0 jobs)
  link: null
- date: 2026-10-21
  text: 'Generator mints no completed ids (OGS-00018-21 retired unused); qualified reference -> one single-id
    bundle; pending reference -> observed bundle unchanged + completion plan keyed to observed id (completion
    later via the #305 amendment)'
  link: null
- date: 2026-10-21
  text: Base-code pins are generated once and committed as goldens, never run via git archive at test
    time (CI checkouts are depth 1)
  link: null
- date: 2026-10-21
  text: 'check_argv_drift made role-aware in #304 (reproduced pass on a wrongly staged published-Store
    arg); build_elapsed_s sums both phases (documented meaning kept); interrupted-completion resume stays
    #305''s, and #304''s docs don''t claim it'
  link: null
- date: 2026-10-21
  text: 'Check step completion-observed-view-check with fixed seed 20261021, --n-random 1000; verdict
    in the step record (stdout); develop on #291''s head 023774a, re-pin to the opengwasdb dev merge commit
    before merging'
  link: null
- date: 2026-10-21
  text: Published Observed-Only Store is read from records (build register present, completion register
    absent), never the Store; interrupted complete resumes via complete-dense-resume with a build_params
    drift check; pre-#304 test runs ff204b6's workflow (reachable from dev forever), CI fetch-depth 0
