summary: 'Epic #302 made reference completion replace its Store under the same id (ADR 0037), so one Store
  Release is built Observed-Only and then completed in place instead of becoming two ids. It added single-id
  Dense completion in one run, completion of an already-published Observed-Only Store later, an observed-view
  check that gates the swap, and deletion of the replaced Store at the swap. The master list reports the
  Store actually published, and Manifest Generation emits single-id completed bundles. It merged as PR
  #311 on 21 October.'
