  link: null
- date: 2026-10-21
  text: A failed check's verdict stays in <id>/work/ and the error names it (Snakemake deletes failed
    outputs; fixed seed makes it reproducible); the passing record is the swap evidence. The dedicated
    capability guard is kept so a single-id plan is refused before the build phase starts
  link: null
- date: 2026-10-21
  text: 'Merged with the temporary pin 023774a (#291 head) so #309 can start; re-pin to the opengwasdb
    dev merge commit is a tracked item before PR #311 goes ready'
  link: null
- date: 2026-10-21
