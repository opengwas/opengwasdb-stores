decisions:
- date: "2026-11-07"
  text: "Owner: run #307 starting with #381. #316 keys follow #381's ALID (its body and 4 Nov comment), so #381 blocks #316 and, through it, #317-#319."
  link: null
- date: "2026-11-07"
  text: "#381 is tracked as `381-build` so the run never closes it: milestone #388 says each 'builds that are right' issue stays open for its published Releases' repair under #367, and #381's own last box (a migrate-or-rebuild plan) was deferred to #367 by the owner on 4 Nov."
  link: null
- date: "2026-11-07"
  text: "format_version steps to 0.2.1 with #381; #338 takes 0.2.2 if it lands after. After an hg19 lift, 'ref' is GRCh38's reference allele; equal-length multi-base substitutions stay sorted like SNPs."
  link: null
- date: "2026-11-07"
  text: "Preflight STOP on #381, #308, #309, #312: launch anyway. Only #381 meets PR #389 (#301) at file level (spec and compatibility page, different sections), resolved at merge keeping both; the other meets are component-level (#338's frozen reference branch, #363 without a branch)."
  link: null
- date: "2026-11-07"
  text: "#387 before #314: both edit indexed_subsets.py's `_compare_indexed_band` and `_DecodeContext`. #308 first too (it times the scans #314 restructures)."
  link: null
- date: "2026-11-07"
  text: "Lanes run real-data timings under a shared flock ($RD/timing.lock) and record uptime; the Veeam backup no longer touches /data/opengwasdb (since 2 Nov), so there is no time-of-day window."
  link: null
- date: "2026-11-07"
  text: "Owner (via the /board sync session): add the code fixes for #355, #361 and #376 to this run as 355-build, 361-build and 376-build, tracked like 381-build so the run never closes the #367 issues. They are milestone #388 lines, and #307 already edits their components (#361: completion, beside #309/#321; #355: Dense encoding, beside #320; #376: the lift and Pass 2, beside #316-#319), so a second run beside this one would conflict. Edges are set conservatively on 381-build (each is a format or ALID-path change after it); the orchestrator refines them when 381-build merges."
  link: null
- date: "2026-11-07"
  text: "#312's lane found build-dense-top-hits writes a Zarr v3 zarr.json into a 0.1.0 (v2) release and leaves it unreadable. Small and in #313's command: fold it into #313 (refuse a release whose format isn't writable) rather than file a ticket."
  link: null
- date: "2026-11-07"
  text: "Standing rule: a preflight STOP whose only meet is #338's frozen reference branch (orch/347/338) launches, recorded on the ticket and the dashboard. Any other meet comes to the owner."
  link: null
- date: "2026-11-07"
  text: "#314's 'three passes become one' reads 'two become one': Top-Hit Index verification already shares the association scan (ADR 0074), as #308's spec review found. Commented on #314."
  link: null
- date: "2026-11-07"
  text: "The 'outside the backup window' criterion no longer binds: the nightly backup has skipped /data/opengwasdb since 2 Nov. OGS-00009's validation started at 10:45 (load 132) is kept as attribution; #314 measures its own before/after under the timing lock."
  link: null
- date: "2026-11-07"
  text: "Code merged, ticket kept open (waiting-external) for the full-size comparison its criteria require; stores#357 stays blocked until then. Column bands (>1,024 Analyses) are covered only by that comparison: a fixture reaching them costs ~150 s per run."
  link: null
- date: "2026-11-07"
  text: "Baselines are the harness's own step and phase timings for OGS-00009, one full-size FinnGen and one full-size GWAS-SSF Store, not reused validation verdicts (a 23 Oct verdict predates OGS-00009's 25 Oct re-encode). One command writes one artifact. The nightly backup window is applied to every night the records span, up to 2 Nov."
  link: null
- date: "2026-11-07"
  text: "GWAS-SSF newer layout: other_allele is the reference for hm_code 10 and 11 (pooled 97.4-99.6%; residual per-file error accepted). Older layout: all indels dropped (code-11 deletions 87.42%). Rescued swap_alleles copies read effect_allele, from a declared signal only."
  link: null
- date: "2026-11-07"
  text: "LD-panel indels: AMR's REF column; other panels take REF from GRCh38 evidence (HGDP pvars, FinnGen ref) at one-way keys, via a per-panel table beside the panel; both-ways, disagreeing and unmatched keys dropped and counted."
  link: null
- date: "2026-11-07"
  text: "Completing a 0.2.0 source is refused (spec 21.4); the pilot's SE requantisation (<=1 int8_residual step, coefficient refit) accepted; converter writes 0.2.0; the reversed-indel machinery is removed under #316."
  link: null
- date: "2026-11-07"
  text: "No extra band slice: OGS-00009's complete.json stderr gives the full-run figures to check the slice's scaling. The global active timer goes; #321 is blocked on #309, so _stream_completed_arrays takes two explicit phase blocks. EAF/SE band-write speed-ups go to #321, not new tickets."
  link: null
- date: "2026-11-07"
  text: "The 32-worker OOM is fixed in #313: the standalone top-hits scan sizes its row band from validation's one-GiB decoded working-set budget (one helper), keeping the narrow-store row cap. Host-memory rule added to _finish.md for every lane."
  link: null
- date: "2026-11-07"
  text: "Accepted: a rule whose body returns Skip keeps its start line, closed by its skip line (no elapsed line, no row); log_progress_unknown as new timing API for a pass whose count failed."
  link: null
- date: "2026-11-07"
  text: "EAF survey attributed from records: Sept 1h55m was the serial survey (f8125322, before #219), Oct 3h32m lay wholly in the backup window; today's parallel phase ~2.5 min for 2,514 Analyses. No full-size run now (#322 measures it); the dict-to-index fix (<=33 s) is below the filing bar. #310 may edit hybrid/build.py's _verify_eaf_orientation."
  link: null
- date: "2026-11-07"
  text: "A GWAS-SSF file with no hm_ column is unharmonised and its indels are dropped (indel_ssf_unharmonised), per the owner's 4 Nov rule; a mixed header is refused."
  link: null
- date: "2026-11-07"
  text: "Rescued swap_alleles copies: opengwasdb-stores' rescue rewrites statistics (negate beta, invert OR and CIs, complement EAF) instead of exchanging allele labels, and regenerates the 58 copies; other_allele stays the reference; the engine needs no signal."
  link: null
- date: "2026-11-07"
  text: "Before/after band-write time on OGS-00009 is measured with #309's band-slice profiler (scaling matched the record to 2%); the full 14 h completion is #322's end-to-end rebuild."
  link: null
- date: "2026-11-07"
  text: "Escalated #311 to Claude Sonnet after three review rounds each found new silent defaults. A/B verdicts use a paired sign/Wilcoxon test with >=6 alternating rounds (p<0.05), not a min/max rule."
  link: null
- date: "2026-11-07"
  text: "#321 waits for #424: Ragged completion first gets Dense completion's functionality (shared fill shards, one CSR writer), then the band write's parallelisation is built on the shared implementation."
  link: null
- date: "2026-11-07"
  text: "Nightly window assumed from 14 Oct (first night of the October records), stated in the artifact's basis. No fourth review: round-3 fixes each carry a failing-first test; orchestrator verifies and merges."
  link: null
- date: "2026-11-07"
  text: "361-build waits for #424 like #321: #424 rewrites the Ragged checkpoint merge the fix would touch and may bump CHECKPOINT_FORMAT; widen ALID_DTYPE once on the shared code. 355-build needs no format bump (spec 6a already says exact), so #338 keeps 0.2.2."
  link: null
- date: "2026-11-08"
  text: "Standing rule extended: a preflight STOP whose only meets are this run's own lanes (split by function in their briefs) and #338 launches, recorded on the ticket and the dashboard. Meets with work outside this run still come to the owner."
  link: null
- date: "2026-11-08"
  text: "The residual EAF encode's pool is capped by memory in #320: effective workers = min(n_workers, quarter of MemAvailable // per-band bytes), bands stay shard-aligned, max_in_flight=effective; unreadable meminfo runs one worker and says so."
  link: null
- date: "2026-11-08"
  text: "A Store-level Validation Rule flags SE exception tables whose float16-exact share is far above chance: an error at format_version >= 0.2.1 (fixed builder), a warning for earlier Stores (published, owned by #367)."
  link: null
- date: "2026-11-08"
  text: "variant_table.lifted_contig is an error at format_version >= 0.2.1 and a warning for earlier (published) Stores, as with 355-build's float16-exact rule."
  link: null
- date: "2026-11-09"
  text: "Run paused for Claude usage. stores#455's replacement and the GCST90275159/60 question are deferred; status recorded on stores#455."
  link: null
- date: "2026-11-10"
  text: "Run resumed (/orchestrate 307). main (#415, #421) merged into integration as ff65955; a new mypy finding from 376-build fixed in 0055dd6."
  link: null
- date: "2026-11-10"
  text: "The float32 SE band buffer (about 49 GB in the parent on OGS-00009's shape, inside the host-memory rule) is left unblocked; row-blocking the SE pass isn't this ticket's."
  link: null
- date: "2026-11-10"
  text: "Closed #383 as not planned: four interleaved pairs on post-#316 Pass 2 show no consistent gain and 2-3 ms of GC per run."
  link: null
- date: "2026-11-10"
  text: "side_tables.eaf_exceptions' whole-table read (12.7 GiB on OGS-00011, the actual peak) is in #387's scope: check marked positions per band against the scan's span. The association scan's per-band consult stays (one contiguous span)."
  link: null
- date: "2026-11-10"
  text: "#317 merged as tests only: #316 already moved Hybrid routing to the shared RouteTable and the fold's off-reference keys are lossless. The remaining ~1 us per off-reference row (routing_key string then encode_keys parse) goes to #318's batch rework."
  link: null
- date: "2026-11-10"
  text: "Approved: replace the 56 regenerated rescued copies in /data/opengwasdb/derived/ebi-gwas-catalog via tools/replace_rescued_copies.sh; GCST90275159/60 (dummy effects) excluded from the rescue."
  link: null
- date: "2026-11-10"
  text: "Ran the owner-approved replacement: 56 copies + manifest, rc=0, live checksums 56/56; draft PR opengwasdb-stores#457 opened, merging after the run's final review per that repo's AGENTS.md."
  link: null
- date: "2026-11-10"
  text: "First-rsid stays out of the batch: Pass 2 names no rsid, Pass 1 applies _first_rsid; recorded in ADR 0076. Hybrid Pass 2 takes batches in #318 (#319's GWAS Catalog pilots are Hybrid). Columnar engine extracted by #319."
  link: null
- date: "2026-11-10"
  text: "Worker memory: the full GWAS Catalog Store is OGS-00011 (build-hybrid, 24 workers); +0.43 GiB per worker is about +10 GiB, within the quarter-of-available rule. No owner question needed."
  link: null
- date: "2026-11-10"
  text: "A declared imputation score is read in columns in #319, not a follow-up: 605 of OGS-00011's 3,169 Analyses declare one, which would halve Pass 2's gain there. Compound ids as rsids: Pass 1's rule, as #318's first-rsid ruling."
  link: null
- date: "2026-11-11"
  text: "encoding.eaf's whole EAF-table read is bounded in #387 (it is now validate's peak: 18.15 GiB on OGS-00011). 'Read once per pass' is restated as 'never read whole'; #314 merges the remaining streamed reads (scan consult, _Spans, encoding.eaf, subsets.indexed) into its one pass."
  link: null
- date: "2026-11-11"
  text: "Main (#424 and #430, which merged during the preflight question) merged into the integration branch once, by a merger lane on Opus; completion identity pins re-pinned only where an intended integration change explains the difference."
  link: null
- date: "2026-11-11"
  text: "Keep 2986ba7 (per-process indel-table handle, a #381 defect) in the main merge: #321 and 361-build hit it next. completion_n_missing_total keeps counting in-region panel indels without an ALID as missing (the older rule); changing it would move Dense quality counts."
  link: null
- date: "2026-11-11"
  text: "completion_quality counts only rows the Store holds (ADR 0039 over ADR 0079 s6): unnamed in-region panel indels are not missing; they stay in the manifest's panel_indels placement record. New 0.2.1 Stores only."
  link: null
- date: "2026-11-11"
  text: "Main's #432 (ea81c4a) folded into the same merger lane as a second merge commit, reviewed once with the rest."
  link: null
- date: "2026-11-11"
  text: "format_version: main's v0.9.0 (#432) defines 0.2.1 as a Ragged release with regions.tsv; #381's reference-first indels move to 0.2.2 and every rule gated at 0.2.1 re-gates at 0.2.2. Epic #347's #338 must then take 0.2.3, not 0.2.2."
  link: null
- date: "2026-11-11"
  text: "A disordered, duplicated or unpaired EAF exception table is reported as findings rather than aborting validate (new wording); kept, and disclosed in the changelog and ADR 0074."
  link: null
- date: "2026-11-12"
  text: "CURRENT_FORMAT_VERSION is 0.2.2 on the integration branch (every builder and completion write 0.2.2; the converter writes 0.2.0). opengwasdb-stores accepts 0.2.2 in the pin-move PR at the run's finish."
  link: null
- date: "2026-11-12"
  text: "A release stamped newer than this build writes gets an upgrade warning from manifest.format_stamp (not a Skip), so the text report shows it."
  link: null
- date: "2026-11-12"
  text: "wip/430-infer treated as superseded by #432 (owner). #321 and 361-build run side by side; 361-build merges first; #321 merges the tip before touching _resolved_fills."
  link: null
- date: "2026-11-12"
  text: "A 64-byte ALID equal to a longer ALID's first 64 bytes was mis-routed at base by the same S64 collision; head corrects it. Kept as part of the fix, disclosed and tested. Representation stays two arrays (integer keys not tried). Pilot re-run against the HGDP EUR panel, since UKB's has no ALID over 58 bytes."
  link: null
- date: "2026-11-12"
  text: "Indexed Variant Subsets keep full coverage through a per-unit 64-bit digest keyed per run; no sampling, no exact index hold. The guarantee is stated as probabilistic (one-value change always found; multi-cell miss ~2^-64 per unit), and the cell-by-cell fallback count is logged. The OGS-00009 timing pair's backup-window load is waived (side by side; #322 re-measures)."
  link: null
- date: "2026-11-12"
  text: "ADR 0080 superseding part of ADR 0023 is within #321's criteria (no separate owner question; the PR shows it). The band memory budget (4 GiB + 24 B/cell) stays until #322 measures full size."
  link: null
- date: "2026-11-12"
  text: "The pool keeps counting the parent at its resident set (a deliberate margin: 13 band workers where 14 fit). Write scaling beyond 4 workers is measured by #322's full-size rebuild. #200's 93.3 -> 93.5 B/imputed cell is #361's checkpoint change; the 16 B target is #200's open work."
  link: null
- date: "2026-11-12"
  text: "No scheduled OGS-00009 build exists, so #322 rebuilds it into scratch at the integration tip after #315 merges, running the engine steps as the planner will after stores-357/358, with one standalone Top-Hit step timed apart as #312's full-size proof. stores-357 merges after that proof. Breaks the 322 <- stores-357 <- 312 <- full-size build loop."
  link: null
- date: "2026-11-12"
  text: "Validation's per-worker allowance raised from 512 MiB to 1 GiB (OGS-00011's workers reached 1.81 GiB PSS against a 0.85 GiB band budget); kept until #322 re-measures. Spreading subsets.indexed's digests across workers (now ~73% of OGS-00009's 893 s) is left as a remaining lever, not widened into #315."
  link: null
- date: "2026-11-12"
  text: "Workers reopen every array they read after the fork (the issue's wording), with max_workers=1 still the hang guard. The per-worker bound is met by sizing bands from the Store's measured decoded bytes per cell, with a margin, not by raising the floor to fit OGS-00011's overrun."
  link: null
- date: "2026-11-13"
  text: "Keep #254's 96 B/cell band sizing (a 1.7x margin over the measured 54.7-56.2 B/cell): the overrun was Block.locate's tier copy, fixed, not exception density."
  link: null
- date: "2026-11-13"
  text: "A validation worker's memory budget is measured as its private memory (PSS beside it); VmHWM counts pages shared with the driver after the fork."
  link: null
- date: "2026-11-13"
  text: "OGS-00009 rebuilt once, at the integration tip; the before side is #311's baseline from the published records. No single-worker re-validations. The standalone Top-Hit comparison for #312 stays."
  link: null
- date: "2026-11-13"
  text: "No new top_hits value: post stays boolean; a Dense build step meets top_hits; an amendment with no build step plans the standalone build-dense-top-hits. The stores LD-panel tooling follows ADR 0079 s6 (an unreferenced panel indel has no ALID) in this lane."
  link: null
- date: "2026-11-13"
  text: "A top-hits amendment is a plan-level API (plan(bundle, build_runs=False)) with no workflow caller: a published release already refuses re-runs, so amendments were applied by hand before #357 too. No new operator command or ticket."
  link: null
- date: "2026-11-13"
  text: "stores#357's amendment criterion is met by documentation: a Top-Hit Index is added to an existing Dense Store by running opengwasdb build-dense-top-hits --n-workers N by hand (the workflow refuses re-runs over a published release); the plan-level amendment API is dropped."
  link: null
- date: "2026-11-13"
  text: "Final review findings go to one fix lane (Opus): pool rule, silent defaults, the forked-worker threadpoolctl abort, one format gate, dead code, docs, test cost, and a validate rule for #361's class (completion_quality agrees with the imputed plane). completion_quality also leaves out unnamed SNVs: consistent with the owner's 'only rows the Store holds' principle."
  link: null
- date: "2026-11-16"
  text: "Owner accepted proposed ADR 0081: build no compiled extension after epic #307; keep the Python implementation and reconsider only if later profiling after the columnar GWAS-VCF reader and column-major band-write work identifies a dominant non-vectorisable interpreted kernel."
  link: null
- date: "2026-11-16"
  text: "Owner chose the recommended completion-quality boundary: validate only cases the current persisted metadata can prove, skip ambiguous multi-block/overlap reconciliation, retain the independent ancestry and crossover corrections, and defer ownership/duplicate-outcome metadata."
  link: null
- date: "2026-11-16"
  text: "Owner chose a declared reference-first input marker and fail-closed handling: newly regenerated references carry the marker; an unmarked indel-bearing reference is refused; no content heuristic or automatic allele swap is allowed."
  link: null
- date: "2026-11-16"
  text: "Launch after preflight STOP: #338 is covered by the owner's standing launch rule, and wip/430-infer was explicitly marked superseded by merged #432. #422 is bit-identical work under #307 and is the remaining measured path toward the unwaived 9-hour criterion; #423 remains out of scope pending a new method spec and owner decision."
  link: null
- date: "2026-11-16"
  text: "Launch after the same preflight STOP already ruled for #422: #338 is covered by the owner's standing launch rule, and wip/430-infer is superseded by merged #432. #435 only forwards an existing runtime knob through Reference Completion and remains outside #423's value-changing fit method."
  link: null
- date: "2026-11-16"
  text: "Owner authorized a second scratch OGS-00009 whole-release build to establish the unwaived nine-hour criterion, overriding the earlier rebuild-once limit. Run the current integration tip (60b72172, including #422 and #435) with 32 workers, no registration or publication, and preserve the existing memory, disk, timing-lock and stop gates."
  link: null
- date: "2026-11-17"
  text: "Detached #423 from epic #307 at finish and left it open: its own accepted scope changes imputed values and requires a separately approved Reference Completion Method spec, while #307 permits only bit-identical completion speed-ups."
  link: null
