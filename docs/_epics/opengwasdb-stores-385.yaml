  text: "Yardstick rerun 11:04, load 1.5-1.9, no Veeam: spread <11% on 16/19 timed measures (worst OGS-00006 phewas rsid 25%, 4-9 ms); committed with #385 record yardstick.after in PR #395 (base dev; retarget to main if merged after cutover)."
