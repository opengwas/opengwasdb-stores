summary: "Epic #385 adds a project site that shows where OpenGWASDB stands and what each epic changed: one Quarto site over both repositories' docs, published from this repository's gh-pages branch, with an overview, a page per epic and per Store, and trends of the catalog, the yardstick and test time. It adds the data behind those pages (board, catalog history, Releases and Release Bundle collectors, and the epic record) and the yardstick, a fixed read-only benchmark on OGS-00009, OGS-00027 and OGS-00006. Both repositories now merge pull requests to main, each merge a version tagged from its changelog fragments, and this repository pins opengwasdb by release tag. The orchestrate and board skills now write each epic's record at its finish and offer to publish the site."
