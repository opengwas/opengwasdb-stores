summary: 'Epic #385 adds a project site that shows where OpenGWASDB stands and what each epic changed: one Quarto
  site over both repositories'' docs, rendered and published locally, with an overview, a page per epic and per
  Store, and trends of the catalog, the yardstick and test time. It adds the data behind those pages (board, catalog
  history, Releases and Release Bundle collectors, and this epic record), and the yardstick, a fixed read-only benchmark
  on OGS-00009, OGS-00027 and OGS-00006. Both repositories move to merging PRs to main with a version per merge,
  taken from changelog fragments and published by a release workflow that reconciles and resumes; the cutover itself
  is the owner''s. The epic stays active until the cutover, the opengwasdb pin by tag, the skills'' update and the
  first quiet-host yardstick results.'
