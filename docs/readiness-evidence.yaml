# Historical host-side evidence for the Store Release readiness view (#217).
#
# Membership (intended/admitted/excluded) is derived from each committed
# Release Bundle's `analyses.tsv` and is NOT recorded here. This ledger records
# only the facts the registry cannot re-derive: what the published artifact on
# the named host holds, which host execution records exist, the documented
# #199 committed-vs-published mismatches, and the historical membership
# baseline for OGS-00011. Errata are recorded as history; nothing here triggers
# a rebuild, a validate run, or an identity change.
#
# Schema (per `releases/<store-id>` entry):
#   built_analyses:       int | null   Analyses in the published artifact
#   built_baseline_ref:   git ref      committed bundle whose admitted set equals
#                                      the published artifact (for an explicit
#                                      membership ID-set difference)
#   baseline_note:        str          what the baseline represents
#   incomplete_membership: bool        published artifact is known incomplete
#   host_validation:      str          host-side Store validation provenance
#   host_registration:    str          host-side registration provenance
#   host_evidence_ref:    str          branch/ref carrying uncommitted evidence
#   published_format:     str          format_version the artifact declares
#   hm3_present:          bool         optional HM3 Indexed Variant Subset present
#   warnings:             [str]        warnings beyond the committed record
#   errata:               [str]        recorded corrections/asymmetries
#   blockers:             [str]        unresolved items preventing readiness
recorded_at: '2026-10-12'
artifact_root: /data/opengwasdb/stores
notes: >-
  Read-only reconciliation of the 12 registered Release Bundles against the
  historical 11 October 2026 host inspection. No build, conversion, repair or
  Store validation was rerun. A successful historical validate/register on the
