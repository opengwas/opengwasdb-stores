# This repository's imports of engine modules: the seam epic #416 decision 14
# bounds. The engine's own CLAUDE.md says this repository depends on its command
# line and its manifest columns; in fact 24 files here import 32 of its modules
# directly, 91 imports in all, and each is a coupling nobody decided on that an
# engine refactor can break.
#
# tests/project-site-architecture/test_engine_imports_baseline.py measures them
# with the import graph the site's architecture collector uses, and fails on an
# import this file does not list and on a listed import that has gone. The site's
# "Structure and health" page states this file's size next to the seam between
# the repositories, so the number on the page is this file's.
#
# One entry per (importing file, imported name), as the source writes it and
# package-qualified. That is the engine's unit too (its layering baseline,
# docs/architecture/layering-baseline.yaml in opengwas/opengwasdb). Not a count,
# and not one per module: a file importing three names of one engine module is
# three entries, and a count would let a new import hide behind a fixed one.
#
# A person reviews and commits this list; agents never add to it, the same rule
# as the quality gates. It only ever shrinks: a new engine import fails CI, and
# the fix is to go through the engine's command line or its manifest columns, not
# to add a line here. A coupling that a person decides on is the one exception,
# and it lands in the pull request that takes the decision.
#
# Measured on the branch that added this file (orch/416/421): 91 imports over 24
# files.
# The measurement needs no engine checkout and no engine model: a name is the
# engine's when it is `opengwasdb` or under it.
