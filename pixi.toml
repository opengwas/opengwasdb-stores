[workspace]
name = "opengwasdb-stores"
description = "Registry, generators, and reference-resource tooling for opengwasdb-stores"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
version = "0.1.0"

# See docs/software-management-proposal.md for the design behind this file.
# The sole user-facing execution interface is `pixi run <task>`.

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------

[feature.python.dependencies]
# Python 3.12 is the floor the pinned current-format opengwasdb runtime
# requires (stores#218; opengwas/opengwasdb#244): zarr-python 3.4, which the
# format-0.2.0 builders are written against, requires Python >=3.12 and
# numpy >=2. Do not lower this without lowering the pinned runtime.
python = "3.12.*"
pip = "*"
numpy = ">=1.26,<2.5"
scipy = ">=1.11"
pyyaml = "*"

[feature.python.pypi-dependencies]
# This repository's own Python code, installed editable (pyproject.toml, #257),
# so it imports without sys.path insertions. An editable install points at the
# checkout it was installed from: a second worktree runs `pixi install` of its
# own, and run_all_tests.py refuses to test one checkout against another's code.
ogstores = { path = ".", editable = true }

[feature.store-build.dependencies]
pandas = ">=2.0"
scikit-learn = ">=1.3"
# Format 0.2.0 is Zarr v3 with the sharding codec (opengwas/opengwasdb ADR
# 0057/0058, issue #247). The pinned runtime requires zarr>=3.4,<4 and
# numcodecs>=0.17 (the first release that locks Blosc's context on decode as
# well as encode, which the fused decode pipeline relies on). zarr 2.x cannot
# open a 0.2.0 Store, so this is the runtime floor, not a preference.
zarr = ">=3.4,<4"
numcodecs = ">=0.17"
typer = ">=0.12"
pyliftover = ">=0.4"
threadpoolctl = ">=3.0"

[feature.store-build.pypi-dependencies]
# Immutable pin (issue #41): a released version should replace this Git pin
# once one exists. Do not float this to a branch. pysam is left off the conda
# dependency list on purpose: opengwasdb's own PyPI dependency on it collides
# (conda + PyPI wheel installing the same compiled extension into the same
# environment) if pysam is also pinned via conda, so it is left for pip/uv to
# resolve as a transitive PyPI dependency of opengwasdb itself.
#
# Bumped for issues #61/#62/#66 after explodecomputer/opengwasdb#48 landed
# in PR #87 and opengwasdb#86 added shared Analytical Metadata passthrough.
# This immutable commit provides the native
# `opengwasdb.finngen-r13` Source Reader Capability and assembly-aware Dense
# build path used by the FinnGen R13 pilot without dropping its metadata.
#
# Previously bumped for opengwasdb-stores#68 (GWAS-Catalog-SSF -> Hybrid
# generator): explodecomputer/opengwasdb#84 registers a GWAS-SSF SourceReader
# capability (opengwasdb.gwas-ssf) so build_hybrid_from_vcf_manifest can
# consume harmonised GWAS-SSF sources, not just GWAS-VCF; #85 fixes a real bug
# that capability exposed -- Dense/Hybrid's VCF-manifest builders hardcoded
# hg19->hg38 liftover unconditionally, silently re-lifting (and mispositioning)
# an already-GRCh38 GWAS-SSF source. Both land as an optional per-row manifest
# column (source_reader_capability, source_assembly) that every existing
# manifest omits and is therefore unaffected by. (This bump's target commit is
# an ancestor of the current pin above, so both remain true of it.)
#
# Previously bumped for issue #63/opengwasdb#74: explodecomputer/opengwasdb#64 ("Unify
# analyses.tsv across every layout; retire phenotype_id; add Attribution
# Metadata", ADR 0034) landed as opengwasdb#75-#78. This pin is opengwasdb's
# main HEAD at the time of the bump. Note opengwasdb.model.analyses's
# registry-facing validate_analyses()/classify_column()/SHARED_CORE_COLUMNS
# still describe the pre-ADR-0034 schema at this rev -- that registry-side
# migration is explicitly deferred upstream (see the module's own docstring)
# -- so this bump does not change checks.schema's pass/fail behaviour; it
# only picks up ADR 0034's Analysis model/writer/reader and Dense/Ragged
# builder migration for whoever imports opengwasdb directly.
#
# Previously bumped for issue #51: explodecomputer/opengwasdb#16 ("Add
# analyses.tsv schema module") published opengwasdb.model.analyses
# (validate_analyses(), to_json_schema()) -- the shared core schema this
# registry's checks.schema validates emitted manifests against, replacing
# this repository's hand-rolled per-generator column-name checks.
#
# Bumped for opengwasdb#100: build_ragged_from_ssf hard-required a trait_id
# manifest column that gene-target-less Store Families (metabolome-plasma-2023)
# correctly omit by this registry's own documented per-family-shape convention;
# also picks up opengwasdb#99 (Hybrid disjoint-partition fix on LD-panel
# extension).
#
# Bumped for opengwasdb#101: build_ragged_from_ssf silently kept conflicting
# duplicate (analysis, variant) rows when a GWAS-SSF file had more than one
# row canonicalizing to the same cell -- found building metabolome-plasma-2023
# at production scale (up to 107/108 duplicate pairs genuinely conflicting in
# one release). Now resolved (identical duplicates collapse, conflicting ones
# drop) rather than silently kept.
#
# Previously bumped for issue #76/opengwasdb#114: `z` is now stored as `int16` fixed point
# at scale 1/1024 with a sparse exact overflow table, not `float16`, and the
# store format moves to `format_version` 1.0 (ADR 0037 §1, ADR 0038). This is a
# breaking store-format change, so it is the first pin bump that changes what a
# built store *is* rather than what the builder accepts:
#
#   - a store built at this rev is 1.0 and its `data.zarr/z` is `int16`;
#     anything reading that array raw reads z-scores 1024x too large, so reads
#     go through `opengwasdb.encoding.DenseZPlane` / `RaggedCSRReader.z_slice`
#     (this bump fixes the one place here that did: the LD-panel imputation
#     comparison script);
#   - `manifest.json` gains a required `encoding` block, and the per-layout
#     `provenance.*.dtype` key is renamed `se_dtype` (it only ever described
#     the float planes);
#   - every store already catalogued is 0.1. Those stay *readable* at this rev,
#     but they can no longer be reference-completed by it, and they do not gain
#     the accuracy: a 0.1 store's p-value at |z| = 47.8 is still wrong by 1.82x.
#     Rebuilding them is opengwasdb#117, tracked in docs/store-catalog.md.
#
# Bumped for issue #106: repin to canonical repository URL
# (https://github.com/opengwas/opengwasdb) and an immutable dev revision.
# Pinned to `dev` because opengwasdb `main` is temporarily frozen while
# dependent work is in flight, whereas all current opengwasdb development is
# on `dev` (the repository's default branch). This immutable dev commit
# (a9e8bc825af692cdb5bb7cba39d56d11654fcebe) provides the store-orchestration
# rewrite prerequisites: canonical analyses.tsv column consumption in dense,
# hybrid, and ragged-ssf builders (opengwasdb#170, #172), --analyses metadata overlay
# in build-ragged-besd (opengwasdb#173), per-release CLI defaults
# --source-reader-capability and --source-assembly (opengwasdb#174), structured
# JSON output in info/validate (opengwasdb#175), estimate-phenotype-sd CLI
# (opengwasdb#176), and format 0.1.0 alignment / v0.3.0 (opengwasdb#143, #171, #177, #178).
#
# REVERT CONDITION:
# Once `dev` merges to `main` and `main` is canonical again, move this pin back
# to a `main` revision. Tracking a long-lived non-default branch is a temporary
# accommodation for the current `main` freeze, not the intended steady state.
# Issue #106 tracks this reversion.
#
# Bumped for issue #153: the Phase B candidate workflow invokes the canonical
# `opengwasdb resolve-analyses` subcommand, which lands in opengwasdb#208 and is
# not yet merged to `dev`. Pinning the immutable feature commit keeps the
# resolver's atomic per-Analysis records and resume semantics under the
# registry's control without vendoring its code (ADR 0012/0017); this commit is
# a descendant of the #106 dev revision above, so every capability it names is
# still present.
#
# REVERT CONDITION (#153): once opengwasdb#208 is merged to `dev`, move this pin
# back to the `dev` revision (or `main` after the #106 reversion), and re-run
# `pixi lock`.
#
# Bumped for #176 (OGS-00011 release and build readiness): opengwasdb#208 has
# since merged, and this pins the OGS-00011 build-readiness integration commit
# on top of `dev` (opengwasdb PR from feat/ogs00011-build-readiness). It adds
# the resolver's build-eligible on/off-reference counts and lowercase-allele
# routing parity (#174), declared GWAS-SSF imputation-score filtering in the
# resolver and the Hybrid builder (#175), and the bounded/streamed Hybrid tail
# with opt-in checkpoint/resume (opengwasdb#226-#233). The previous pin ran
# pre-#224 code, which spent >21 h in the EAF consensus baseline. Candidate
# generation and the build must run at this same revision.
#
# Bumped again for #176 (OGS-00011 row admission): this pins the `dev` merge
# commit of opengwasdb#235. It reads case-control sources to EOF whenever
# whole-stream evidence is requested (the #174/#175 counts were previously a
# ~1% prefix for 880 Analyses), keeps unscored and >1 INFO rows, includes a
# declared-INFO Analysis with no usable score, and adds the per-Analysis
# `maf_threshold` with one admission rule shared by the resolver and the Hybrid
# builder.
#
# Bumped again for #176 (effect/SE recovery): this pins the `dev` merge commit
# of opengwasdb#236. It recovers a row's effect from `odds_ratio` when `beta` is
# empty and its SE from a 95% CI or the p-value, reads a source frequency of
# exactly 0 or 1 as missing, and fingerprints resolver records with the core's
# own commit rather than this repository's. Candidate generation and the build
# must run at this same revision.
#
# Bumped for #195 (OGS-00005 re-registration): this pins the `dev` merge commit
# of opengwasdb#256 (#255). A plain-ALID `--variant-reference` build now
# collects the sources' rsids, where it previously went single-pass with an
# empty rsid map and wrote a Store with none, which `opengwasdb validate`
# passed. OGS-00004's and OGS-00005's recipes take that path. Deliberately not
# `dev`'s head: epic #240 (`5910e29`) has since merged there, and its builders
# write format 0.2.0, which the catalogue does not adopt until #197. This
# revision still writes 0.1.0, like every registered Store.
#
# #209 (Indexed Variant Subsets) deliberately does not bump this pin: every
# opengwasdb revision that provides `build-indexed-subset` (first at
# `4819a2ee`, opengwasdb#264) is a descendant of the format-0.2.0 builders
# (`5910e29`), so a bump would silently adopt the catalogue-wide migration
# tracked by #197. A release that declares `indexed_subsets` instead carries a
# documented runtime prerequisite: its run needs a subset-capable `opengwasdb`
# on PATH, and the release entry point refuses loudly when the resolved
# executable does not provide the command. A release with no declaration is
# never gated on the runtime version.
#
# Bumped for #218 (pinned current-format runtime, coordinating #197): the
# initial #218 pin was core `dev` merge commit `1be2a15` (opengwas/opengwasdb
# PR #275), the first immutable revision carrying every capability the
# supported release entry point requires together. The pin was then
# re-coordinated to `4e922566` (opengwas/opengwasdb PR #276) once core #254's
# bounded Dense-validation memory work merged to `dev`, so the same capability
# set is now paired with the validation memory bound the build tickets need.
# The capabilities are unchanged by the repin:
#
#   - format-0.2.0 builders (opengwasdb#247, `5910e29`): Zarr v3 with the
#     sharding codec, Dense inner chunk [1000, 64] and shard [100000, 1024];
#   - the required Ragged/Overflow variant-side `by_variant/` index written
#     inline by every Ragged/Hybrid builder and required by `validate`
#     (opengwasdb#252/#268, `4832843`) -- this is a format contract, not an
#     optional enhancement;
#   - Indexed Variant Subset support, including Dense, completed-Dense and
#     Hybrid Dense components (opengwasdb#264/#269/#271, first at `4819a2ee`);
#   - the shared HM3 benchmark seam (opengwasdb#272);
#   - bounded Dense validation memory (opengwasdb#254/#276).
#
# Repinned for #306 to `023774a7` for `check-observed-view` (opengwasdb#289),
# which gates a single-id completion's swap. It also brought opengwasdb #277,
# #278, #281 and #282 merged to `dev` since `4e922566`.
#
# Repinned for #312 to `d405de0a`, the opengwasdb `dev` merge of PR #291, whose
# first parent is PR #288's merge `ba84a0c`. The OGS-00009 rebuild from hg19
# sources needs #288's strand-aware lift: one lift (`statistics_swap`) shared by
# the resolver and the Dense, Hybrid and BESD builders, so z/beta and EAF follow
# the projected allele pair on reverse-strand variants. The range
# `023774a..d405de0` is #288's commits and merge plus the #291 merge, and #288
# (opengwasdb#284) supplies its only functional change; a Hybrid single-pass build whose
# off-reference rows lift onto the reverse strand is now refused, not signed
# wrongly.
#
# Repinned for #333 to `eb4c749b`, the merge of opengwasdb#295 into the core
# integration branch for stores epic #232 (opengwasdb PR #303), not yet on core
# `dev`: `check-observed-view` now compares a Hybrid pair, so a Hybrid release
# can complete its own Store. The range `d405de0..eb4c749` is #295's two commits
# and merge, the branch's empty first commit and core `dev`'s docs-only PR #293;
# #295 is its only functional change.
#
# Repinned for #336 to `32f47b3b`, the merge of opengwasdb#296 into the same
# integration branch, not yet on core `dev` either: `check-observed-view` now
# compares a Ragged pair, region by region against the LD panel completion
# used, so a Ragged release can complete its own Store. The range
# `eb4c749..32f47b3` is #296's commits and merge; #296 is its only functional
# change.
#
# Repinned for #225 to `1e2fb42`, the merge of opengwasdb#306 into the same
# integration branch, again not yet on core `dev`: `build-hybrid` gained
# `--on-rsid-conflict {refuse,drop}` and always reports what its rsid harvest
# compared, so a Hybrid build can record where its sources disagree on a
# variant's name instead of refusing every such key. The range
# `32f47b3..1e2fb42` is #306's commits and merge; #306 is its only functional
# change.
#
# Repinned for #225 to `496bfe9`, the merge of opengwasdb#324 into the same
# integration branch, again not yet on core `dev`: `build-indexed-subset` gained
# `--overflow-only {refuse,skip}` and records the ALIDs a Hybrid's subset leaves
# out for living only on its Overflow axis, so a subset build need not refuse a
# Store whose shared axis is short of the list. The range `1e2fb42..496bfe9` is
# #324's commit and merge; #324 is its only functional change.
#
# Repinned for #314 to `d8896e6`, the opengwasdb `dev` merge of PR #305. The full
# eQTLGen cis Store (OGS-00027) fails `validate` at `d405de0`: 13 hg19 SNPs
# collide on one hg38 variant after the lift, so one Analysis's CSR segment
# holds one `variant_index` twice. `d8896e4` makes `build-ragged-besd` drop every
# ESI entry in a colliding group, with its associations, exactly as a liftover
# failure is, and tightens `validate` to require each Analysis's `variant_index`
# slice to be strictly increasing (naming a repeat separately from a decrease).
# The range `d405de0..d8896e4` is #304's three commits and its merge plus a
# docs-only merge (#293, agent skills); #304 is its only functional change, and
# the Store format stays 0.2.0.
#
# Repinned for #341 to `75f0e77a`, the opengwasdb `dev` merge of PR #298, which
# makes Association Coverage a build input. `build-ragged-ssf` and
# `build-ragged-besd` now require `--association-coverage` (one of `gwas`, `cis`,
# `cis_and_signals`, `signals_only`, the four-value vocabulary ADR 0040 settles),
# `build-dense-vcf` and `build-hybrid` accept only `gwas`, and every builder and
# completion command prints `association_coverage` in its stdout JSON. The range
# `d8896e4..75f0e77` is #298's own commits and its merge. There is no Store
# format bump (the owner's decision on opengwas/opengwasdb#298): the Store
# format stays 0.2.0, and the pinned runtime reads a legacy `full` in an
# existing Store's `manifest.json` as `gwas`.
#
# Repinned for #282 to `0d59f151`, the opengwasdb `dev` merge of PR #329, which
# carries core #302 (ADR 0067): `build-ragged-besd` takes `--sample-size-table`
# and stores each stored pair's sample size in an opt-in `uint32` `n` plane and
# its by-variant copy (a pair the table omits is missing, never estimated from
# `se`), and `--store-esi-eaf` stores the `.esi` frequency per association,
# oriented to the effect allele and checked once against `--eaf-reference`. A
# Store holding an `n` plane keeps `se` in float16, and `validate`, the query
# seam and `info` report the plane. That is the runtime the OGS-00027
# replacement is built on. The pin already carried #326's SE re-encode primitive
# as its branch head `5fc0766`; the range `5fc0766..0d59f151` is #330's merge of
# that branch, #332's MAF admission fix (#331), #303 (#295/#296/#306/#324: the
# Ragged and Hybrid Observed-View Checks, `build-hybrid --on-rsid-conflict` and
# `build-indexed-subset --overflow-only`), #328's OGS-00009/OGS-00010 benchmark
# harness and #329. None of them moves the Store format: it stays 0.2.0.
#
# Because these capabilities ship in the tracked pin, the ordinary
# `pixi run release` invocation resolves a capable runtime from this
# environment with no ad-hoc `PATH` overlay (the HM3 proof's temporary
# `--opengwasdb-checkout` / PATH substitution is retired for supported runs).
# The release entry point still proves the resolved revision against this pin,
# probes every subcommand the scheduled steps need, and refuses a Reference
# Completion whose existing parent Store is not format 0.2.0, before any
# artifact is written.
#
# This bump changes what a *new* build is: a Store built from here is format
# 0.2.0, so Reference Completion of an existing 0.1.0 parent is refused. The
# supported order is the core-owned conversion or rebuild procedure in
# docs/runtime.md. Upgrading the runtime does not convert or requalify any
# published Store; each build ticket must supply a compatible observed parent
# (or convert/rebuild first) before completion.
opengwasdb = { git = "https://github.com/opengwas/opengwasdb", rev = "0d59f151c7618933747a59f825deeef6a51de9e1" }

[feature.r.dependencies]
r-base = ">=4.3"
"r-data.table" = "*"
r-yaml = "*"
# data.table::fread() shells out to R.utils to read .gz files directly; never
# library()'d explicitly, so it's easy to miss auditing only `library()` calls.
"r-r.utils" = "*"
# No tracked R code calls httr any more: its only caller,
# resources/generators/lib/metadata_resolvers/opengwas_api.R, retired with the
# OpenGWAS R path (#289). Kept because tools/env_check.py requires the package
# and the R environment is not shrinking with #350; dropping it would mean a
# pixi.lock regeneration for no gain.
r-httr = "*"
r-jsonlite = "*"
r-openssl = "*"
r-ieugwasr = ">=1.1.0,<2"

[feature.reporting.dependencies]
r-dplyr = "*"
r-ggplot2 = "*"
r-knitr = "*"
r-scales = "*"
r-tibble = "*"
r-rsqlite = "*"
r-tidyr = "*"
r-jsonlite = "*"
r-curl = "*"
r-dt = "*"
r-tidyverse = "*"
quarto = "*"

[feature.ld-panel.dependencies]
plink2 = "*"
bcftools = "*"
curl = "*"

[feature.dev.dependencies]
git = "*"
gh = "*"
sqlite = "*"
snakemake-minimal = ">=9,<10"

[feature.dev.pypi-dependencies]
# The version is computed from the `v*` tag by setuptools-scm (pyproject.toml,
# #386), which pip installs into its isolated *build* environment, so the
# environment itself needs it only for the test that reads the version the
# build would produce (tests/release-versioning/test_version.py). It is a PyPI
# dependency because that is the same distribution the build resolves, from the
# same index, at the same version.
setuptools-scm = ">=8,<9"

[feature.workflow.dependencies]
# Phase A orchestration. The DAG only wires dependencies and resource requests;
# every semantic step is an `opengwasdb` subcommand (ADR 0023).
snakemake-minimal = ">=9,<10"

[feature.curation.dependencies]
# Canonical Trait Mapping Table curation tooling (issues #161/#164).
#
# This feature is deliberately kept out of the `main` solve group so retrieval
# and model-client dependencies can never change what a Manifest Generator or a
# build resolves. The lexical candidate generation in `src/curation/` is pure
# Python standard library and needs none of these; they seed the isolated
# environment for the stages that follow:
#   - rapidfuzz: fuzzy lexical scoring available to retrieval as its channels
#     grow;
#   - httpx: the hosted-model and embedding clients the choice (#167) and
#     semantic (#166) stages are built around.
# Do not add a `store-build` dependency here, and do not add this feature to
# any environment in `solve-group = "main"`.
rapidfuzz = ">=3.0"
httpx = ">=0.27"

# ---------------------------------------------------------------------------
# Environments
# ---------------------------------------------------------------------------
# Solve groups keep shared packages (numpy, r-data.table, ...) at one resolved
# version across environments instead of letting each environment solve
# independently, so "tested" and "production" stay the same build.

[environments]
default = { features = ["python", "store-build", "r"], solve-group = "main" }
docs = { features = ["r", "reporting"], solve-group = "main" }
ld-panel = { features = ["python", "ld-panel"], solve-group = "main" }
dev = { features = ["python", "store-build", "r", "reporting", "ld-panel", "dev"], solve-group = "main" }
workflow = { features = ["python", "store-build", "workflow"], solve-group = "main" }
# Curation tooling resolves on its own, outside the `main` solve group, so its
# retrieval/model-client dependencies cannot perturb a generator or build solve
# (issue #164). Run it with `pixi run -e curation <task>`.
curation = { features = ["python", "curation"] }

# ---------------------------------------------------------------------------
# Tasks
# ---------------------------------------------------------------------------

[feature.store-build.tasks]
# Manifest Generation (ADR 0035), the `manifest_generation` package under
# src/ (#249). generate-candidate, inventory-freeze and preflight each take any
# release config with `--config` (docs/spec/release-config.md, #287); there is
# no default config. concordance-run reads the pre-#287 config-full.yaml its
# preregistered study is bound to, and concordance-sample takes an `--inventory`.
#
# One entry point runs the shared pipeline for a release config (ADR 0036):
# freeze, preflight, prepare, resolve (`opengwasdb resolve-analyses`), verify,
# render (Trait Ontology Mapping, release policy, render) and emit, with
# `--stage` for one stage. It needs `opengwasdb` (the resolver) and `ogstores`
# (bundle.check()), so it lives in the store-build environment.
#
#   pixi run generate-candidate OGS-00011 \
#     --config resources/generators/gwas-catalog-eur-hybrid/release-eur-hybrid-full.yaml \
#     --cores 64
#
generate-candidate = { cmd = "python3 -m manifest_generation.generate_candidate" }

# The Analysis Catalog (#323, ADR 0039): rebuild the cross-Store listing of every
# Analysis of every served Store Release from the registry's Release Bundles,
# into <artifact-root>/catalog/versions/<version>/, and swap `current`. It reads
# bundles only and never opens a Store. Run after a merge to `main`, from a
# clean checkout of `origin/main`; a rebuild with unchanged inputs writes nothing.
# Resolves the Artifact Root as ogstores does; `--artifact-root PATH` overrides it.
#
#   pixi run catalog [--registry stores] [--artifact-root PATH]
#
#
# It also renders the summary report (#325), which needs Quarto and R beside
# the builder, so the task runs in `dev` whichever environment is default.
catalog = { cmd = "python3 -m analysis_catalog", default-environment = "dev" }

# The project site's data (#389, docs/spec/project-site.md): run every collector
# (the board, the catalog's versions, both repos' Releases, the Release Bundles,
# the epic records) and write one JSON file each under docs/_data/ (git-ignored;
# OPENGWASDB_SITE_DATA or --data-dir overrides it). It reads the catalog
# read-only, writes nothing under the artifact root, and needs `gh`; a source
# it cannot read is written as `available: false` and printed as UNAVAILABLE,
# with exit status 0 unless `--strict`.
#
#   pixi run site-data [--data-dir PATH] [--catalog-root PATH] [--registry PATH] [--strict]
site-data = { cmd = "python3 -m project_site.collect", default-environment = "dev" }

# Lossless SE re-encode for one registered Store Release (#326). The stores
# lane of opengwas/opengwasdb#326: it resolves the Artifact Root through
# `ogstores`, takes the release's exclusive lock, refuses a release transaction
# or completion in progress, and then calls the pinned core primitive
# (`opengwasdb.reencode`) and writes `records/se-reencode.json`. It is
# idempotent and its `--dry-run` is strictly read-only.
#
#   pixi run se-reencode OGS-00009 [--dry-run] [--workers 16]
#   pixi run se-reencode OGS-00009 --artifact-root /path --registry-root stores
se-reencode = { cmd = "python3 -m ogstores.se_reencode" }

[feature.python.tasks]
# Manifest Generation: freeze the Source Inventory a release config selects,
# with the shared freeze over the Source Collection's connector files (#283),
# then prove the frozen snapshot before the resolution run reads a single
# association row (issue #151). Both take `--config <release config>` and are
# pure Python (no opengwasdb, no R), so they run in the default environment.
#
# `concordance-sample` draws the QC Panel Concordance Study's stratified sample
# (#152) from any frozen Source Inventory given with `--inventory`; it takes no
# `--config`. Its defaults read the GWAS Catalog eur-hybrid 2026-09-10 snapshot
# and OVERWRITE the tracked sample under resources/inventories/
# (gwas-catalog-ssf-eur-hybrid-qc-sample-2026-09-10.{tsv,meta.yaml}); pass
# `--out-tsv`/`--out-meta` to write elsewhere. `concordance-run` (dev) runs the
# study for a pre-#287 generator config (`--config`) and writes its reports
# under `--out-dir` (default /data/opengwasdb/work/gwas-catalog-eur-hybrid/concordance).
inventory-freeze = { cmd = "python3 -m manifest_generation.inventory freeze" }
preflight = { cmd = "python3 -m manifest_generation.inventory preflight" }
concordance-sample = { cmd = "python3 -m manifest_generation.sample_concordance" }

[feature.dev.tasks]
test = { cmd = "python3 tests/run_all_tests.py" }
test-python = { cmd = "python3 tests/run_all_tests.py --only python" }
test-r = { cmd = "python3 tests/run_all_tests.py --only r" }
concordance-run = { cmd = "python3 -m manifest_generation.run_concordance_study" }
bundle-check = { cmd = "python3 -m manifest_generation.check_bundles" }
audit-indexed-subsets = { cmd = "python3 -m ogstores.audit_indexed_subsets" }
env-check = { cmd = "python3 tools/env_check.py" }
worktree-prune = { cmd = "python3 tools/prune_worktrees.py" }
yardstick = { cmd = "python3 -m yardstick" }
index-ci = { cmd = "snakemake --snakefile workflow/Snakefile --cores 1 index" }

[feature.r.tasks]
materialise-gwas-ssf-ragged = { cmd = "Rscript src/manifest_generation/providers/gwas_catalog/materialise-gwas-ssf-ragged.R" }

[feature.workflow.tasks]
# Phase A. `release` takes one or more Store Release ids; lineage order is
# resolved by the DAG, so a Reference-Completed child never needs sequencing
# by hand. `index` regenerates the master list from the bundles alone.
#
#
# `release` is the supported entry point (#195): workflow/release.py completes
# any interrupted publication, refuses a published release unless it is named
# with `--config force=1`, snapshots what a forced run may replace, runs
# Snakemake once, and settles the run. It accepts only release ids, `--config`,
# `--cores`, `--dry-run`, `--keep-going`, `--rerun-incomplete` and
# `--resolve-snapshot restore|delete`; `--no-hooks` and other unsafe options are
# refused. Name the ids first, then the overrides:
#
#   pixi run release OGS-00003 --config artifact_root=/path
#   pixi run release OGS-00005 --config force=1   # replace it; the old one is archived
#
# Running snakemake directly bypasses that guard.
release = { cmd = "python3 workflow/release.py" }
release-dry = { cmd = "python3 workflow/release.py --dry-run" }
index = { cmd = "snakemake --snakefile workflow/Snakefile --cores 1 index" }

[feature.reporting.tasks]
docs = { cmd = "bash tools/build-site.sh" }
# The site (#388): one Quarto website over this repository's docs/ and the
# engine's docs. It needs Python (for the staging, link rewrite and served-path
# check) beside Quarto, so it runs in `dev` whichever environment is default.
#
#   pixi run site                     # render; the served-path check fails a drop
#   pixi run site-preview             # stage, then Quarto's live-reloading preview
#   pixi run site-publish --dry-run   # render origin/dev and commit gh-pages, no push
#
# The output is `/data/opengwasdb/work/site/<checkout>/_site`, never under /home
# or /tmp (src/project_site/paths.py).
site = { cmd = "python3 -m project_site.build", default-environment = "dev" }
site-preview = { cmd = "python3 -m project_site.build --preview", default-environment = "dev" }
site-publish = { cmd = "python3 -m project_site.publish", default-environment = "dev" }
# The full `docs` task needs raw GWAS Catalog source data that is not tracked
# in this repository (resources/data/*.tsv, "download separately" per
# .gitignore) to build ebi-studies.qmd/make-dashboard.r's inputs. docs-smoke
# renders only beta-scale-estimation.qmd, which is fully self-contained (no
# external data reads), so it is safe to run from a bare checkout, in `docs` as well as `dev` — this is
# what CI uses as its documentation smoke test.
docs-smoke = { cmd = "quarto render docs/reports/beta-scale-estimation.qmd --to html" }
# Smoke render of the Analysis Catalog summary (#325) against a fixture catalog.
# Needs the builder as well as Quarto, so run it in `dev`, not `docs`; CI runs it
# in the same job as docs-smoke.
catalog-summary-smoke = { cmd = "python3 tests/catalog/smoke_summary.py" }

[feature.ld-panel.tasks]
ld-acquire = { cmd = "python3 tools/ld-panel/acquire_hgdp1kgp.py" }
ld-materialize = { cmd = "python3 tools/ld-panel/materialize_reference.py" }

[feature.curation.tasks]
# Curation stages (issues #161/#164/#165). Run in the isolated curation
# environment:
#   pixi run -e curation ontology-index --obo <efo.obo> --output .cache/curation/efo-v3.94.0.index.json
#   pixi run -e curation lexical-candidates --work-queue <queue.tsv> --index <index.json> --output <shortlist.tsv>
#   pixi run -e curation harvest <manifest>... --index <index.json> --output <validation.tsv>
#   pixi run -e curation recall --validation <validation.tsv> --index <index.json>
#   pixi run -e curation embed-ontology --ontology-index <index.json> --output <ontology-store-dir> [--endpoint "$OPENGWASDB_EMBEDDING_ENDPOINT"]
#   pixi run -e curation embed-traits --work-queue <queue.tsv> --output <trait-store-dir> --model-of <ontology-store-dir> [--endpoint "$OPENGWASDB_EMBEDDING_ENDPOINT"]
#   pixi run -e curation semantic-candidates --work-queue <queue.tsv> --index <index.json> --ontology-embeddings <ontology-store-dir> --trait-embeddings <trait-store-dir> --output <shortlist.tsv>
#   pixi run -e curation choice --shortlists <shortlist.tsv> --chooser jev --jev-endpoint <url>
#   pixi run -e curation validate-chooser --validation <validation.tsv> --shortlists <shortlist.tsv>
#   pixi run -e curation coverage --manifests <analyses.tsv> --mapping <mapping.tsv>
#   pixi run -e curation curation-round --index <index.json> --chooser jev --jev-endpoint <url>
#
# Resumable round stages (issue #161). Each reads the pins from
# <round-dir>/round.yaml and is idempotent, so a rerun resumes:
#   pixi run -e curation round-init --round-dir <dir> --index <index.json> --chooser jev --manifests <analyses.tsv>...
#   pixi run -e curation round-gap-scan --round-dir <dir>
#   pixi run -e curation round-embed-traits --round-dir <dir> [--endpoint "$OPENGWASDB_EMBEDDING_ENDPOINT"]
#   pixi run -e curation round-candidates --round-dir <dir>
#   pixi run -e curation round-choose --round-dir <dir> [--workers 8] [--limit N] [--max-cost-usd X]
#   pixi run -e curation round-reduce --round-dir <dir> [--allow-incomplete]
#   pixi run -e curation round-promote --round-dir <dir> [--reviewed-queue <tsv>]
#   pixi run -e curation round-coverage --round-dir <dir> [--format markdown]
#
# `embed-ontology` and `embed-traits` write each finished chunk under
# <store-dir>/chunks/ before assembling vectors.npy/ids.tsv/meta.yaml, so an
# interrupted run resumes and only re-requests the chunks it is missing.
# `validate-chooser` is an explicit validation harness, never part of
# `pixi run test-*`. A live hosted-Jev run additionally requires `--live`.
ontology-index = { cmd = "python3 -m curation.ontology" }
embed-ontology = { cmd = "python3 -m curation.embedding embed-ontology" }
embed-traits = { cmd = "python3 -m curation.embedding embed-traits" }
lexical-candidates = { cmd = "python3 -m curation.candidates" }
semantic-candidates = { cmd = "python3 -m curation.candidates --enable-embedding" }
harvest = { cmd = "python3 -m curation.harvest" }
recall = { cmd = "python3 -m curation.recall" }
choice = { cmd = "python3 -m curation.choice" }
promotion = { cmd = "python3 -m curation.promotion" }
validate-chooser = { cmd = "python3 -m curation.validate_chooser" }
coverage = { cmd = "python3 -m curation.coverage" }
curation-round = { cmd = "python3 -m curation.curation_round" }
round-init = { cmd = "python3 -m curation.round round-init" }
round-gap-scan = { cmd = "python3 -m curation.round gap-scan" }
round-embed-traits = { cmd = "python3 -m curation.round embed-traits" }
round-candidates = { cmd = "python3 -m curation.round candidates" }
round-choose = { cmd = "python3 -m curation.round choose" }
round-reduce = { cmd = "python3 -m curation.round reduce" }
round-promote = { cmd = "python3 -m curation.round promote" }
round-coverage = { cmd = "python3 -m curation.round coverage" }
