store_family_id: ukb-b
family_release_id: dense-observed-vcf-c128-resolved
source_collection_id: opengwas-gwas-vcf
release_kind: source-natural
association_coverage: full_gwas
lineage_derived_from: dense-observed-vcf-c128
description: >
  ukb-b batch (2,514 UK Biobank GWAS-VCF analyses) with stored_effect_scale,
  sample_size_kind, n_cases, and n_controls genuinely resolved per-Analysis
  from the OpenGWAS API (issue #49/#50), replacing the ad hoc
  reverse-engineered dense-observed-vcf-c128 candidate bundle's blank/
  family-default values for these fields.
notes: >
  Scope boundary (issue #50): this release makes the release manifest
  correct. It does not make opengwasdb build a store using these values --
  as of the currently pinned opengwasdb commit,
  opengwasdb.layouts.dense.build_vcf calls read_vcf_study_type() on the raw
  VCF ##SAMPLE header unconditionally, with no code path that even
  considers a manifest-supplied stored_effect_scale. The builder-side half
  is tracked separately at explodecomputer/opengwasdb#14; do not treat this
  release as having fixed the ieu-a-7-shaped bug end-to-end until that is
  resolved too. ieu-a-7 itself is not a ukb-b analysis (it belongs to the
  unrelated ieu-a batch) and is not part of this batch to compare against.

  Out of scope for this release (unchanged from dense-observed-vcf-c128,
  not newly introduced here): `license`/`checksum`/`checksum_algorithm`/
  `size_bytes` remain blank for every row, inherited as-is from the
  candidate manifest. This generator resolves only the fields issue #49/#50
  scope it to (stored_effect_scale, sample_size_kind, sample_size,
  n_cases, n_controls); licence terms and file checksums need the source
  VCFs themselves, which this registry has no direct access to.
build_notes: >
  Not yet built. The physical store still needs an opengwasdb rebuild from
  this corrected manifest, and per the scope-boundary note above, even that
  rebuild would not pick up stored_effect_scale from this manifest until
  explodecomputer/opengwasdb#14 lands.

source:
  source_snapshot_id: opengwas-api-r2026-08-10

inputs:
  candidates: families/ukb-b/releases/dense-observed-vcf-c128/analyses.tsv

defaults:
  source_genome_build: GRCh37
  target_reference_assembly: GRCh38
  liftover: hg19-to-hg38
  liftover_chain: /data/opengwasdb/reference/liftover/hg19ToHg38.over.chain.gz

reference_resources:
  - resource_id: hgdp1kgp-ancestry-mixture-hg38
    kind: ancestry_mixture
    genome_build: GRCh38
    location: /data/opengwasdb/reference/ancestry-mixture/ref_freqs.hg38.tsv.gz
    fine_group_map: /data/opengwasdb/reference/ancestry-mixture/ancestry_groups.tsv
  - resource_id: ukb-eur-reference-af-hg38
    kind: reference_af
    genome_build: GRCh38
    root: /data/opengwasdb/reference/ukb-hg38
    ancestry_dir: EUR
  - resource_id: canonical-trait-mapping-efo
    kind: trait_ontology_mapping
    location: reference-resources/canonical-trait-mapping-efo/mapping.tsv

ancestry_assignment:
  enabled: true
  reference_resource_id: hgdp1kgp-ancestry-mixture-hg38
  sampling_chromosome: 1
  max_reference_sites: 20000
  maf_floor: 0.01
  gates:
    tau: 0.50
    delta: 0.20
    n_min: 5000
    residual_max: 0.06

effect_scale_validation:
  enabled: true
  min_overlap_variants: 20
  sd_tolerance: 0.15
  reference_resources:
    - ancestry: EUR
      resource_id: ukb-eur-reference-af-hg38

output:
  release_dir: families/ukb-b/releases/dense-observed-vcf-c128-resolved
  artifact_root: /data/opengwasdb
  artifact_subdir: ukb-b/releases/dense-observed-vcf-c128-resolved
  planned_store_uri: /data/opengwasdb/wip/ukb-b-c128-resolved.opengwasdb
