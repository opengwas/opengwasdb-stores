store_family_id: ukb-b
family_release_id: dense-observed-vcf-pilot-10
source_collection_id: opengwas-gwas-vcf
release_kind: one-off
association_coverage: full_gwas
description: >
  10 ukb-b GWAS-VCF analyses, resolved via a real OpenGWAS API call and
  built end-to-end through OpenGWASDB's real dense builder, as a small,
  current, grounded proof that this Store Family's pipeline (issue #49/#50
  resolution, analysis_label, this session's Trait Ontology Mapping work)
  actually produces a working store -- distinct from the full 2,514-analysis
  dense-observed-vcf-c128-resolved release, which stays at status: candidate
  until someone wants to build the whole batch.
notes: >
  Selected via --only-analysis-id: 7 deterministically chosen buildable IDs
  plus the 3 IDs already used as this generator's own README smoke-test
  example (ukb-b-10787, ukb-b-11842, ukb-b-19953), so their source VCFs
  were already available locally.

source:
  source_snapshot_id: opengwas-api-r2026-08-10

inputs:
  candidates: families/ukb-b/releases/dense-observed-vcf-c128/analyses.tsv

defaults:
  source_genome_build: GRCh37
  target_reference_assembly: GRCh38
  liftover: hg19-to-hg38
  liftover_chain: /data/opengwasdb/reference/liftover/hg19ToHg38.over.chain.gz

reference_resources:
  - resource_id: hgdp1kgp-ancestry-mixture-hg38
    kind: ancestry_mixture
    genome_build: GRCh38
    location: /data/opengwasdb/reference/ancestry-mixture/ref_freqs.hg38.tsv.gz
    fine_group_map: /data/opengwasdb/reference/ancestry-mixture/ancestry_groups.tsv
  - resource_id: ukb-eur-reference-af-hg38
    kind: reference_af
    genome_build: GRCh38
    root: /data/opengwasdb/reference/ukb-hg38
    ancestry_dir: EUR
  - resource_id: canonical-trait-mapping-efo
    kind: trait_ontology_mapping
    location: reference-resources/canonical-trait-mapping-efo/mapping.tsv

ancestry_assignment:
  enabled: true
  reference_resource_id: hgdp1kgp-ancestry-mixture-hg38
  sampling_chromosome: 1
  max_reference_sites: 20000
  maf_floor: 0.01
  gates:
    tau: 0.50
    delta: 0.20
    n_min: 5000
    residual_max: 0.06

effect_scale_validation:
  enabled: true
  min_overlap_variants: 20
  sd_tolerance: 0.15
  reference_resources:
    - ancestry: EUR
      resource_id: ukb-eur-reference-af-hg38

output:
  release_dir: families/ukb-b/releases/dense-observed-vcf-pilot-10
  artifact_root: /data/opengwasdb
  artifact_subdir: ukb-b/releases/dense-observed-vcf-pilot-10
  planned_store_uri: /data/opengwasdb/wip/dense-observed-vcf-pilot-10-smoketest
