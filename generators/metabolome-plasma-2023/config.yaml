store_family_id: metabolome-plasma-2023
family_release_id: 2023-chen-pilot-80
store_key: ragged__pmid-36635386__multi-ancestry
source_collection_id: gwas-catalog-ssf
release_kind: one-off
association_coverage: signals_only
description: >
  Small multi-ancestry slice (20 analyses each: African, East Asian,
  European, South Asian) of the Chen et al. 2023 plasma metabolome atlas
  (PMID 36635386), frozen as the pilot no-cis ragged GWAS-SSF release.
notes: >
  Pilot release for issue #27. No single encoding gene per metabolite, so
  this uses the no-cis sparse-region policy (issue #26): only
  significant-hit and suggestive-lead regions are retained, no cis window.
  Unlike the Sun pQTL pilot, this Source Collection's harmonised files carry
  genuine source allele frequencies, so effect-scale validation runs with
  af_source=source and ancestry assignment runs with real AF-based mixture
  fitting across four distinct ancestries (issue #23/#25).

  Re-run for issue #31 with the fixed QC panel (issue #28/#29/#30) enabled:
  the #27 baseline had 35/80 Analyses gate out on `overlap` for ancestry
  assignment purely from low `af_overlap` (many under 20 variants) despite
  several already showing a near-1.0 dominant proportion -- a sparse-signal
  filtering artifact, not genuine ancestry ambiguity. See
  `qc_panel_comparison.md` in this release directory for the full
  before/after comparison.

source:
  source_snapshot_id: gwas-catalog-v1.0.3.1-r2026-07-10
  ftp_base: http://ftp.ebi.ac.uk/pub/databases/gwas/summary_statistics

inputs:
  candidates: resources/data/derived/store-candidates-analyses.tsv

selection:
  pubmed_id: 36635386
  ancestry_groups:
    - African
    - East Asian
    - European
    - South Asian
  n_analyses_per_ancestry: 20

defaults:
  source_genome_build: GRCh38
  license: EBI GWAS Catalog terms of use
  publication_doi: 10.1038/s41588-022-01270-1
  consortium: Chen et al. 2023
  original_effect_scale: sd
  original_sd_method: unavailable
  stored_effect_scale: sd
  sample_size_scope: analysis_level
  ancestry_assignment_method: source_trusted_no_af
  analysis_group_id: PMID36635386
  inclusion_reason: multi_ancestry_metabolome_pilot
  tissue: plasma
  context: metabolomics

filter:
  region_policy_id: sig-trans-1mb_suggestive-leads
  trans_flank_bp: 1000000
  significant_p: 5.0e-8
  suggestive_p: 1.0e-5
  suggestive_lead_min_distance_bp: 100000
  download_timeout_seconds: 3600
  qc_panel:
    enabled: true
    resource_id: qc-panel-hg38

# Reference-AF effect-scale validation (issue #16) also runs against this
# release. Unlike the Sun pQTL pilot, this Source Collection provides usable
# source allele frequencies, so af_source is expected to read "source" (not
# the reference-AF fallback), estimating original_sd via
# estimated_from_source_maf since original_sd_method starts unavailable.
effect_scale_validation:
  enabled: true
  maf_min: 0.01
  maf_max: 0.5
  min_overlap_variants: 20
  sd_tolerance: 0.15
  warning_multiplier: 2.0
  dispersion_max: 0.5

# AF-based ancestry assignment (issue #23/#25), using the same source AF.
reference_resources:
  - resource_id: ukb-ancestry-mixture-hg38
    kind: ancestry_mixture
    genome_build: GRCh38
    variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
    root: /data/opengwasdb/reference/ancestry-mixture/ref_freqs.hg38.tsv.gz
    fine_group_map: /data/opengwasdb/reference/ancestry-mixture/ancestry_groups.tsv
    location_kind: external_file
  # Fixed QC panel (issue #28/#29/#30): retained unconditionally regardless
  # of significance, giving ancestry assignment a stable variant backbone
  # independent of how many significant hits a given Analysis has.
  - resource_id: qc-panel-hg38
    kind: qc_panel
    genome_build: GRCh38
    variant_id_convention: "chr:pos:A1:A2 (A1 = min(allele1, allele2))"
    root: reference-resources/qc-panel-hg38/qc_panel.tsv
    location_kind: tracked_file

ancestry_assignment:
  enabled: true
  reference_resource_id: ukb-ancestry-mixture-hg38
  maf_floor: 0.01
  gates:
    tau: 0.50
    delta: 0.20
    n_min: 200
    residual_max: 0.06

output:
  release_dir: families/metabolome-plasma-2023/releases/2023-chen-pilot-80
  artifact_root: /data/opengwasdb
  artifact_subdir: metabolome-plasma-2023/releases/2023-chen-pilot-80
