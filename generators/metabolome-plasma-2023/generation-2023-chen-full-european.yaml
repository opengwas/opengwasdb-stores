store_id: OGS-00006
family: metabolome-plasma-2023
label: 2023-chen-full-european
_note: Lifted verbatim from the pre-ADR-0022 build.yaml. These are Phase B inputs -- source reading, effect-scale
  resolution, ancestry assignment, QC panel -- not Store build parameters. Retained for provenance; the
  Phase B design has not yet been written.
source:
  source_format: gwas-ssf
  source_reader_capability: opengwasdb.gwas-ssf
  source_genome_build: GRCh38
normalisation:
  target_reference_assembly: GRCh38
  liftover: null
effects:
  stored_effect_scale: sd
shape:
  association_coverage: signals_only
  ragged_region_policy: sig-trans-1mb_suggestive-leads
reference_resources:
- resource_id: ukb-ancestry-mixture-hg38
  kind: ancestry_mixture
  ancestry: null
  genome_build: GRCh38
  variant_id_convention: chr:pos:A1:A2 (A1 = min(allele1, allele2))
  allele_columns: null
  location: /data/opengwasdb/reference/ancestry-mixture/ref_freqs.hg38.tsv.gz
  location_kind: external_file
  fine_group_map: /data/opengwasdb/reference/ancestry-mixture/ancestry_groups.tsv
- resource_id: qc-panel-hg38
  kind: qc_panel
  ancestry: null
  genome_build: GRCh38
  variant_id_convention: chr:pos:A1:A2 (A1 = min(allele1, allele2))
  allele_columns: null
  location: reference-resources/qc-panel-hg38/qc_panel.tsv
  location_kind: tracked_file
  fine_group_map: null
effect_scale_validation:
  enabled: true
  reference_resources: []
  thresholds:
    maf_min: 0.01
    maf_max: 0.5
    min_overlap_variants: 20
    sd_tolerance: 0.15
    warning_multiplier: 2.0
    dispersion_max: 0.5
ancestry_assignment:
  enabled: true
  reference_resource_id: ukb-ancestry-mixture-hg38
  maf_floor: 0.01
  gates:
    tau: 0.5
    delta: 0.2
    n_min: 200
    residual_max: 0.06
qc_panel:
  enabled: true
  resource_id: qc-panel-hg38
